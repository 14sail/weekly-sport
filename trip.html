<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程行程</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgUDmlcV3PpiGdB989ba9FgFR637_ZKnA",
    authDomain: "weekly-sport.firebaseapp.com",
    databaseURL: "https://weekly-sport-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "weekly-sport",
    storageBucket: "weekly-sport.firebasestorage.app",
    messagingSenderId: "877154842539",
    appId: "1:877154842539:web:83b4500eaa33ca46fb44ee"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  window.db = getDatabase(app);
  window.dbRef = ref;
  window.dbGet = get;
  window.dbSet = set;

  signInAnonymously(auth)
    .catch((e)=>console.error('anonymous sign-in failed', e))
    .finally(()=>{
      window.firebaseReady = true;
      document.dispatchEvent(new Event('firebase-ready'));
    });
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #8A7A64;
    --line: #E4D9C4;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 18px; }

  header.top{ padding:26px 18px 16px; text-align:center; position:relative; }
  header.top .brand{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px;
    letter-spacing:.05em;
  }
  header.top .seed{ color:var(--accent); }
  header.top .who{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .card{
    background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-bottom:14px;
  }
  h1{ font-family:'Noto Serif TC',serif; font-size:19px; margin:0 0 8px; }
  h2{ font-size:16px; margin:0 0 10px; }
  p.desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent);
    color:#fff; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:500;
  }
  .btn.ghost{ background:transparent; color:var(--accent-deep); }
  .btn.wide{ display:block; width:100%; text-align:center; }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  .btn.danger{ background:var(--red); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:default; }

  input, select, textarea{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 11px; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent-soft); outline-offset:1px; }
  label.fld{ display:block; margin-bottom:10px; }
  label.fld > span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .msg{ font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; }
  .msg.err{ background:var(--red-soft); color:var(--red); }
  .msg.ok{ background:var(--green-soft); color:var(--green); }
  .msg.warn{ background:var(--amber-soft); color:#8a6220; }

  /* ---------- 旅程卡 ---------- */
  .trip-card{
    background:var(--bg-card); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    color:inherit; font-size:inherit;
  }
  .trip-card.done{ border-left-color:var(--ink-soft); opacity:.72; }
  .trip-card .tc-main{ flex:1; min-width:0; }
  .trip-card .tc-name{ font-weight:700; font-size:16px; }
  .trip-card .tc-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .trip-card .tc-go{ color:var(--accent); font-size:20px; }

  .tag{
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
    border:1px solid var(--line); color:var(--ink-soft); background:#fff; margin-left:6px;
  }
  .tag.hot{ border-color:var(--red); color:var(--red); background:var(--red-soft); }
  .tag.soft{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }

  /* ---------- 分頁 ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button{
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:13.5px;
  }
  .tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500; }

  /* ---------- 日期列 ---------- */
  .daybar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .daybar button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--bg-card);
    border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; color:var(--ink-soft);
    text-align:center; line-height:1.35;
  }
  .daybar button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .daybar button .d2{ display:block; font-size:11px; opacity:.8; }
  .daybar button.half{ border-style:dashed; }

  /* ---------- 時間軸 ---------- */
  .tl-item{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; position:relative;
  }
  .tl-item.pinned{ border-left:4px solid var(--amber); }
  .tl-item.conflict{ border-color:var(--red); background:var(--red-soft); }
  .tl-item.after-conflict{ border-left:4px solid var(--red); }
  .tl-item.dragging{ opacity:.4; }
  .tl-item.drop-target{ box-shadow:0 -3px 0 var(--accent); }

  .tl-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .tl-time{ font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .tl-item.conflict .tl-time{ color:var(--red); }
  .tl-name{ font-size:15px; font-weight:500; flex:1; min-width:0; }
  .tl-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6; }
  .tl-late{ font-size:12px; color:var(--red); font-weight:700; }

  .tl-ctrl{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .mini{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:var(--radius-sm); padding:5px 9px; font-size:12.5px; line-height:1.3;
  }
  .mini.on{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }
  .mini.warn{ border-color:var(--red); color:var(--red); }
  .mini.grab{ cursor:grab; }
  .spacer{ flex:1; }

  .move-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);
    padding:2px 14px 10px; margin-top:-4px;
  }
  .move-row input{ width:62px; padding:4px 7px; font-size:13px; text-align:center; }
  .move-row .line{ flex:1; height:1px; background:var(--line); }

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:22px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px;
  }

  /* ---------- 搜尋下拉 ---------- */
  .picker{ position:relative; }
  .picker-list{
    border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff;
    max-height:240px; overflow-y:auto; margin-top:6px;
  }
  .picker-list button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 12px; font-size:14px; color:inherit; border-bottom:1px solid var(--line);
  }
  .picker-list button:last-child{ border-bottom:0; }
  .picker-list button:hover{ background:var(--accent-soft); }
  .picker-list .pl-sub{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .picker-list .none{ padding:12px; font-size:13px; color:var(--ink-soft); }

  /* ---------- 景點庫 ---------- */
  .place-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .place-card .pc-name{ font-weight:600; font-size:15px; }
  .place-card .pc-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6; }
  .place-card .pc-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }

  .hint{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin-top:8px; }
  .foot{ text-align:center; margin-top:26px; }
  .foot button{ background:none; border:0; color:var(--ink-soft); font-size:13px; text-decoration:underline; }

  .switchbar{ display:flex; gap:8px; margin-bottom:14px; }
  .switchbar a{
    flex:1; text-align:center; text-decoration:none; font-size:13.5px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:8px 10px;
  }
  .switchbar a.on{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; font-weight:500; }


  /* Feather Icons 內嵌用 */
  .ic{ width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto; }
  .mini .ic, .btn .ic{ margin-right:.3em; }
  .mini.icon-only .ic, .btn .ic.only{ margin-right:0; }

  /* 離線唯讀：所有會改資料的控制項一律停用 */
  .offbar{
    display:flex; align-items:center; gap:9px;
    background:var(--amber-soft); border:1px solid var(--amber); color:#7d5716;
    border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:14px;
    font-size:13px; line-height:1.6;
  }
  .offbar .ic{ width:1.2em; height:1.2em; }
  button:disabled, input:disabled, select:disabled{ opacity:.4; cursor:not-allowed; }

  @media (max-width:480px){
    .row2{ grid-template-columns:1fr; }
    .desktop-only{ display:none !important; }
  }
  @media (min-width:481px){
    .mobile-only{ display:none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="seed">●</span> 旅程行程 <span class="seed">●</span></div>
  <div class="who" id="whoLine"></div>
</header>

<div class="wrap" id="app">
  <div class="card"><p class="desc">載入中…</p></div>
</div>

<script>
(function(){
  'use strict';

  const app = document.getElementById('app');
  const whoLine = document.getElementById('whoLine');

  // 圖示：Feather Icons 4.29.2（MIT License, https://feathericons.com）
  // 直接內嵌 SVG path，不連 CDN，離線一樣顯示得出來。
  const ICONS = {
    map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>',
    wallet:'<rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>',
    route:'<polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>',
    anchor:'<circle cx="12" cy="5" r="3"></circle><line x1="12" y1="22" x2="12" y2="8"></line><path d="M5 12H2a10 10 0 0 0 20 0h-3"></path>',
    transit:'<polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>',
    note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>',
    coord:'<circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line>',
    warn:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    up:'<polyline points="18 15 12 9 6 15"></polyline>',
    down:'<polyline points="6 9 12 15 18 9"></polyline>',
    grip:'<circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle>',
    trash:'<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
    edit:'<path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>',
    gear:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
    back:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
    offline:'<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path><line x1="1" y1="1" x2="23" y2="23"></line>',
    check:'<polyline points="20 6 9 17 4 12"></polyline>',
    link:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',
    arrowR:'<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
    chevR:'<polyline points="9 18 15 12 9 6"></polyline>'
  };
  function ic(name){
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }

  // ================= Storage（與 index.html 同一層 data/ 節點） =================
  function safeKey(key){ return key.replace(/[.#$\[\]]/g, '_'); }

  async function sGet(key){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data/' + safeKey(key)));
      if(!snap.exists()) return null;
      return JSON.parse(snap.val());
    }catch(e){ console.error('sGet error', key, e); return null; }
  }
  async function sSet(key, val){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), JSON.stringify(val));
      return true;
    }catch(e){ console.error('sSet error', key, e); return false; }
  }
  async function sDelete(key){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), null);
      return true;
    }catch(e){ console.error('sDelete error', key, e); return false; }
  }
  // 一次把整包 data 撈下來再自己篩前綴。資料量小（一個站全部），比逐 key 查快很多。
  async function sAll(){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data'));
      if(!snap.exists()) return {};
      return snap.val() || {};
    }catch(e){ console.error('sAll error', e); return null; }
  }
  function parseVal(raw){
    if(raw === undefined || raw === null) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }

  // ================= 離線快取 =================
  // 讀得到 Firebase 就順手存一份；讀不到就用快取撐著（唯讀）。
  const CACHE_KEY = 'trip-cache-v1';
  let offline = false;

  // 整包 data 裡的 people-list 帶著所有人的明碼密碼。主站只放在記憶體裡，
  // 寫進 localStorage 等於把它落地到硬碟、跨分頁跨關機都還在，共用電腦上會外流。
  // 登入只需要 id 與名字，所以存進快取前先把 password 拔掉。
  function stripSecrets(all){
    const out = {};
    Object.keys(all).forEach(k=>{ out[k] = all[k]; });
    try{
      const raw = out['people-list'];
      if(raw){
        const list = JSON.parse(raw);
        if(Array.isArray(list)){
          out['people-list'] = JSON.stringify(list.map(p=>{
            const c = Object.assign({}, p);
            delete c.password;
            return c;
          }));
        }
      }
    }catch(e){ delete out['people-list']; }   // 剖析不了就整個不要快取，寧可不能離線登入
    return out;
  }
  function writeCache(all){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), all:stripSecrets(all)})); }catch(e){}
  }
  function readCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  // ================= 狀態 =================
  let people = [];
  let allData = {};          // 整包 data 的原始（字串）副本
  let me = null;             // 目前登入者 id
  let view = 'pick';
  let msg = null;            // {type, text}

  let trips = [];            // [{...}]
  let curTripId = null;
  let places = [];           // 目前旅程的景點
  let items = [];            // 目前旅程的所有行程項目
  let curDate = null;
  let tab = 'timeline';      // timeline | places
  let pickerOpen = false;
  let pickerQuery = '';

  // 只記「上次是誰」，不是憑證。快取已經沒有密碼，離線重開瀏覽器時
  // 靠這個才進得去唯讀模式；否則會變成沒網路就完全打不開。
  const SESSION_KEY = 'trip-me';
  function rememberMe(id){
    try{ id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  function recallMe(){
    try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; }
  }

  // ================= 小工具 =================
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function personName(id){
    const p = people.find(x=>x.id===id);
    return p ? p.name : '(已離開的成員)';

  const WD = ['日','一','二','三','四','五','六'];
  function toKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fromKey(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  // 日期運算一律走這裡，讓 JS 自己處理月底與閏年，不要自己加減字串。
  function shiftDate(k, n){
    const d = fromKey(k);
    return toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n));
  }
  function dateRange(start, end){
    const out = [];
    let cur = start;
    let guard = 0;
    while(guard++ < 400){
      out.push(cur);
      if(cur === end) break;
      cur = shiftDate(cur, 1);
    }
    return out;
  }
  function dayLabel(k){
    const d = fromKey(k);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function dayWd(k){ return '週' + WD[fromKey(k).getDay()]; }

  // 分鐘 <-> "HH:MM"
  function toMin(hhmm){
    if(!hhmm) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm.trim());
    if(!m) return null;
    return Number(m[1])*60 + Number(m[2]);
  }
  function toHHMM(min){
    if(min == null) return '--:--';
    let m = Math.round(min);
    const sign = m < 0 ? '-' : '';
    m = Math.abs(m);
    const dayOver = Math.floor(m / 1440);
    const rest = m % 1440;
    const s = sign + String(Math.floor(rest/60)).padStart(2,'0') + ':' + String(rest%60).padStart(2,'0');
    return dayOver > 0 ? s + ' (+' + dayOver + ')' : s;
  }

  // ================= 地圖服務 =================
  const APPNAME = '14sail.github.io';

  function mapQuery(place){
    return (place.localName && place.localName.trim()) ? place.localName.trim() : place.name;
  }
  function webMapUrl(trip, place){
    if(place.mapUrl && place.mapUrl.trim()) return place.mapUrl.trim();
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'https://map.naver.com/p/search/' + q
      : 'https://www.google.com/maps/search/?api=1&query=' + q;
  }
  function appMapUrl(trip, place){
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'nmap://search?query=' + q + '&appname=' + APPNAME
      : 'comgooglemaps://?q=' + q;
  }
  function appRouteUrl(trip, from, to){
    if(trip.mapProvider !== 'naver') return null;
    if(!to || to.lat == null || to.lng == null) return null;
    let u = 'nmap://route/public?dlat=' + to.lat + '&dlng=' + to.lng +
            '&dname=' + encodeURIComponent(mapQuery(to));
    if(from && from.lat != null && from.lng != null){
      u += '&slat=' + from.lat + '&slng=' + from.lng + '&sname=' + encodeURIComponent(mapQuery(from));
    }
    return u + '&appname=' + APPNAME;
  }
  function webRouteUrl(trip, from, to){
    if(trip.mapProvider === 'naver'){
      return 'https://map.naver.com/p/directions/-/-/-/transit';
    }
    const d = encodeURIComponent(mapQuery(to));
    const s = from ? encodeURIComponent(mapQuery(from)) : '';
    return 'https://www.google.com/maps/dir/?api=1&destination=' + d + (s ? '&origin=' + s : '') + '&travelmode=transit';
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // 手機才試 App scheme；1.2 秒內沒跳走就退回網頁版，沒裝 App 也不會卡死。
  function openMap(scheme, web){
    if(!isMobile || !scheme){ window.open(web, '_blank', 'noopener'); return; }
    let done = false;
    const bail = ()=>{ done = true; };
    window.addEventListener('pagehide', bail, {once:true});
    document.addEventListener('visibilitychange', bail, {once:true});
    setTimeout(()=>{
      window.removeEventListener('pagehide', bail);
      if(!done && !document.hidden) window.location.href = web;
    }, 1200);
    window.location.href = scheme;
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      // clipboard API 在非 https 或舊瀏覽器會失敗，退回舊做法
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(e2){ return false; }
    }
  }

  // ================= 時間軸推算 =================
  // 核心規則：抵達時間永不存進資料庫，一律即時算。
  // 每個項目只存 stayMin（停留）與 moveMin（到下一站）；pinTime 有值就是釘選。
  function computeDay(dayItems, defaultStart){
    const rows = [];
    let cur = null;
    let conflicted = false;

    dayItems.forEach((it, idx)=>{
      const pin = toMin(it.pinTime);
      let arrive, lateBy = 0, slack = null;

      if(pin != null){
        if(cur == null || cur <= pin){
          slack = cur == null ? null : pin - cur;
          arrive = pin;
        }else{
          // 前面拖太久，撞上釘選項目
          arrive = cur;
          lateBy = cur - pin;
          conflicted = true;
        }
      }else{
        arrive = (cur == null) ? (toMin(defaultStart) ?? 9*60) : cur;
      }

      const stay = Number(it.stayMin) || 0;
      const move = Number(it.moveMin) || 0;
      const depart = arrive + stay;
      cur = depart + move;

      rows.push({
        item: it, idx,
        arrive, depart, stay, move,
        pinned: pin != null,
        lateBy, slack,
        afterConflict: conflicted && lateBy === 0
      });
    });

    return rows;
  }

  // ================= 資料載入 =================
  function hydrate(all){
    allData = all;
    people = parseVal(all['people-list']) || [];

    trips = [];
    Object.keys(all).forEach(k=>{
      if(k.startsWith('trip:')){
        const t = parseVal(all[k]);
        if(t && t.id) trips.push(t);
      }
    });
    trips.sort((a,b)=> String(b.startDate||'').localeCompare(String(a.startDate||'')));
  }

  function loadTripChildren(tripId){
    places = [];
    items = [];
    const pPrefix = safeKey('trip-place:' + tripId + ':');
    const iPrefix = safeKey('trip-item:' + tripId + ':');
    Object.keys(allData).forEach(k=>{
      if(k.startsWith(pPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) places.push(v);
      }else if(k.startsWith(iPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) items.push(v);
      }
    });
    places.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant'));
    items.sort((a,b)=> (a.order||0) - (b.order||0));
  }

  async function refresh(){
    const all = await sAll();
    if(all === null){
      const cache = readCache();
      if(cache && cache.all){
        offline = true;
        hydrate(cache.all);
        msg = {type:'warn', text:'目前連不上資料庫，顯示的是離線快取（' + new Date(cache.at).toLocaleString('zh-TW') + '），這個狀態下的修改不會被儲存。'};
        return;
      }
      offline = true;
      msg = {type:'err', text:'連不上資料庫，而且本機沒有快取。請檢查網路後重新整理。'};
      hydrate({});
      return;
    }
    offline = false;
    hydrate(all);
    writeCache(all);
  }

  // 單筆寫入：每個項目自己一個 key，兩個人同時改不同項目不會互相蓋掉。
  async function putTrip(t){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip:' + t.id, t);
    if(ok) allData[safeKey('trip:' + t.id)] = JSON.stringify(t);
    return ok;
  }
  async function putPlace(tripId, p){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-place:' + tripId + ':' + p.id, p);
    if(ok) allData[safeKey('trip-place:' + tripId + ':' + p.id)] = JSON.stringify(p);
    return ok;
  }
  async function delPlace(tripId, placeId){
    if(offline) return false;
    const ok = await sDelete('trip-place:' + tripId + ':' + placeId);
    if(ok) delete allData[safeKey('trip-place:' + tripId + ':' + placeId)];
    return ok;
  }
  async function putItem(tripId, date, it){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-item:' + tripId + ':' + date + ':' + it.id, it);
    if(ok) allData[safeKey('trip-item:' + tripId + ':' + date + ':' + it.id)] = JSON.stringify(it);
    return ok;
  }
  async function delItem(tripId, date, itemId){
    if(offline) return false;
    const ok = await sDelete('trip-item:' + tripId + ':' + date + ':' + itemId);
    if(ok) delete allData[safeKey('trip-item:' + tripId + ':' + date + ':' + itemId)];
    return ok;
  }

      '<div style="flex:1;min-width:0"><h1 style="margin:0">' + esc(t.name) + '</h1>' +
      '<div class="tc-meta" style="font-size:12.5px;color:var(--ink-soft);margin-top:3px">' +
        esc(t.startDate) + ' → ' + esc(t.endDate) + '　' + dates.length + ' 天　' +
        (t.mapProvider==='naver'?'NAVER':'Google') + '</div></div>' +
      '<button class="mini" id="editTrip">' + ic('gear') + '設定</button></div></div>';

    h += '<div class="tabs">' +
      '<button data-tab="timeline" data-nav class="' + (tab==='timeline'?'on':'') + '">時間軸</button>' +
      '<button data-tab="places" data-nav class="' + (tab==='places'?'on':'') + '">景點庫 ' + places.length + '</button>' +
      '</div>';

    if(tab === 'timeline') h += timelineHtml(t, dates);
    else h += placesHtml(t);

    h += '<div class="foot"><button id="back" data-nav>' + ic('back') + ' 回旅程列表</button></div>';
    app.innerHTML = h;

    document.getElementById('editTrip').onclick = ()=>{ editingTrip = t; view='tripForm'; render(); };
    document.getElementById('back').onclick = ()=>{ view='list'; render(); };
    app.querySelectorAll('[data-tab]').forEach(b=>{
      b.onclick = ()=>{ tab = b.dataset.tab; pickerOpen = false; render(); };
    });

    if(tab === 'timeline') wireTimeline(t, dates);
    else wirePlaces(t);
  }

  // ---------- 時間軸 ----------
  function timelineHtml(t, dates){
    let h = '<div class="daybar">';
    dates.forEach((d,i)=>{
      const n = dayItems(d).length;
      const half = (i===0 || i===dates.length-1);
      h += '<button data-day="' + d + '" data-nav class="' + (d===curDate?'on':'') + (half?' half':'') + '">' +
           dayLabel(d) + '<span class="d2">' + dayWd(d) + (n?'・'+n:'') + '</span></button>';
    });
    h += '</div>';

    const rows = computeDay(dayItems(curDate), t.dayStart);

    if(!rows.length){
      h += '<div class="empty">' + dayLabel(curDate) + ' 還沒有行程。<br>用下面的搜尋框從景點庫挑一個加進來。</div>';
    }

    rows.forEach((r, i)=>{
      const p = placeById(r.item.placeId);
      const name = p ? p.name : '(景點已刪除)';
      const cls = ['tl-item'];
      if(r.pinned) cls.push('pinned');
      if(r.lateBy > 0) cls.push('conflict');
      else if(r.afterConflict) cls.push('after-conflict');

      h += '<div class="' + cls.join(' ') + '" data-item="' + esc(r.item.id) + '" data-idx="' + i + '"' +
           (isMobile?'':' draggable="true"') + '>';
      h += '<div class="tl-head">' +
           '<span class="tl-time">' + toHHMM(r.arrive) + '</span>' +
           '<span class="tl-name">' + esc(name) +
             (r.pinned ? '<span class="tag hot">釘選 ' + esc(r.item.pinTime) + '</span>' : '') +
           '</span></div>';

      let sub = '停留 ' + r.stay + ' 分　→ ' + toHHMM(r.depart);
      if(p && p.transitNote) sub += '<br>' + ic('transit') + ' ' + esc(p.transitNote);
      if(r.item.note) sub += '<br>' + ic('note') + ' ' + esc(r.item.note);
      h += '<div class="tl-sub">' + sub + '</div>';

      if(r.lateBy > 0){
        h += '<div class="tl-sub tl-late">' + ic('warn') + ' 比釘選時間晚了 ' + r.lateBy + ' 分鐘，前面要砍掉這麼多時間。</div>';
      }else if(r.pinned && r.slack != null && r.slack > 0){
        h += '<div class="tl-sub">空檔 ' + r.slack + ' 分</div>';
      }

      h += '<div class="tl-ctrl">' +
        '<button class="mini" data-stay="-15" data-id="' + esc(r.item.id) + '">−15 分</button>' +
        '<button class="mini" data-stay="15" data-id="' + esc(r.item.id) + '">＋15 分</button>' +
        '<button class="mini' + (r.pinned?' on':'') + '" data-pin="' + esc(r.item.id) + '">' +
          (r.pinned ? ic('anchor') + '取消釘選' : ic('anchor') + '釘選') + '</button>';

      if(p){
        h += '<button class="mini" data-nav data-copy="' + esc(p.id) + '">' + ic('copy') + '複製名稱</button>' +
             '<button class="mini" data-nav data-map="' + esc(p.id) + '">' + ic('pin') + '地圖</button>';
        if(i > 0){
          h += '<button class="mini" data-nav data-route="' + esc(p.id) + '" data-from="' +
               esc(rows[i-1].item.placeId) + '">' + ic('route') + '路線</button>';
        }
      }

      h += '<span class="spacer"></span>';
      if(isMobile){
        h += '<button class="mini icon-only" data-mv="up" data-id="' + esc(r.item.id) + '"' + (i===0?' disabled':'') + ' aria-label="往前移">' + ic('up') + '</button>' +
             '<button class="mini icon-only" data-mv="down" data-id="' + esc(r.item.id) + '"' + (i===rows.length-1?' disabled':'') + ' aria-label="往後移">' + ic('down') + '</button>';
      }else{
        h += '<span class="mini grab icon-only" title="拖我換順序">' + ic('grip') + '</span>';
      }
      h += '<button class="mini warn" data-del="' + esc(r.item.id) + '">' + ic('trash') + '刪除</button>';
      h += '</div></div>';

      if(i < rows.length-1){
        h += '<div class="move-row"><span class="line"></span>移動 ' +
             '<input type="number" min="0" step="5" value="' + r.move + '" data-move="' + esc(r.item.id) + '"> 分' +
             '<span class="line"></span></div>';
      }
    });

    // 新增：帶搜尋框的下拉
    h += '<div class="card" style="margin-top:14px">';
    if(!pickerOpen){
      h += '<button class="btn wide ghost" id="openPicker">' + ic('plus') + '加入景點到 ' + dayLabel(curDate) + '</button>';
    }else{
      h += '<label class="fld"><span>從景點庫挑，或直接打新名字建立</span>' +
           '<input id="pq" placeholder="輸入名稱搜尋…" value="' + esc(pickerQuery) + '" autocomplete="off"></label>';
      const q = pickerQuery.trim().toLowerCase();
      const hit = places.filter(p=>{
        if(!q) return true;
        return (p.name||'').toLowerCase().includes(q) || (p.localName||'').toLowerCase().includes(q);
      });
      h += '<div class="picker-list">';
      if(hit.length){
        hit.forEach(p=>{
          h += '<button data-add="' + esc(p.id) + '">' + esc(p.name) +
               '<span class="pl-sub">' + esc(p.category||'') +
               (p.localName?'　'+esc(p.localName):'') + '　預設 ' + (p.stayMin||60) + ' 分</span></button>';
        });
      }else{
        h += '<div class="none">景點庫沒有符合的。</div>';
      }
      h += '</div>';
      // 這顆鈕一定要先存在，之後打字才有東西可以顯示／更新。
      // 原本只在 pickerQuery 非空時才產生，但每條開啟 picker 的路徑都先把它清空，
      // 於是 oninput 裡的 getElementById('quickNew') 永遠是 null，這顆鈕永遠出不來。
      h += '<button class="btn wide" id="quickNew" style="margin-top:10px;display:' +
           (pickerQuery.trim() ? 'block' : 'none') + '">' + ic('plus') +
           '直接新增「<span id="qnName">' + esc(pickerQuery.trim()) + '</span>」並排進來</button>';
      h += '<button class="btn wide ghost" id="closePicker" style="margin-top:8px">取消</button>';
    }
    h += '</div>';

    if(!isMobile && rows.length > 1){
      h += '<p class="hint desktop-only">電腦版可以直接拖拉項目換順序。手機版改用上下移動鈕，因為 iOS Safari 不支援 HTML5 拖拉。</p>';
    }
    return h;
  }

  function wireTimeline(t, dates){
    app.querySelectorAll('[data-day]').forEach(b=>{
      b.onclick = ()=>{ curDate = b.dataset.day; pickerOpen=false; render(); };
    });

    const findItem = (id)=> items.find(i=>i.id===id);

    app.querySelectorAll('[data-stay]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        it.stayMin = Math.max(0, (Number(it.stayMin)||0) + Number(b.dataset.stay));
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-move]').forEach(inp=>{
      inp.onchange = async ()=>{
        const it = findItem(inp.dataset.move);
        if(!it) return;
        it.moveMin = Math.max(0, Number(inp.value)||0);
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-pin]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.pin);
        if(!it) return;
        if(it.pinTime){
          it.pinTime = null;
        }else{
          const rows = computeDay(dayItems(curDate), t.dayStart);
          const r = rows.find(x=>x.item.id===it.id);
          const suggest = r ? toHHMM(r.arrive).slice(0,5) : '12:00';
          const v = window.prompt('釘選成固定時間（24 小時制 HH:MM）\n例如演唱會 19:00、班機 20:45', suggest);
          if(v === null) return;
          if(toMin(v) == null){ msg={type:'err',text:'時間格式要像 19:00 這樣。'}; render(); return; }
          it.pinTime = v.trim();
        }
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-mv]').forEach(b=>{
      b.onclick = async ()=>{
        const list = dayItems(curDate);
        const i = list.findIndex(x=>x.id===b.dataset.id);
        const j = b.dataset.mv === 'up' ? i-1 : i+1;
        if(i<0 || j<0 || j>=list.length) return;
        // 兩個人同時新增會算出一樣的 order，這時互換等於沒換、按鈕看起來壞掉。
        // 先把當天重新編號成 10/20/30…，再交換，才保證一定動得了。
        for(let k=0; k<list.length; k++){
          if(list[k].order !== (k+1)*10){
            list[k].order = (k+1)*10;
            await putItem(curTripId, list[k].date, list[k]);
          }
        }
        const a = list[i], c = list[j];
        const tmp = a.order; a.order = c.order; c.order = tmp;
        await putItem(curTripId, a.date, a);
        await putItem(curTripId, c.date, c);
        render();
      };
    });

    app.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.del);
        if(!it) return;
        const p = placeById(it.placeId);
        if(!window.confirm('把「' + (p?p.name:'這個項目') + '」從 ' + dayLabel(curDate) + ' 移除？\n景點本身會留在景點庫。')) return;
        await delItem(curTripId, it.date, it.id);
        items = items.filter(x=>x.id!==it.id);
        render();
      };
    });

    app.querySelectorAll('[data-copy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.copy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」，貼到地圖搜尋框就好。'}
                 : {type:'err', text:'複製失敗，請長按手動選取：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-map]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.map);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
    app.querySelectorAll('[data-route]').forEach(b=>{
      b.onclick = ()=>{
        const to = placeById(b.dataset.route);
        const from = placeById(b.dataset.from);
        const scheme = appRouteUrl(t, from, to);
        if(t.mapProvider === 'naver' && !scheme){
          msg = {type:'warn', text:'NAVER 算路線需要起訖座標。「' + to.name + '」還沒填座標，先幫你複製名稱去搜。'};
          copyText(mapQuery(to));
          render();
          return;
        }
        openMap(scheme, webRouteUrl(t, from, to));
      };
    });

    // 新增景點到今天
    const openBtn = document.getElementById('openPicker');
    if(openBtn) openBtn.onclick = ()=>{ pickerOpen = true; pickerQuery=''; render(); };
    const closeBtn = document.getElementById('closePicker');
    if(closeBtn) closeBtn.onclick = ()=>{ pickerOpen = false; render(); };

    const pq = document.getElementById('pq');
    if(pq){
      pq.focus();
      pq.value = pickerQuery;
      pq.oninput = ()=>{
        pickerQuery = pq.value;
        // 只重繪清單，不整頁重繪，免得洗掉正在打的字
        const q = pickerQuery.trim().toLowerCase();
        const list = app.querySelector('.picker-list');
        const hit = places.filter(p=> !q || (p.name||'').toLowerCase().includes(q) || (p.localName||'').toLowerCase().includes(q));
        list.innerHTML = hit.length
          ? hit.map(p=>'<button data-add="' + esc(p.id) + '">' + esc(p.name) +
              '<span class="pl-sub">' + esc(p.category||'') + (p.localName?'　'+esc(p.localName):'') +
              '　預設 ' + (p.stayMin||60) + ' 分</span></button>').join('')
          : '<div class="none">景點庫沒有符合的。</div>';
        list.querySelectorAll('[data-add]').forEach(bindAdd);
        const qn = document.getElementById('quickNew');
        const nm = document.getElementById('qnName');
        if(nm) nm.textContent = pickerQuery.trim();
        if(qn) qn.style.display = pickerQuery.trim() ? 'block' : 'none';
      };
    }

    function bindAdd(b){
      b.onclick = async ()=>{ await addToDay(b.dataset.add); };
    }
    app.querySelectorAll('[data-add]').forEach(bindAdd);

    const qn = document.getElementById('quickNew');
    if(qn){
      qn.onclick = async ()=>{
        const name = pickerQuery.trim();
        if(!name) return;
        const p = {
          id: uid('pl'), name, localName:'', mapUrl:'', lat:null, lng:null,
          transitNote:'', category:'景點', stayMin:60,
          createdBy: me, savedAt:new Date().toISOString()
        };
        const ok = await putPlace(curTripId, p);
        if(!ok){ render(); return; }
        places.push(p);
        places.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant'));
        await addToDay(p.id);
      };
    }

    async function addToDay(placeId){
      const p = placeById(placeId);
      const list = dayItems(curDate);
      const it = {
        id: uid('ti'), date: curDate, placeId,
        order: list.length ? (list[list.length-1].order||0) + 10 : 10,
        stayMin: p ? (p.stayMin||60) : 60,
        moveMin: 20,
        pinTime: null, note:'',
        createdBy: me, savedAt:new Date().toISOString()
      };
      const ok = await putItem(curTripId, curDate, it);
      if(!ok){ render(); return; }
      items.push(it);
      pickerOpen = false;
      pickerQuery = '';
      render();
    }

    // 電腦版拖拉排序
    if(!isMobile){
      let dragId = null;
      app.querySelectorAll('.tl-item').forEach(el=>{
        el.addEventListener('dragstart', (e)=>{
          dragId = el.dataset.item;
          el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
        });
        el.addEventListener('dragend', ()=>{
          el.classList.remove('dragging');
          app.querySelectorAll('.tl-item').forEach(x=>x.classList.remove('drop-target'));
        });
        el.addEventListener('dragover', (e)=>{
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if(el.dataset.item !== dragId) el.classList.add('drop-target');
        });
        el.addEventListener('dragleave', ()=>{ el.classList.remove('drop-target'); });
        el.addEventListener('drop', async (e)=>{
          e.preventDefault();
          el.classList.remove('drop-target');
          const targetId = el.dataset.item;
          if(!dragId || dragId === targetId) return;
          const list = dayItems(curDate);
          const from = list.findIndex(x=>x.id===dragId);
          const to = list.findIndex(x=>x.id===targetId);
          if(from<0 || to<0) return;
          const moved = list.splice(from,1)[0];
          list.splice(to,0,moved);
          // 重新發號，一次寫回所有受影響的項目
          for(let i=0;i<list.length;i++){
            if(list[i].order !== (i+1)*10){
              list[i].order = (i+1)*10;
              await putItem(curTripId, list[i].date, list[i]);
            }
          }
          render();
        });
      });
    }
  }

  // ---------- 景點庫 ----------
  let editingPlace = null;

  function placesHtml(t){
    const used = new Set(items.map(i=>i.placeId));
    let h = '';

    if(editingPlace !== null){
      const p = editingPlace;
      const isNew = !p.id;
      h += '<div class="card"><h2>' + (isNew?'新增景點':'編輯景點') + '</h2>' +
        '<label class="fld"><span>顯示名（你自己看得懂的）</span><input id="qName" value="' + esc(p.name||'') + '"></label>';

      if(t.needsLocalName){
        const lbl = t.mapProvider === 'naver' ? '韓文名（給 NAVER 搜尋用）' : '當地語名稱（給地圖搜尋用）';
        h += '<label class="fld"><span>' + lbl + '</span><input id="qLocal" value="' + esc(p.localName||'') + '" placeholder="교촌치킨 홍대점"></label>';
      }

      h += '<div class="row2">' +
        '<label class="fld"><span>分類</span><select id="qCat">' +
          ['飯店','場館','餐廳','景點','購物','交通'].map(c=>

        '</select></label>' +
        '<label class="fld"><span>預設停留（分）</span><input id="qStay" type="number" min="0" step="15" value="' + (p.stayMin||60) + '"></label>' +
      '</div>';

      h += '<label class="fld"><span>地圖連結（選填，貼了就優先用）</span><input id="qUrl" value="' + esc(p.mapUrl||'') + '" placeholder="https://naver.me/…"></label>';

      if(t.mapProvider === 'naver'){
        h += '<div class="row2">' +
          '<label class="fld"><span>緯度 lat（選填）</span><input id="qLat" value="' + (p.lat==null?'':p.lat) + '" placeholder="37.5563"></label>' +
          '<label class="fld"><span>經度 lng（選填）</span><input id="qLng" value="' + (p.lng==null?'':p.lng) + '" placeholder="126.9236"></label>' +
        '</div><p class="hint">座標只影響「路線」按鈕能不能一鍵開。沒填也完全不影響排行程。</p>';
      }

      h += '<label class="fld"><span>交通備註（自由文字）</span><input id="qNote" value="' + esc(p.transitNote||'') + '" placeholder="弘大入口站 9 號出口走 5 分"></label>';
      h += '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button class="btn" id="qSave" style="flex:1">儲存</button>' +
        '<button class="btn ghost" id="qCancel">取消</button></div></div>';
    }else{
      h += '<button class="btn wide" id="newPlace" style="margin-bottom:12px">' + ic('plus') + '新增景點</button>';
    }

    if(!places.length){
      h += '<div class="empty">景點庫是空的。先新增幾個地點，再排進時間軸。</div>';
    }

    places.forEach(p=>{
      const inUse = used.has(p.id);
      h += '<div class="place-card">' +
        '<div class="pc-name">' + esc(p.name) +
          '<span class="tag">' + esc(p.category||'景點') + '</span>' +
          (inUse ? '' : '<span class="tag soft">口袋名單</span>') + '</div>';
      let sub = '預設停留 ' + (p.stayMin||60) + ' 分';
      if(p.localName) sub += '　' + esc(p.localName);
      if(p.lat != null && p.lng != null) sub += '　' + ic('coord') + ' 有座標';
      if(p.transitNote) sub += '<br>' + ic('transit') + ' ' + esc(p.transitNote);
      h += '<div class="pc-sub">' + sub + '</div>';
      h += '<div class="pc-btns">' +
        '<button class="mini" data-nav data-pcopy="' + esc(p.id) + '">' + ic('copy') + '複製名稱</button>' +
        '<button class="mini" data-nav data-pmap="' + esc(p.id) + '">' + ic('pin') + '地圖</button>' +
        '<button class="mini" data-pedit="' + esc(p.id) + '">' + ic('edit') + '編輯</button>' +
        '<button class="mini warn" data-pdel="' + esc(p.id) + '">' + ic('trash') + '刪除</button>' +
        '</div></div>';
    });
    return h;
  }

  function wirePlaces(t){
    const nb = document.getElementById('newPlace');
    if(nb) nb.onclick = ()=>{
      editingPlace = {id:'', name:'', localName:'', mapUrl:'', lat:null, lng:null, transitNote:'', category:'景點', stayMin:60};
      render();
    };

    const cancel = document.getElementById('qCancel');
    if(cancel) cancel.onclick = ()=>{ editingPlace = null; render(); };

    const save = document.getElementById('qSave');
    if(save) save.onclick = async ()=>{
      const name = document.getElementById('qName').value.trim();
      if(!name){ msg={type:'err',text:'請填顯示名。'}; render(); return; }
      const lat = document.getElementById('qLat');
      const lng = document.getElementById('qLng');
      const local = document.getElementById('qLocal');
      // 欄位沒出現在畫面上時（台灣／日本模式沒有座標欄）要沿用原值，不能當成「使用者清空」。
      // 另外非數字要擋下來，否則會存進 NaN，之後 p.lat != null 仍成立，
      // 畫面顯示「有座標」但路線網址會變成 dlat=NaN。
      function coordOf(el, prev){
        if(!el) return (prev == null ? null : prev);
        const v = el.value.trim();
        if(v === '') return null;
        const n = Number(v);
        return isFinite(n) ? n : undefined;   // undefined 代表格式錯誤
      }
      const latVal = coordOf(lat, editingPlace.lat);
      const lngVal = coordOf(lng, editingPlace.lng);
      if(latVal === undefined || lngVal === undefined){
        msg = {type:'err', text:'座標要填數字，例如 37.5563 / 126.9236。'};
        render(); return;
      }
      const rec = {
        id: editingPlace.id || uid('pl'),
        name,
        localName: local ? local.value.trim() : (editingPlace.localName||''),
        category: document.getElementById('qCat').value,
        stayMin: Math.max(0, Number(document.getElementById('qStay').value)||60),
        mapUrl: document.getElementById('qUrl').value.trim(),
        lat: latVal,
        lng: lngVal,
        transitNote: document.getElementById('qNote').value.trim(),
        createdBy: editingPlace.createdBy || me,
        savedAt: new Date().toISOString()
      };
      const ok = await putPlace(curTripId, rec);
      if(!ok){ render(); return; }
      const i = places.findIndex(x=>x.id===rec.id);
      if(i>=0) places[i] = rec; else places.push(rec);
      places.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant'));
      editingPlace = null;
      msg = {type:'ok', text:'已儲存。'};
      render();
    };

    app.querySelectorAll('[data-pedit]').forEach(b=>{
      b.onclick = ()=>{ editingPlace = Object.assign({}, placeById(b.dataset.pedit)); render(); };
    });
    app.querySelectorAll('[data-pdel]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pdel);
        const uses = items.filter(i=>i.placeId===p.id);
        const extra = uses.length ? '\n\n它已經被排進 ' + uses.length + ' 個行程項目，那些項目也會一起刪掉。' : '';
        if(!window.confirm('刪除景點「' + p.name + '」？' + extra)) return;
        for(const it of uses){
          await delItem(curTripId, it.date, it.id);
        }
        items = items.filter(i=>i.placeId!==p.id);
        await delPlace(curTripId, p.id);
        places = places.filter(x=>x.id!==p.id);
        msg = {type:'ok', text:'已刪除。'};
        render();
      };
    });
    app.querySelectorAll('[data-pcopy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pcopy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」。'} : {type:'err', text:'複製失敗：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-pmap]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.pmap);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
  }

  // ================= 啟動 =================
  function waitForFirebase(){
    return new Promise((resolve)=>{
      if(window.firebaseReady){ resolve(); return; }
      document.addEventListener('firebase-ready', ()=>resolve(), {once:true});
      setTimeout(()=>resolve(), 3000);
    });
  }

  async function init(){
    await waitForFirebase();
    await refresh();

    const saved = recallMe();
    if(saved && people.some(p=>p.id===saved)){
      me = saved;
      view = 'list';
    }else{
      view = 'pick';
      if(offline) msg = {type:'warn', text:'離線中而且這台裝置還沒登入過。請先連上網路登入一次，之後沒網路也進得來。'};
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
