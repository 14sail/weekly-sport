<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>本週運動</title>

<!-- ============================================================
     Firebase 設定：請將下面的 firebaseConfig 換成你自己 Firebase
     專案的設定值（在 Firebase Console > 專案設定 > 一般 可以找到）
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Your web app's Firebase configuration
  // ⚠️ 這是測試專案 weekly-sport-test，資料跟正式站完全分開，僅供開發驗證用。
  const firebaseConfig = {
    apiKey: "AIzaSyCM3vjVCn1jN_koNyZr2xL0z6ikledqG_0",
    authDomain: "weekly-sport-test.firebaseapp.com",
    databaseURL: "https://weekly-sport-test-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "weekly-sport-test",
    storageBucket: "weekly-sport-test.firebasestorage.app",
    messagingSenderId: "377712374301",
    appId: "1:377712374301:web:1168a4a1cb16616c9f4cf4"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.db = getDatabase(app);
  window.dbRef = ref;
  window.dbGet = get;
  window.dbSet = set;

  // 匿名登入：讓 Realtime Database 規則可以要求 "auth != null"，
  // 擋掉單純拿 apiKey 直接打 REST API 的存取，登入過程對使用者無感。
  signInAnonymously(auth)
    .catch((e)=>console.error('anonymous sign-in failed', e))
    .finally(()=>{
      window.firebaseReady = true;
      document.dispatchEvent(new Event('firebase-ready'));
    });
</script>

<!-- 姊妹行事曆的折線圖用。鎖定版本、defer 載入，載不到也只是圖表區顯示提示，不影響其他畫面。 -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #8A7A64;
    --line: #E4D9C4;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:0 18px; }

  header.top{
    padding:28px 18px 20px;
    text-align:center;
    position:relative;
  }
  header.top .brand{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:2px;
    color:var(--accent-deep);
  }
  header.top .brand .seed{ color:var(--green); font-size:10px; vertical-align:middle; }
  header.top .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:3px;
  }

  /* 右上角常駐的兩顆圓鈕：小房子＝回自己的首頁，齒輪＝修改資料。
     改成純圖示後標題列騰出不少空間，手機上比原本的文字按鈕好排多了。 */
  .corner-btn{
    position:fixed;
    top:14px;
    right:14px;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    padding:0;
    color:var(--accent);
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow:0 2px 6px rgba(122,90,54,0.10);
    cursor:pointer;
    z-index:20;
  }
  .corner-btn.edit-profile{ right:60px; }
  .corner-btn svg{
    width:20px; height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .corner-btn:active{ background:var(--accent-soft); transform:scale(0.94); }
  .corner-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (max-width:560px){
    body.has-corner-buttons header.top{ padding-right:104px; }
  }

  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(122,90,54,0.06);
  }

  /* 偷看老師視角：整頁蓋上一層淡淡的布紋，卡片邊框改虛線＋掛一個標籤，
     提醒這是「掀開來看一眼」的唯讀畫面，不是真正的老師視角 */
  body.peek-mode{
    background-image: repeating-linear-gradient(135deg, rgba(122,90,54,0.045) 0px, rgba(122,90,54,0.045) 10px, transparent 10px, transparent 20px);
  }
  body.peek-mode .card{
    position:relative;
    border:1.5px dashed var(--accent);
    background:rgba(255,253,248,0.9);
    margin-top:14px;
  }
  body.peek-mode .card::before{
    content:"🔍 唯讀預覽・偷看老師視角";
    position:absolute;
    top:-13px; left:18px;
    background:var(--accent-deep);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    padding:4px 14px;
    border-radius:20px;
    box-shadow:0 2px 4px rgba(122,90,54,0.2);
  }

  h1{ font-family:'Noto Serif TC', serif; font-size:20px; font-weight:700; margin:0 0 4px; color:var(--ink); }
  h2{ font-family:'Noto Serif TC', serif; font-size:17px; font-weight:700; margin:0 0 12px; color:var(--ink); }
  p.desc{ color:var(--ink-soft); font-size:13px; margin:0 0 16px; line-height:1.6; }

  /* ---- 選擇使用者畫面 ---- */
  .people-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .person-btn{
    height:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--accent-soft);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:8px;
    text-align:center;
    font-size:14px;
    font-weight:500;
    color:var(--accent-deep);
    cursor:pointer;
  }
  .person-btn.teacher{ background:var(--green-soft); color:var(--green); border-color:#D3DCC3; }
  .person-btn:active{ transform:scale(0.97); }

  /* ---- 週卡片 ---- */
  .week-card{ }
  .week-title{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px;
  }
  .week-title .label{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:16px; }
  .week-title .range{ font-size:12px; color:var(--ink-soft); }

  .day-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px;
    border-top:1px solid var(--line);
  }
  .day-row:first-of-type{ border-top:none; }
  .day-label{ font-size:14px; font-weight:500; min-width:74px; }
  .day-label .date{ color:var(--ink-soft); font-weight:400; font-size:12px; display:block; }

  .status-options{ display:flex; gap:6px; }
  .status-btn{
    border:1px solid var(--line);
    background:var(--bg-card);
    border-radius:20px;
    padding:7px 12px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .status-btn[data-v="free"].active{ background:var(--green-soft); color:var(--green); border-color:#B9C79E; font-weight:700;}
  .status-btn[data-v="busy"].active{ background:var(--red-soft); color:var(--red); border-color:#DDB2A4; font-weight:700;}
  .status-btn[data-v="maybe"].active{ background:var(--amber-soft); color:var(--amber); border-color:#E7C989; font-weight:700;}
  .status-options.readonly .status-btn{ pointer-events:none; opacity:.65; }

  textarea.note{
    width:100%;
    margin-top:14px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-family:inherit;
    font-size:16px;
    resize:vertical;
    min-height:54px;
    background:#FFFCF6;
    color:var(--ink);
  }
  textarea.note::placeholder{ color:#B6A88E; }
  .note-label{ font-size:12px; color:var(--ink-soft); margin:14px 0 6px; }

  .save-btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:var(--radius-sm);
    padding:14px;
    font-size:15px;
    font-weight:700;
    margin-top:16px;
    cursor:pointer;
    letter-spacing:1px;
  }
  .save-btn:active{ background:var(--accent-deep); }
  .save-flash{
    text-align:center; font-size:12px; color:var(--green); margin-top:8px; height:14px;
  }

  .nav-tabs{
    display:flex; gap:8px; margin-bottom:16px;
  }
  .nav-tabs button{
    flex:1;
    padding:10px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    background:var(--bg-card);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .nav-tabs button.active{ background:var(--accent-deep); color:#fff; border-color:var(--accent-deep); }
  .nav-tabs.scroll{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .nav-tabs.scroll::-webkit-scrollbar{ display:none; }
  .nav-tabs.scroll button{ flex:0 0 auto; white-space:nowrap; padding:10px 14px; }
  .tabs-scroll-wrap{ position:relative; }
  .tabs-scroll-wrap.has-overflow::after{
    content:''; position:absolute; top:0; right:0; bottom:0; width:36px;
    background:linear-gradient(to right, transparent, var(--bg-card) 65%);
    pointer-events:none; border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  }

  /* ---- 老師統計畫面 ---- */
  /* 建議日摘要：老師最想知道的一件事，放在五天明細之前 */
  .best-card{
    border:1px solid var(--accent);
    background:var(--accent-soft);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .best-card.none{ border-color:var(--line); background:var(--bg); }
  .best-card .k{
    font-size:11px; letter-spacing:2px; color:var(--accent-deep);
    font-weight:700; margin-bottom:4px;
  }
  .best-card.none .k{ color:var(--ink-soft); }
  .best-card .v{ font-family:'Noto Serif TC', serif; font-size:19px; font-weight:700; }
  .best-card .m{ font-size:12px; color:var(--ink-soft); margin-top:3px; }

  /* 五天明細改成可收合，預設只有一行；建議日預設展開 */
  .summary-day{
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:0;
    margin-bottom:8px;
    overflow:hidden;
  }
  .summary-day.picked{ border-color:var(--accent); background:var(--accent-soft); }
  .summary-day.teacher-no{ opacity:0.55; }
  .summary-head{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 14px; cursor:pointer; list-style:none;
  }
  .summary-head::-webkit-details-marker{ display:none; }
  .summary-head .d{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }
  .summary-head .right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .summary-head .free-n{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .summary-head .chev{
    width:9px; height:9px; border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft);
    transform:rotate(45deg); margin-top:-4px; transition:transform .15s ease; flex:none;
  }
  .summary-day[open] .summary-head .chev{ transform:rotate(-135deg); margin-top:2px; }
  .summary-day .summary-names{ padding:0 14px 13px; margin-top:0; }
  .day-tag{
    font-size:10px; font-weight:700; letter-spacing:1px;
    background:var(--accent-deep); color:#fff; padding:2px 7px; border-radius:9px;
  }
  @media (prefers-reduced-motion: reduce){ .summary-head .chev{ transition:none; } }
  .summary-head .badge{
    font-size:11px; padding:3px 9px; border-radius:12px; font-weight:700;
  }
  .badge.best{ background:var(--green-soft); color:var(--green); }
  .badge.normal{ background:var(--line); color:var(--ink-soft); }
  .badge.noteacher{ background:var(--red-soft); color:var(--red); }
  .summary-names{ font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.6; }
  .summary-names b{ color:var(--ink); }
  .name-tag{ display:inline-block; margin:2px 4px 2px 0; padding:2px 7px; border-radius:10px; font-size:11px; }

  .sport-item{ cursor:default; }
  .sport-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .sport-title-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sport-name{ font-weight:700; font-size:15px; }
  .sport-meta{ font-size:11px; color:var(--ink-soft); margin-top:3px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .sport-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .sport-comments{ margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .sport-comments .note-line{ margin-top:0; margin-bottom:4px; }
  .sport-comments .add-row{ margin-top:8px; }
  .name-tag.free{ background:var(--green-soft); color:var(--green); }
  .name-tag.busy{ background:var(--red-soft); color:var(--red); }
  .name-tag.maybe{ background:var(--amber-soft); color:var(--amber); }
  .note-line{ font-size:11px; color:var(--ink-soft); margin-top:4px; font-style:italic; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    font-family:inherit; font-size:16px; background:#FFFCF6; color:var(--ink);
  }

  .announce-box{
    width:100%;
    background:#FFFCF6;
    border:1px dashed var(--line);
    border-radius:var(--radius-sm);
    padding:16px;
    font-family:inherit;
    font-size:16px;
    line-height:1.9;
    white-space:pre-wrap;
    color:var(--ink);
    margin-top:14px;
    min-height:230px;
    resize:vertical;
    text-align:center;
  }
  .copy-btn{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:var(--radius-sm);
    padding:14px;
    font-size:15px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
  }
  .copy-btn:active{ background:#586445; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0; }

  .notice-card{
    background:var(--amber-soft); border:1px solid #E7C989; border-radius:var(--radius-sm);
    padding:12px 14px; font-size:13px; color:var(--ink); line-height:1.7;
    margin-bottom:16px; white-space:pre-wrap;
    text-align: center;
  }
  .notice-card .notice-time{ display:block; font-size:11px; color:var(--ink-soft); margin-top:6px; white-space:normal; text-align:right; }
  .comment-time{ font-size:11px; color:var(--ink-soft); font-style:normal; white-space:nowrap; }
  .note-line-meta{ display:flex; align-items:baseline; gap:6px; flex-shrink:0; white-space:nowrap; }

  /* ---- admin ---- */
  .admin-lock{ text-align:center; padding-top:12px; padding-bottom:12px; }
  .admin-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .admin-row:first-of-type{ border-top:none; }
  .pill{ font-size:11px; padding:3px 9px; border-radius:10px; background:var(--green-soft); color:var(--green); font-weight:700; }
  .del-btn{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; }
  .add-row{ display:flex; gap:8px; margin-top:14px; margin-bottom:16px; }
  .add-row input{ flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; }
  .add-row button{ background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); padding:0 16px; font-weight:700; cursor:pointer; }

  .footer-link{ text-align:center; margin-top:24px; }
  .footer-link a{ font-size:11px; color:var(--ink-soft); text-decoration:none; }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:13px; }

  .lock-icon{
    font-size:11px;
    letter-spacing:2px;
    color:var(--ink-soft);
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .hint-text{ font-size:12px; color:var(--ink-soft); margin-top:10px; text-align:center; }

  /* ============================================================
     姊妹行事曆
     RetroUI 的骨架（粗框、硬陰影、按壓位移）+ 現有站的暖色配色。
     所有樣式都鎖在 .sis 底下，現有畫面不受任何影響。
     ============================================================ */
  .sis{
    --sis-ink:#3A2E22;
    --sis-card:#FFFDF8;
    --sis-key:#A9744F;
    --sis-shadow:3px 3px 0 rgba(58,46,34,.5);
    --sis-radius:4px;
    --sis-dash:rgba(58,46,34,.22);
    /* 框線粗細集中在這兩個變數，要整體加粗或變細改這裡就好。
       位移陰影維持不動——那才是 RetroUI 的個性所在，線收細反而更清爽。 */
    --sis-bw:1.5px;        /* 卡片、按鈕、輸入框 */
    --sis-bw-thin:1px;     /* 日曆格子、表格、分隔線 */
  }
  .sis-who{
    display:flex; align-items:center; gap:7px;
    background:var(--sis-ink); color:var(--bg);
    font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:8px 13px; border-radius:var(--sis-radius); margin-bottom:12px;
  }
  .sis-who .dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); flex:none; }

  .sis-tabs{ display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:14px; }
  .sis-tabs button{
    padding:10px 0; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
    background:var(--sis-card); color:var(--ink-soft);
    border:var(--sis-bw) solid var(--sis-ink); border-right-width:0;
  }
  .sis-tabs button:first-child{ border-radius:var(--sis-radius) 0 0 var(--sis-radius); }
  .sis-tabs button:last-child{ border-right-width:var(--sis-bw); border-radius:0 var(--sis-radius) var(--sis-radius) 0; }
  .sis-tabs button.active{ background:var(--sis-key); color:#FFFDF8; font-weight:900; }

  .sis-card{
    background:var(--sis-card); border:var(--sis-bw) solid var(--sis-ink);
    box-shadow:var(--sis-shadow); border-radius:var(--sis-radius);
    padding:12px; margin-bottom:14px;
  }
  .sis-cardhead{
    font-size:11px; font-weight:900; letter-spacing:1px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .sis-cardhead .cnt{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .sis-hint{ font-size:11px; color:var(--ink-soft); margin:4px 0 9px; line-height:1.6; }

  .sis-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sis-nav .lbl{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px; letter-spacing:1px; }
  .sis-nav button{
    width:32px; height:32px; display:grid; place-items:center; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:900; color:var(--sis-ink);
    border:var(--sis-bw) solid var(--sis-ink); background:var(--sis-card);
    box-shadow:2px 2px 0 rgba(58,46,34,.5); border-radius:var(--sis-radius);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .sis-nav button:active{ transform:translate(2px,2px); box-shadow:0 0 0 rgba(58,46,34,.5); }

  .sis-wd{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin:12px 0 4px; }
  .sis-wd span{ text-align:center; font-size:10px; font-weight:700; color:var(--ink-soft); }
  .sis-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .sis-cell{
    min-height:46px; padding:2px 2px 3px; cursor:pointer;
    border:var(--sis-bw-thin) solid rgba(58,46,34,.35); background:var(--sis-card);
    border-radius:3px; display:flex; flex-direction:column; gap:2px;
  }
  .sis-cell.out{ background:#F1EBDF; border-color:rgba(58,46,34,.18); cursor:default; }
  .sis-cell:active{ background:var(--accent-soft); }
  .sis-cell.out:active{ background:#F1EBDF; }
  .sis-cell .d{ font-size:10px; font-weight:700; }
  .sis-cell.out .d{ color:#B3A791; }
  .sis-cell.today .d{
    background:var(--sis-key); color:#FFFDF8; width:16px; height:16px;
    border-radius:50%; display:grid; place-items:center;
  }
  .sis-chip{
    font-size:9px; font-weight:900; text-align:center; padding:2px 0;
    border-radius:2px; color:#FFFDF8; letter-spacing:.3px;
  }

  .sis-sum{ display:flex; gap:10px; margin-bottom:14px; }
  .sis-sum > div{
    flex:1; padding:8px 10px; background:var(--sis-card);
    border:var(--sis-bw) solid var(--sis-ink); border-radius:var(--sis-radius);
  }
  .sis-sum .k{ font-size:10px; font-weight:700; color:var(--ink-soft); }
  .sis-sum .v{ font-size:20px; font-weight:900; }

  .sis-ev{
    display:flex; align-items:center; gap:9px; padding:9px 0;
    border-bottom:var(--sis-bw-thin) dashed var(--sis-dash); cursor:pointer;
  }
  .sis-ev:last-child{ border-bottom:0; padding-bottom:0; }
  .sis-ev .dt{ font-size:12px; font-weight:700; min-width:42px; }
  .sis-ev .sw{ width:13px; height:13px; border-radius:50%; flex:none; }
  .sis-ev .txt{ flex:1; min-width:0; }
  .sis-ev .lb{ font-size:12px; font-weight:700; }
  .sis-ev .no{ font-size:10.5px; color:var(--ink-soft); word-break:break-all; }
  .sis-ev .nth{
    font-size:11px; font-weight:700; flex:none; background:var(--bg);
    border:var(--sis-bw-thin) solid rgba(58,46,34,.4); border-radius:3px; padding:1px 5px;
  }

  .sis-btn{
    display:block; width:100%; padding:13px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:900; letter-spacing:1px;
    background:var(--sis-key); color:#FFFDF8;
    border:var(--sis-bw) solid var(--sis-ink); border-radius:var(--sis-radius);
    box-shadow:var(--sis-shadow);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .sis-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 rgba(58,46,34,.5); }
  .sis-btn.ghost{ background:var(--sis-card); color:var(--sis-ink); }
  .sis-btn.danger{ background:var(--red); }
  .sis-btnrow{ display:flex; gap:9px; margin-top:14px; }
  .sis-btnrow .sis-btn{ flex:1; }

  .sis-lab{ font-size:11px; font-weight:900; letter-spacing:1px; margin:14px 0 7px; }
  .sis-lab:first-child{ margin-top:0; }
  .sis-opts{ display:flex; flex-wrap:wrap; gap:7px; }
  .sis-opt{
    display:flex; align-items:center; gap:6px; cursor:pointer;
    font-size:12px; font-weight:700; padding:6px 9px;
    border:var(--sis-bw) solid var(--sis-ink); border-radius:var(--sis-radius); background:var(--sis-card);
  }
  .sis-opt .sw{ width:11px; height:11px; border-radius:50%; flex:none; }
  .sis-opt.on{ background:var(--bg); box-shadow:var(--sis-shadow); }
  .sis-opt.locked{ background:var(--accent-soft); border-style:dashed; color:var(--accent-deep); cursor:default; }
  .sis-input, .sis-ta{
    width:100%; padding:9px 10px; font-family:inherit; font-size:16px;
    color:var(--ink); background:var(--sis-card);
    border:var(--sis-bw) solid var(--sis-ink); border-radius:var(--sis-radius);
  }
  .sis-ta{ min-height:54px; resize:vertical; }
  .sis-preview{
    padding:9px 11px; font-size:12px; font-weight:700; line-height:1.7;
    background:var(--bg); border:var(--sis-bw) dashed var(--sis-ink); border-radius:var(--sis-radius);
  }
  .sis-preview b{ font-size:15px; color:var(--accent-deep); }
  .sis-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .sis-swatches i{
    width:28px; height:28px; border-radius:50%; display:block; cursor:pointer;
    border:var(--sis-bw) solid transparent;
  }
  .sis-swatches i.on{ border-color:var(--sis-ink); box-shadow:0 0 0 2px var(--sis-card), var(--sis-shadow); }

  .sis-grp{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:var(--sis-bw-thin) dashed var(--sis-dash);
  }
  .sis-grp:last-child{ border-bottom:0; padding-bottom:0; }
  .sis-grp .sw{ width:22px; height:22px; border-radius:50%; flex:none; }
  .sis-grp .txt{ flex:1; min-width:0; }
  .sis-grp .lb{ font-size:13px; font-weight:900; }
  .sis-grp .mem{ font-size:10.5px; color:var(--ink-soft); }
  .sis-grp .n{ font-size:11px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }

  .sis-tblwrap{ overflow-x:auto; }
  table.sis-tbl{ border-collapse:collapse; font-size:11px; width:100%; min-width:430px; }
  table.sis-tbl th, table.sis-tbl td{
    border:var(--sis-bw-thin) solid rgba(58,46,34,.35); padding:5px 4px; text-align:center;
  }
  table.sis-tbl th{ background:var(--accent-soft); font-size:10px; font-weight:900; }
  table.sis-tbl td.g{ text-align:left; font-size:10.5px; font-weight:700; white-space:nowrap; }
  table.sis-tbl td.zero{ color:#C4B8A2; }
  table.sis-tbl td.tot{ background:var(--bg); font-weight:900; }
  table.sis-tbl .swdot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }

  .sis-chartbox{ height:200px; position:relative; }
  .sis-chartfail{
    height:100%; display:grid; place-items:center; text-align:center; padding:10px;
    font-size:12px; font-weight:700; line-height:1.7;
    border:var(--sis-bw) dashed var(--sis-ink); border-radius:var(--sis-radius);
  }
  .sis-pair{
    display:flex; align-items:center; gap:9px; padding:8px 0;
    border-bottom:var(--sis-bw-thin) dashed var(--sis-dash);
  }
  .sis-pair:last-child{ border-bottom:0; padding-bottom:0; }
  .sis-pair .nm{ flex:1; font-size:12.5px; font-weight:700; }
  .sis-pair .bar{ height:9px; border-radius:2px; background:var(--sis-key); flex:none; }
  .sis-pair .n{ font-size:12px; font-weight:700; min-width:40px; text-align:right; }

  /* 新增／編輯見面的底部面板 */
  .sis-backdrop{
    position:fixed; inset:0; background:rgba(58,46,34,.45); z-index:40;
  }
  .sis-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:520px; margin:0 auto; max-height:88vh; overflow-y:auto;
    background:var(--sis-card); border-top:var(--sis-bw) solid var(--sis-ink);
    border-radius:12px 12px 0 0; padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .sis-sheet h3{
    font-family:'Noto Serif TC', serif; font-size:17px; font-weight:700; margin:0;
  }
  .sis-sheet .sub{ font-size:11px; color:var(--ink-soft); margin:2px 0 14px; }
  @media (prefers-reduced-motion: reduce){
    .sis-btn, .sis-nav button{ transition:none; }
  }
</style>
</head>
<body>

<button class="corner-btn edit-profile" id="editProfileBtn" type="button" title="修改資料" aria-label="修改資料" style="display:none;">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
<button class="corner-btn" id="switchUserBtn" type="button" title="回我的首頁" aria-label="回我的首頁" style="display:none;">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 11.4 12 4.2l8.2 7.2"/><path d="M6.4 10.6V19a1.2 1.2 0 0 0 1.2 1.2h8.8a1.2 1.2 0 0 0 1.2-1.2v-8.4"/><path d="M9.9 20.2v-4.1a2.1 2.1 0 0 1 4.2 0v4.1"/></svg>
</button>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><span class="seed">●</span> 本週運動 <span class="seed">●</span></div>
    <div class="sub">WEEKLY MOVEMENT</div>
  </header>
  <div class="loading">載入中…</div>
</div>

<script>
(function(){

  // ---------- 基本設定 ----------
  // 管理密碼改存 SHA-256 雜湊值，原始碼裡看不到明碼。
  // 更換密碼方式：在瀏覽器 devtools console 執行（把「新密碼」換成你要的密碼）：
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('新密碼')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
  // 再把印出的字串貼到下面 ADMIN_PASSWORD_HASH。
  const ADMIN_PASSWORD_HASH = "2a0affece715fcb62b31c2e8f37027b53a9ef886d104959493cc4a061c5ea30e";
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const STATUS_OPTS = [
    {v:'free', label:'有空'},
    {v:'maybe', label:'不確定'},
    {v:'busy', label:'沒空'}
  ];
  const WEEKDAY_NAMES = ['日','一','二','三','四','五','六'];

  // 「產生 LINE 公告文字」老師說用不到，先關掉。
  // 相關程式碼（buildAnnounceText / copyToClipboard / announce:<週> 資料）都留著，
  // 哪天要開回來把這裡改成 true 就好，不用重寫。
  const SHOW_ANNOUNCE_GENERATOR = false;

  let people = [];       // [{id, name, isTeacher, password}]
  let currentPersonId = null;
  let view = 'loading';  // loading | pickPerson | setPassword | enterPassword | member | teacher | teacherPeek | sisters | admin
  let teacherTab = 'summary'; // summary | fill | announce | sports (老師視角內部切換用)
  let pendingPersonId = null; // 選了名字但還沒通過密碼驗證時暫存
  let renderGen = 0; // 每次渲染都會遞增；用來偵測「這次非同步渲染是不是已經被更新的操作取代了」，避免舊的畫面在新的畫面之後才蓋回去

  const app = document.getElementById('app');
  const switchBtn = document.getElementById('switchUserBtn');
  const editProfileBtn = document.getElementById('editProfileBtn');

  // ---------- 工具：日期 ----------
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtShort(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
  function fmtDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return fmtShort(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function startOfWeek(d){
    // 週一為一週開始
    const day = d.getDay(); // 0=日
    const diff = (day===0 ? -6 : 1-day);
    const monday = new Date(d);
    monday.setDate(d.getDate()+diff);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }

  // 產生未來4週(含本週)，每週週一到週五
  function getWeeks(){
    const today = new Date();
    const thisMonday = startOfWeek(today);
    const weeks = [];
    for(let w=0; w<4; w++){
      const monday = addDays(thisMonday, w*7);
      const days = [];
      for(let i=0;i<5;i++){
        const d = addDays(monday, i);
        days.push({ key: toKey(d), date: d, weekdayName: WEEKDAY_NAMES[d.getDay()] });
      }
      weeks.push({ weekKey: toKey(monday), monday, days, isCurrent: w===0 });
    }
    return weeks;
  }
  const WEEKS = getWeeks();
  const CURRENT_WEEK = WEEKS[0];

  // ---------- Storage helpers (Firebase Realtime Database) ----------
  // key 中的 '.' '#' '$' '[' ']' 對 Firebase path 是保留字元，做安全轉換
  function safeKey(key){
    return key.replace(/[.#$\[\]]/g, '_');
  }
  async function sGet(key, shared){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data/' + safeKey(key)));
      if(!snap.exists()) return null;
      return JSON.parse(snap.val());
    }catch(e){ console.error('sGet error', e); return null; }
  }
  async function sSet(key, val, shared){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), JSON.stringify(val));
    }catch(e){ console.error('sSet error', e); }
  }
  async function sDelete(key, shared){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), null);
    }catch(e){ console.error('sDelete error', e); }
  }
  async function sList(prefix, shared){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data'));
      if(!snap.exists()) return [];
      const all = snap.val();
      const safePrefix = safeKey(prefix);
      return Object.keys(all).filter(k => k.startsWith(safePrefix));
    }catch(e){ console.error('sList error', e); return []; }
  }

  // ---------- 資料模型 ----------
  // people (shared): key "people-list" -> [{id,name,isTeacher}]
  // responses (shared): key "resp:<weekKey>:<personId>" -> {statuses:{dayKey:'free'|'busy'|'maybe'}, note:''}
  // announcement (shared): key "announce:<weekKey>" -> {dayKey, sport, note, savedAt}

  async function loadPeople(){
    const p = await sGet('people-list', true);
    if(p && Array.isArray(p) && p.length){ people = p; }
    else{
      // 預設種子資料
      people = [
        {id:'p1', name:'老師', isTeacher:true, password:''},
        {id:'p2', name:'同學A', isTeacher:false, password:''},
        {id:'p3', name:'同學B', isTeacher:false, password:''}
      ];
      await sSet('people-list', people, true);
    }
  }

  async function savePeople(){
    await sSet('people-list', people, true);
  }

  async function cleanupOldWeeks(){
    // 刪除比本週還早的回覆資料
    const keys = await sList('resp:', true);
    const validPrefixes = WEEKS.map(w => 'resp:'+w.weekKey+':');
    for(const k of keys){
      const isValid = validPrefixes.some(p => k.startsWith(p));
      if(!isValid){ await sDelete(k, true); }
    }
    const akeys = await sList('announce:', true);
    const validA = WEEKS.map(w => 'announce:'+w.weekKey);
    for(const k of akeys){
      if(!validA.includes(k)){ await sDelete(k, true); }
    }
    const nkeys = await sList('notice:', true);
    const validN = WEEKS.map(w => 'notice:'+w.weekKey);
    for(const k of nkeys){
      if(!validN.includes(k)){ await sDelete(k, true); }
    }
    // 注意：lobby-announce、sports-list 不分週、永久保留，不可被這裡清掉。
    // 姊妹行事曆的 sis-groups、sis-meet:<年份> 同樣永久保留——見面紀錄就是要拿來回顧的，
    // 不要為了「清舊資料」把前綴加進上面任何一份清單。
  }

  // ---------- Render 進入點 ----------
  function waitForFirebase(){
    return new Promise((resolve)=>{
      if(window.firebaseReady){ resolve(); return; }
      document.addEventListener('firebase-ready', ()=>resolve(), {once:true});
      // 保險：3秒後即使沒收到事件也嘗試繼續（避免卡死在載入畫面）
      setTimeout(()=>resolve(), 3000);
    });
  }

  async function init(){
    await waitForFirebase();
    if(!window.db){
      app.innerHTML = `
        <header class="top">
          <div class="brand"><span class="seed">●</span> 本週運動 <span class="seed">●</span></div>
        </header>
        <div class="card">
          <h1>資料庫尚未設定</h1>
          <p class="desc">請先在 index.html 檔案開頭填入你的 Firebase 設定值（firebaseConfig），才能開始使用。</p>
        </div>
      `;
      return;
    }
    await loadPeople();
    await cleanupOldWeeks();
    view = 'pickPerson';
    render();
  }

  function render(){
    renderGen++; // 切換到任何畫面都算新的一輪，讓還在等待中的舊 renderMember()/renderTeacher() 知道自己已經過時
    const loggedIn = (view==='member' || view==='teacher' || view==='teacherPeek' || view==='sisters');
    switchBtn.style.display = loggedIn ? 'block' : 'none';
    editProfileBtn.style.display = loggedIn ? 'block' : 'none';
    document.body.classList.toggle('has-corner-buttons', loggedIn);
    document.body.classList.toggle('peek-mode', view==='teacherPeek');
    if(view==='pickPerson') return renderPickPerson();
    if(view==='setPassword') return renderSetPassword();
    if(view==='enterPassword') return renderEnterPassword();
    if(view==='editProfile') return renderEditProfile();
    if(view==='member') return renderMember();
    if(view==='teacher') return renderTeacher(false);
    if(view==='teacherPeek') return renderTeacher(true);
    if(view==='sisters') return renderSisters();
    if(view==='admin') return renderAdminLock();
  }

  let returnViewAfterEdit = 'pickPerson';
  editProfileBtn.addEventListener('click', ()=>{
    returnViewAfterEdit = view;
    view = 'editProfile';
    render();
  });

  // 小房子＝回「自己的」首頁（老師回管理視角、成員回回報畫面），並回到該畫面的預設分頁。
  // 要換人請走畫面最下面的「回到選擇身份」。
  switchBtn.addEventListener('click', ()=>{
    const person = people.find(p=>p.id===currentPersonId);
    if(!person){ currentPersonId = null; view = 'pickPerson'; return render(); }
    if(person.isTeacher){ teacherTab = 'summary'; view = 'teacher'; }
    else { memberTab = 'schedule'; view = 'member'; }
    render();
  });

  // ---------- 畫面：選擇使用者 ----------
  async function renderPickPerson(){
    const teacher = people.find(p=>p.isTeacher);
    const students = people.filter(p=>!p.isTeacher);
    const lobbyAnnounce = await sGet('lobby-announce', true);
    const lobbyHtml = (lobbyAnnounce && lobbyAnnounce.text && lobbyAnnounce.text.trim())
      ? `<div class="card"><div class="notice-card">${escapeHtml(lobbyAnnounce.text)}<span class="notice-time">更新於 ${fmtDateTime(lobbyAnnounce.updatedAt)}</span></div></div>`
      : '';
    let html = `
      <header class="top">
        <div class="brand"><span class="seed">●</span> 本週運動 <span class="seed">●</span></div>
        <div class="sub">WEEKLY MOVEMENT</div>
      </header>
      ${lobbyHtml}
      <div class="card">
        <h1>你是哪位同學？</h1>
        <p class="desc">選擇你的名字，開始填寫時間吧！</p>
        <div class="people-grid">
    `;
    if(teacher){
      html += `<div class="person-btn teacher" data-id="${teacher.id}">${escapeHtml(teacher.name)}<br><span style="font-size:10px;">（我是老師）</span></div>`;
    }
    students.forEach(s=>{
      html += `<div class="person-btn" data-id="${s.id}">${escapeHtml(s.name)}</div>`;
    });
    html += `
        </div>
      </div>
      <div class="footer-link"><a href="#" id="adminEntry">管理入口</a></div>
    `;
    app.innerHTML = html;

    app.querySelectorAll('.person-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        pendingPersonId = btn.dataset.id;
        const person = people.find(p=>p.id===pendingPersonId);
        view = person.password ? 'enterPassword' : 'setPassword';
        render();
      });
    });
    document.getElementById('adminEntry').addEventListener('click', (e)=>{
      e.preventDefault();
      view = 'admin';
      render();
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 只在分頁列真的超出寬度、需要滑動時才顯示右側提示漸層
  function markScrollableTabs(){
    app.querySelectorAll('.tabs-scroll-wrap').forEach(wrap=>{
      const inner = wrap.querySelector('.nav-tabs');
      wrap.classList.toggle('has-overflow', !!inner && inner.scrollWidth > inner.clientWidth + 2);
    });
  }

  // ---------- 畫面：第一次使用，設定名字與密碼 ----------
  function renderSetPassword(){
    const person = people.find(p=>p.id===pendingPersonId);
    if(!person){ view='pickPerson'; return render(); }

  // ---------- 畫面：成員填寫 ----------
  let memberSelectedWeekIdx = 0;
  let memberTab = 'schedule'; // 'schedule' | 'sports'
  async function renderMember(){
    const myRenderToken = ++renderGen;
    const person = people.find(p=>p.id===currentPersonId);
    if(!person){ view='pickPerson'; return render(); }

    const mainTabsHtml = `
      <div class="tabs-scroll-wrap">
        <div class="nav-tabs scroll">
          <button data-mtab="schedule" class="${memberTab==='schedule'?'active':''}">本週回報</button>
          <button data-mtab="sports" class="${memberTab==='sports'?'active':''}">運動興趣列表</button>

          <button data-mtab="peek">偷看老師視角</button>
        </div>
      </div>
    `;

    let week, respKey, existing, state, sportsList;
    let bodyHtml = '';

    if(memberTab==='schedule'){
      week = WEEKS[memberSelectedWeekIdx];
      respKey = 'resp:'+week.weekKey+':'+person.id;
      existing = (await sGet(respKey, true)) || {statuses:{}, note:''};
      const weekNotice = await sGet('notice:'+week.weekKey, true);
      const noticeHtml = (weekNotice && weekNotice.text && weekNotice.text.trim())
        ? `<div class="notice-card">${escapeHtml(weekNotice.text)}<span class="notice-time">更新於 ${fmtDateTime(weekNotice.updatedAt)}</span></div>` : '';

      let tabsHtml = '<div class="nav-tabs">';
      WEEKS.forEach((w,i)=>{
        const label = i===0 ? '本週' : (fmtShort(w.monday)+'週');
        tabsHtml += `<button data-idx="${i}" class="${i===memberSelectedWeekIdx?'active':''}">${label}</button>`;
      });
      tabsHtml += '</div>';

      let daysHtml = '';
      week.days.forEach(d=>{
        const cur = existing.statuses[d.key] || '';
        daysHtml += `
          <div class="day-row">
            <div class="day-label">星期${d.weekdayName}<span class="date">${fmtShort(d.date)}</span></div>
            <div class="status-options" data-day="${d.key}">
              ${STATUS_OPTS.map(o=>`<div class="status-btn" data-v="${o.v}" data-day="${d.key}" style="${cur===o.v?'':''}">${o.label}</div>`).join('')}
            </div>
          </div>
        `;
      });

      bodyHtml = `
        ${tabsHtml}
        ${noticeHtml}
        <h2>${fmtShort(week.monday)} - ${fmtShort(week.days[4].date)}</h2>
        <p class="desc">勾選每天的狀態：有空／不確定／沒空。</p>
        ${daysHtml}
        <div class="note-label">給老師的備註（選填）</div>
        <textarea class="note" id="noteInput" placeholder="例如：這週想打羽球、或身體微恙先觀望…">${escapeHtml(existing.note||'')}</textarea>
        <button class="save-btn" id="saveBtn">儲存這週的回覆</button>
        <div class="save-flash" id="saveFlash"></div>
      `;
    } else {
      sportsList = await loadSportsList();
      bodyHtml = buildSportsListHtml(sportsList, person.id, false);
    }

    if(myRenderToken !== renderGen) return; // 這輪渲染已經過時（畫面已經被更新的操作換掉了），不要再蓋回去

    app.innerHTML = `
      <header class="top">
        <div class="brand"><span class="seed">●</span> 本週運動 <span class="seed">●</span></div>
        <div class="sub">${escapeHtml(person.name)}</div>
      </header>
      <div class="card">
        ${mainTabsHtml}
        ${bodyHtml}
      </div>
      <div class="footer-link"><a href="#" id="backLink">回到選擇身份</a></div>
    `;
    markScrollableTabs();

    function hasUnsavedScheduleChanges(){
      if(memberTab !== 'schedule' || !state || !existing) return false;
      if(JSON.stringify(state) !== JSON.stringify(existing.statuses||{})) return true;
      const noteEl = document.getElementById('noteInput');
      return !!noteEl && noteEl.value.trim() !== (existing.note||'');
    }
    function confirmLeaveSchedule(){
      return !hasUnsavedScheduleChanges() || confirm('這週的勾選還沒儲存，離開會遺失變更，確定要離開嗎？');
    }

    app.querySelectorAll('[data-mtab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirmLeaveSchedule()) return;
        if(btn.dataset.mtab === 'peek'){
          view = 'teacherPeek';
          render();
        } else if(btn.dataset.mtab === 'sis'){
          view = 'sisters';
          render();
        } else {
          memberTab = btn.dataset.mtab;
          renderMember();
        }
      });
    });

    if(memberTab==='schedule'){
      // 套用目前狀態的 active 樣式
      state = Object.assign({}, existing.statuses);
      function refreshActive(){
        app.querySelectorAll('.status-btn').forEach(btn=>{
          const day = btn.dataset.day;
          btn.classList.toggle('active', state[day]===btn.dataset.v);
        });
      }
      refreshActive();

      app.querySelectorAll('.status-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const day = btn.dataset.day;
          state[day] = btn.dataset.v;
          refreshActive();
        });
      });

      app.querySelectorAll('[data-idx]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          if(!confirmLeaveSchedule()) return;
          memberSelectedWeekIdx = parseInt(btn.dataset.idx,10);
          renderMember();
        });
      });

      document.getElementById('saveBtn').addEventListener('click', async ()=>{
        const note = document.getElementById('noteInput').value.trim();
        await sSet(respKey, {statuses: state, note: note}, true);
        existing = {statuses: Object.assign({}, state), note: note};
        const flash = document.getElementById('saveFlash');
        flash.textContent = '已儲存';
        setTimeout(()=>{ if(flash) flash.textContent=''; }, 2000);
      });
    } else {
      wireSportsListHandlers(sportsList, person.id, false, ()=>renderMember());
    }

    document.getElementById('backLink').addEventListener('click', (e)=>{
      e.preventDefault();
      if(!confirmLeaveSchedule()) return;
      currentPersonId = null;
      view = 'pickPerson';
      render();
    });
  }

  // ---------- 畫面：老師檢視 ----------
  let teacherSelectedWeekIdx = 0;
  async function renderTeacher(readOnly){
    const myRenderToken = ++renderGen;
    const person = people.find(p=>p.id===currentPersonId);
    if(!person){ view='pickPerson'; return render(); }
    // peek 模式下 currentPersonId 仍是「正在偷看的成員」，viewingPerson 才是真正的老師本人資料來源
    const viewingPerson = readOnly ? (people.find(p=>p.isTeacher) || person) : person;
    // 標題下方那行放使用者自己的名字；peek 例外——那裡要講清楚「你在看別人的畫面」，
    // 放名字會分不清是誰的。
    const subtitle = readOnly ? '老師視角（唯讀預覽）' : escapeHtml(person.name);

    const week = WEEKS[teacherSelectedWeekIdx];
    let sportsList;
    let fillState;

    // 撈這週所有人的回覆
    const allResp = {};
    for(const p of people){
      const key = 'resp:'+week.weekKey+':'+p.id;
      const r = await sGet(key, true);
      if(r) allResp[p.id] = r;
    }
    const teacherResp = allResp[viewingPerson.id] || {statuses:{}, note:''};
    const savedAnnounce = SHOW_ANNOUNCE_GENERATOR ? await sGet('announce:'+week.weekKey, true) : null;
    const lobbyAnnounce = await sGet('lobby-announce', true);
    const weekNotice = await sGet('notice:'+week.weekKey, true);
    const noticeHtml = (weekNotice && weekNotice.text && weekNotice.text.trim())
      ? `<div class="notice-card">${escapeHtml(weekNotice.text)}<span class="notice-time">更新於 ${fmtDateTime(weekNotice.updatedAt)}</span></div>` : '';

    // 計算每天統計
    const dayStats = week.days.map(d=>{
      const freeList=[], busyList=[], maybeList=[], noAnswerList=[];
      people.forEach(p=>{
        if(p.isTeacher) return;
        const st = allResp[p.id] ? allResp[p.id].statuses[d.key] : null;
        if(st==='free') freeList.push(p);
        else if(st==='busy') busyList.push(p);
        else if(st==='maybe') maybeList.push(p);
        else noAnswerList.push(p);
      });
      const teacherStatus = teacherResp.statuses[d.key] || null;
      const teacherOk = teacherStatus === 'free' || teacherStatus === 'maybe';
      return { day:d, freeList, busyList, maybeList, noAnswerList, teacherStatus, teacherOk };
    });

    // 找出建議日：老師可以(free) 且 free人數最多
    let bestKey = null, bestScore = -1;
    dayStats.forEach(ds=>{
      if(ds.teacherStatus==='free'){
        const score = ds.freeList.length;
        if(score>bestScore){ bestScore=score; bestKey=ds.day.key; }
      }
    });

    let tabsHtml = '<div class="nav-tabs">';
    WEEKS.forEach((w,i)=>{
      const label = i===0 ? '本週' : (fmtShort(w.monday)+'週');
      tabsHtml += `<button data-idx="${i}" class="${i===teacherSelectedWeekIdx?'active':''}">${label}</button>`;
    });
    tabsHtml += '</div>';

    // 偷看老師視角只給「統計總覽」：填寫時間對成員沒意義（統計裡已經有老師的徽章），
    // 運動興趣列表在成員自己的畫面就有，不需要在這裡再看一次。
    const tab = readOnly ? 'summary' : teacherTab;

    const subTabsHtml = readOnly ? '' : `
      <div class="tabs-scroll-wrap">
        <div class="nav-tabs scroll">
          <button data-tab="summary" class="${tab==='summary'?'active':''}">統計總覽</button>
          <button data-tab="fill" class="${tab==='fill'?'active':''}">我的時間</button>
          <button data-tab="announce" class="${tab==='announce'?'active':''}">公告</button>
          <button data-tab="sports" class="${tab==='sports'?'active':''}">運動興趣列表</button>
          ${person.canSis ? `<button data-tab="sis">姊妹行事曆</button>` : ''}
        </div>
      </div>
    `;

    let bodyHtml = '';
    if(tab==='summary'){
      bodyHtml += `<h2>${fmtShort(week.monday)} - ${fmtShort(week.days[4].date)} 統計</h2>`;

      const teacherFilled = teacherResp.statuses && Object.keys(teacherResp.statuses).length > 0;
      const bestDs = bestKey ? dayStats.find(d=>d.day.key===bestKey) : null;
      if(bestDs){
        bodyHtml += `
          <div class="best-card">
            <div class="k">建議這天</div>
            <div class="v">星期${bestDs.day.weekdayName} ${fmtShort(bestDs.day.date)}</div>
            <div class="m">${bestDs.freeList.length} 人有空・老師可以</div>
          </div>`;
      } else {
        const why = !teacherFilled
          ? (readOnly ? '老師還沒填這週的時間' : '你還沒填這週的時間，請切到「我的時間」分頁')
          : (readOnly ? '老師這週沒有「有空」的日子' : '你這週沒有勾選任何「有空」的日子');
        bodyHtml += `
          <div class="best-card none">
            <div class="k">沒有建議日</div>
            <div class="m" style="margin-top:2px;">${why}</div>
          </div>`;
      }

      dayStats.forEach(ds=>{
        const isBest = ds.day.key === bestKey;
        const teacherBadge = ds.teacherStatus==='free' ? '<span class="badge best">老師可以</span>'
          : ds.teacherStatus==='maybe' ? '<span class="badge normal">老師不確定</span>'
          : ds.teacherStatus==='busy' ? '<span class="badge noteacher">老師沒空</span>'
          : '<span class="badge noteacher">老師未填</span>';
        bodyHtml += `
          <details class="summary-day ${isBest?'picked':''} ${!ds.teacherOk?'teacher-no':''}" ${isBest?'open':''}>
            <summary class="summary-head">
              <div class="d">星期${ds.day.weekdayName} ${fmtShort(ds.day.date)} ${isBest?'<span class="day-tag">建議</span>':''}</div>
              <div class="right">
                <span class="free-n">有空 ${ds.freeList.length}</span>
                ${teacherBadge}
                <span class="chev"></span>
              </div>
            </summary>
            <div class="summary-names">
              <b>有空 ${ds.freeList.length}</b>：
              ${ds.freeList.map(p=>`<span class="name-tag free">${escapeHtml(p.name)}</span>`).join('') || '—'}
              <br><b>不確定 ${ds.maybeList.length}</b>：
              ${ds.maybeList.map(p=>`<span class="name-tag maybe">${escapeHtml(p.name)}</span>`).join('') || '—'}
              <br><b>沒空 ${ds.busyList.length}</b>：
              ${ds.busyList.map(p=>`<span class="name-tag busy">${escapeHtml(p.name)}</span>`).join('') || '—'}
              ${ds.noAnswerList.length ? `<br><span style="color:#B6A88E;">尚未回覆：${ds.noAnswerList.map(p=>escapeHtml(p.name)).join('、')}</span>` : ''}
            </div>
          </details>
        `;
      });
      // 備註彙整
      const notes = people.filter(p=>!p.isTeacher).map(p=>{
        const r = allResp[p.id];
        return (r && r.note) ? {name:p.name, note:r.note} : null;
      }).filter(Boolean);
      if(notes.length){
        bodyHtml += `<div class="note-label">學員備註</div>`;
        notes.forEach(n=>{
          bodyHtml += `<div class="note-line">${escapeHtml(n.name)}：${escapeHtml(n.note)}</div>`;
        });
      }
    } else if(tab==='fill'){
      // 老師填寫自己這週的可用時間（跟成員畫面邏輯相同，寫回同一份 resp 資料）
      bodyHtml += `<h2>${fmtShort(week.monday)} - ${fmtShort(week.days[4].date)}</h2>`;
      bodyHtml += readOnly
        ? `<p class="desc">老師這週的可用時間（唯讀）。</p>`
        : `<p class="desc">勾選每天的狀態，會作為排定運動的依據。</p>`;
      week.days.forEach(d=>{
        const cur = teacherResp.statuses[d.key] || '';
        bodyHtml += `
          <div class="day-row">
            <div class="day-label">星期${d.weekdayName}<span class="date">${fmtShort(d.date)}</span></div>
            <div class="status-options ${readOnly?'readonly':''}" data-day="${d.key}">
              ${STATUS_OPTS.map(o=>`<div class="status-btn ${readOnly&&cur===o.v?'active':''}" data-v="${o.v}" data-day="${d.key}">${o.label}</div>`).join('')}
            </div>
          </div>
        `;
      });
      bodyHtml += `<div class="note-label">備註（選填）</div>`;
      bodyHtml += `<textarea class="note" id="teacherNoteInput" placeholder="例如：這週想打羽球、或身體微恙先觀望…" ${readOnly?'readonly':''}>${escapeHtml(teacherResp.note||'')}</textarea>`;
      if(!readOnly){
        bodyHtml += `<button class="save-btn" id="teacherSaveBtn">儲存這週的回覆</button>`;
        bodyHtml += `<div class="save-flash" id="teacherSaveFlash"></div>`;
      }
    } else if(tab==='announce'){
      // 兩種公告收在同一個分頁，先「這一週的」再「常設的」——
      // 上面就是週次切換鈕，週限定的東西緊接著它比較不會誤會。
      if(!readOnly){
        bodyHtml += `<h2>本週注意事項</h2>`;
        bodyHtml += `<p class="desc">只屬於 ${fmtShort(week.monday)} - ${fmtShort(week.days[4].date)} 這一週。所有人（含老師）打開本週頁面時，會顯示在最上方。</p>`;
        bodyHtml += `<textarea class="note" id="noticeInput" placeholder="例如：這週場地臨時更換，請留意 LINE 群組通知…">${escapeHtml(weekNotice ? weekNotice.text||'' : '')}</textarea>`;
        bodyHtml += `<button class="save-btn" id="noticeSaveBtn">儲存本週注意事項</button>`;
        bodyHtml += `<div class="save-flash" id="noticeSaveFlash"></div>`;

  function buildAnnounceText(data, dayStats){
    const ds = dayStats.find(x=>x.day.key===data.dayKey);
    const dateLabel = ds ? `${fmtShort(ds.day.date)}（週${ds.day.weekdayName}）` : '';
    let text = `本週運動公告\n`;
    text += `日期：${dateLabel}\n`;
    if(data.time) text += `時間：${data.time}\n`;
    text += `運動：${data.sport || '（未填）'}\n`;
    if(data.extra) text += `備註：${data.extra}\n`;
    text += `請大家準時參加！`;
    return text;
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  // ---------- 運動興趣列表（成員、老師視角共用） ----------
  let expandedSportVotes = new Set(); // 只是 UI 展開/收合狀態，不是資料

  async function loadSportsList(){
    return (await sGet('sports-list', true)) || [];
  }
  async function saveSportsList(list){
    await sSet('sports-list', list, true);
  }
  function sportVoteCount(item){
    return item.votes ? Object.keys(item.votes).length : 0;
  }
  function sortedSportsList(list){
    return [...list].sort((a,b)=> sportVoteCount(b)-sportVoteCount(a) || a.createdAt.localeCompare(b.createdAt));
  }
  function personName(id){
    const p = people.find(x=>x.id===id);
    return p ? p.name : '(已離開的成員)';
  }

  function buildSportsListHtml(list, currentPersonId, isTeacherNow){
    const sorted = sortedSportsList(list);
    let html = `
      <h2>運動興趣列表</h2>
      <p class="desc">新增想玩的運動、投票「+1 有興趣」，也可以留言討論。</p>
      <div class="add-row">
        <input type="text" id="newSportName" placeholder="輸入想加的運動項目">
        <button id="addSportBtn">新增</button>
      </div>
    `;
    if(!sorted.length){
      html += `<div class="empty">目前還沒有人新增運動項目</div>`;
    }
    sorted.forEach(item=>{
      const voteCount = sportVoteCount(item);
      const votedByMe = !!(item.votes && item.votes[currentPersonId]);
      const canDelete = isTeacherNow || item.createdBy === currentPersonId;
      const expanded = expandedSportVotes.has(item.id);
      let votersHtml = '';
      if(expanded){
        const names = Object.keys(item.votes||{}).map(personName);
        votersHtml = `<div class="summary-names">${names.length ? names.map(n=>`<span class="name-tag free">${escapeHtml(n)}</span>`).join('') : '目前還沒有人投票'}</div>`;
      }
      const commentsHtml = (item.comments||[]).map(c=>{
        const canDeleteComment = isTeacherNow || c.personId === currentPersonId;
        return `<div class="note-line">
          <span class="note-line-text">${escapeHtml(personName(c.personId))}：${escapeHtml(c.text)}</span>
          <span class="note-line-meta"><span class="comment-time">${fmtDateTime(c.createdAt)}</span>${canDeleteComment ? `<button class="del-btn" data-delete-comment="${item.id}:${c.id}">刪除</button>` : ''}</span>
        </div>`;
      }).join('');
      html += `
        <div class="summary-day sport-item">
          <div class="sport-head">
            <div class="sport-title-row">
              <span class="sport-name">${escapeHtml(item.name)}</span>
              <span class="pill" data-vote-toggle="${item.id}" style="cursor:pointer;">${voteCount} 人有興趣</span>
            </div>
            <div class="sport-meta">
              由 ${escapeHtml(personName(item.createdBy))} 新增
              ${canDelete ? `<button class="del-btn" data-delete-sport="${item.id}">刪除</button>` : ''}
            </div>
          </div>
          <div class="sport-actions">
            <div class="status-btn ${votedByMe?'active':''}" data-v="free" data-vote="${item.id}">+1 有興趣</div>
          </div>
          ${votersHtml}
          <div class="sport-comments">
            ${commentsHtml}
            <div class="add-row">
              <input type="text" data-comment-for="${item.id}" placeholder="我有話想說…">
              <button data-comment-submit="${item.id}">送出</button>
            </div>
          </div>
        </div>
      `;
    });
    return html;
  }

  function wireSportsListHandlers(list, currentPersonId, isTeacherNow, rerenderFn){
    async function addSport(){
      const input = document.getElementById('newSportName');
      const name = input.value.trim();
      if(!name) return;
      list.push({
        id:'sp'+Date.now(), name, createdBy:currentPersonId, createdAt:new Date().toISOString(),
        votes:{}, comments:[]
      });
      await saveSportsList(list);
      rerenderFn();
    }
    document.getElementById('addSportBtn').addEventListener('click', addSport);
    document.getElementById('newSportName').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') addSport();
    });
    app.querySelectorAll('[data-vote-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.voteToggle;
        if(expandedSportVotes.has(id)) expandedSportVotes.delete(id);
        else expandedSportVotes.add(id);
        rerenderFn();
      });
    });
    app.querySelectorAll('[data-vote]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const item = list.find(x=>x.id===btn.dataset.vote);
        if(!item) return;
        item.votes = item.votes || {};
        if(item.votes[currentPersonId]) delete item.votes[currentPersonId];
        else item.votes[currentPersonId] = true;
        await saveSportsList(list);
        rerenderFn();
      });
    });
    app.querySelectorAll('[data-delete-sport]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('確定要刪除這個運動項目嗎？')) return;
        const idx = list.findIndex(x=>x.id===btn.dataset.deleteSport);
        if(idx>=0){ list.splice(idx,1); await saveSportsList(list); rerenderFn(); }
      });
    });
    app.querySelectorAll('[data-delete-comment]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const [itemId, commentId] = btn.dataset.deleteComment.split(':');
        const item = list.find(x=>x.id===itemId);
        if(!item || !item.comments) return;
        const idx = item.comments.findIndex(c=>c.id===commentId);
        if(idx>=0){ item.comments.splice(idx,1); await saveSportsList(list); rerenderFn(); }
      });
    });
    async function submitComment(itemId){
      const item = list.find(x=>x.id===itemId);
      if(!item) return;
      const input = app.querySelector(`[data-comment-for="${itemId}"]`);
      const text = input.value.trim();
      if(!text) return;
      item.comments = item.comments || [];
      item.comments.push({id:'c'+Date.now(), personId:currentPersonId, text, createdAt:new Date().toISOString()});
      await saveSportsList(list);
      rerenderFn();
    }
    app.querySelectorAll('[data-comment-submit]').forEach(btn=>{
      btn.addEventListener('click', ()=>submitComment(btn.dataset.commentSubmit));
    });
    app.querySelectorAll('[data-comment-for]').forEach(input=>{
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') submitComment(input.dataset.commentFor);
      });
    });
  }

  // ---------- 畫面：管理入口 ----------
  // ============================================================
  // 姊妹行事曆
  // ------------------------------------------------------------
  // 資料模型（都在 data/ 底下，永久保留，不受 cleanupOldWeeks 影響）：
  //   sis-groups      -> [{id, label, labelAuto, memberIds:[], color}]
  //   sis-meet:<年份> -> [{id, date:'YYYY-MM-DD', groupId, note, createdBy, savedAt}]
  //
  // 可見範圍：每個人只看得到「memberIds 含自己」的組合與其行程。
  // 這是畫面層的過濾，不是資料庫層的權限——同一個 data/ 節點的資料本來就撈得到，
  // 它擋掉的是「不小心看到」跟「無聊亂翻」，不是有心人。要真的擋住得每人綁 Firebase 帳號。
  //
  // 一年一包整包覆寫，跟 people-list、sports-list 一樣是後寫的蓋前寫的。
  // 兩個人同一秒存同一年才會互相蓋掉，以這個使用量可以接受。
  // ============================================================
  const SIS_PALETTE = [
    {name:'磚紅', hex:'#9E4F42'},
    {name:'陶土', hex:'#A06A3C'},
    {name:'芥黃', hex:'#8A7228'},
    {name:'橄欖', hex:'#5F6B47'},
    {name:'松綠', hex:'#3F6F62'},
    {name:'靛藍', hex:'#46617D'},
    {name:'藕紫', hex:'#6B5A88'},
    {name:'玫瑰', hex:'#94547A'}
  ];

  let sisTab = 'calendar';              // calendar | groups | stats
  let sisYear = new Date().getFullYear();
  let sisMonth = new Date().getMonth(); // 0-11
  let sisGroups = [];
  const sisMeetCache = {};              // 年份 -> 見面紀錄陣列
  let sisSheet = null;                  // 開著的底部面板：{kind:'meet'|'group', ...}
  let sisNewSel = [];                   // 新增組合時勾選的成員 id
  let sisNewColor = SIS_PALETTE[0].hex;
  let sisNewLabel = '';                 // 新增組合時打到一半的標籤（勾人／換色會重繪，要留住）
  let sisChart = null;
  let sisLastPerson = null;             // 換人登入時用來重置畫面狀態

  async function sisLoadGroups(){
    const g = await sGet('sis-groups', true);
    sisGroups = Array.isArray(g) ? g : [];
  }
  async function sisSaveGroups(){
    await sSet('sis-groups', sisGroups, true);
  }
  // force=true 會重新跟資料庫拿一次。正在看的那一年每次渲染都重讀，
  // 別人在別的裝置上新增的紀錄才看得到（跟這個站其他畫面的做法一致）。
  async function sisLoadMeets(year, force){
    if(force || !sisMeetCache[year]){
      const m = await sGet('sis-meet:'+year, true);
      sisMeetCache[year] = Array.isArray(m) ? m : [];
    }
    return sisMeetCache[year];
  }
  async function sisSaveMeets(year){
    await sSet('sis-meet:'+year, sisMeetCache[year] || [], true);
  }

  function sisGroupById(id){ return sisGroups.find(g=>g.id===id) || null; }
  function sisMyGroups(){
    return sisGroups.filter(g => (g.memberIds||[]).indexOf(currentPersonId) >= 0);
  }
  function sisCanSee(meet){
    const g = sisGroupById(meet.groupId);
    return !!g && (g.memberIds||[]).indexOf(currentPersonId) >= 0;
  }
  function sisVisibleMeets(year){
    return (sisMeetCache[year]||[]).filter(sisCanSee);
  }

  // 中文姓名取單字首：三個字以上取第二個字（跳過姓），兩個字取第一個字。
  // 取不準也沒關係，標籤本來就可以自己改。
  function sisInitial(name){
    const n = (name||'').trim();
    if(!n) return '?';
    return n.length >= 3 ? n.charAt(1) : n.charAt(0);
  }
  function sisAutoLabel(ids){
    return ids.map(id=>{
      const p = people.find(x=>x.id===id);
      return sisInitial(p ? p.name : '');
    }).join('＋');
  }
  function sisGroupLabel(g){
    if(!g) return '(已刪除的組合)';
    if(g.labelAuto) return sisAutoLabel(g.memberIds||[]);
    return g.label || sisAutoLabel(g.memberIds||[]);
  }
  function sisMemberNames(g){
    return (g.memberIds||[]).map(id=>personName(id)).join('・');
  }

  // 某一年裡，每筆紀錄在自己組合中是第幾次（依日期排序，同日期用 id 穩定排序）
  function sisNthMap(year){
    const sorted = (sisMeetCache[year]||[]).slice().sort((a,b)=>
      a.date === b.date ? String(a.id).localeCompare(String(b.id)) : a.date.localeCompare(b.date)
    );
    const running = {}, map = {};
    sorted.forEach(m=>{
      running[m.groupId] = (running[m.groupId]||0) + 1;
      map[m.id] = running[m.groupId];
    });
    return map;
  }
  // 還沒存檔時，預告這筆會是第幾次
  function sisNthPreview(year, groupId, date, excludeId){
    let n = 1;
    (sisMeetCache[year]||[]).forEach(m=>{
      if(m.groupId !== groupId || m.id === excludeId) return;
      if(m.date <= date) n++;
    });
    return n;
  }

  function sisMonthCells(year, month){
    const startDow = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month+1, 0).getDate();
    const prevLast = new Date(year, month, 0).getDate();
    const cells = [];
    for(let i=startDow-1; i>=0; i--) cells.push({n: prevLast-i, out:true});
    for(let d=1; d<=lastDay; d++) cells.push({n:d, out:false});
    let next = 1;
    while(cells.length % 7 !== 0) cells.push({n: next++, out:true});
    return cells;
  }
  function sisDateKey(year, month, day){
    return year + '-' + pad(month+1) + '-' + pad(day);
  }
  function sisFmtDate(dateStr){
    const parts = dateStr.split('-');
    return parseInt(parts[1],10) + '/' + parseInt(parts[2],10);
  }
  function sisWeekdayOf(dateStr){
    const parts = dateStr.split('-');
    const d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return WEEKDAY_NAMES[d.getDay()];
  }

  async function renderSisters(){
    const myRenderToken = ++renderGen;
    const person = people.find(p=>p.id===currentPersonId);
    if(!person){ view='pickPerson'; return render(); }
    if(!person.canSis){ view = person.isTeacher ? 'teacher' : 'member'; return render(); }

    // 換人登入就把分頁、年月、填到一半的表單全部重置，不要把上一個人的狀態帶過來
    if(sisLastPerson !== currentPersonId){
      sisLastPerson = currentPersonId;
      const now = new Date();
      sisTab = 'calendar';
      sisYear = now.getFullYear();
      sisMonth = now.getMonth();
      sisSheet = null;
      sisNewSel = [];
      sisNewLabel = '';
      sisNewColor = SIS_PALETTE[0].hex;
    }

    await sisLoadGroups();
    await sisLoadMeets(sisYear, true);
    if(myRenderToken !== renderGen) return;

    const mine = sisMyGroups();
    let bodyHtml = '';
    if(sisTab === 'calendar')      bodyHtml = sisCalendarHtml(mine);
    else if(sisTab === 'groups')   bodyHtml = sisGroupsHtml(mine, person);
    else                           bodyHtml = sisStatsHtml(mine);

    app.innerHTML = `
      <header class="top">
        <div class="brand"><span class="seed">●</span> 姊妹行事曆 <span class="seed">●</span></div>
        <div class="sub">${escapeHtml(person.name)} 的見面紀錄</div>
      </header>
      <div class="sis">
        <div class="sis-who"><span class="dot"></span>目前是 ${escapeHtml(person.name)} 的視角，只顯示有你的組合與行程</div>
        <div class="sis-tabs">
          <button data-stab="calendar" class="${sisTab==='calendar'?'active':''}">月曆</button>
          <button data-stab="groups" class="${sisTab==='groups'?'active':''}">組合</button>
          <button data-stab="stats" class="${sisTab==='stats'?'active':''}">統計</button>
        </div>
        ${bodyHtml}
        ${sisSheetHtml(mine)}
      </div>
      <div class="footer-link"><a href="#" id="backLink">返回我的畫面</a></div>
    `;

    if(sisTab === 'stats') sisDrawChart(mine);
    sisWire(mine, person);

    document.getElementById('backLink').addEventListener('click', (e)=>{
      e.preventDefault();
      sisSheet = null;
      view = person.isTeacher ? 'teacher' : 'member';
      render();
    });
  }

  // ---------- 月曆 ----------
  function sisCalendarHtml(mine){
    if(!mine.length){
      return `<div class="sis-card">
        <div class="sis-cardhead"><span>還沒有任何組合</span></div>
        <div class="sis-hint">先到「組合」分頁建立一個組合（例如你跟某位姊妹），之後才能在月曆上記錄見面。</div>
        <button class="sis-btn" data-goto="groups">去建立第一個組合</button>
      </div>`;
    }

    const nth = sisNthMap(sisYear);
    const monthPrefix = sisYear + '-' + pad(sisMonth+1) + '-';
    const monthMeets = sisVisibleMeets(sisYear)
      .filter(m => m.date.indexOf(monthPrefix) === 0)
      .sort((a,b)=> a.date.localeCompare(b.date));
    const byDay = {};
    monthMeets.forEach(m=>{ (byDay[parseInt(m.date.slice(8),10)] = byDay[parseInt(m.date.slice(8),10)] || []).push(m); });

    const today = new Date();
    const isThisMonth = (today.getFullYear()===sisYear && today.getMonth()===sisMonth);

    let cellsHtml = '';
    sisMonthCells(sisYear, sisMonth).forEach(c=>{
      if(c.out){
        cellsHtml += `<div class="sis-cell out"><span class="d">${c.n}</span></div>`;
        return;
      }
      const list = byDay[c.n] || [];
      const chips = list.map(m=>{
        const g = sisGroupById(m.groupId);
        return `<div class="sis-chip" style="background:${g ? g.color : '#8A7A64'}">#${nth[m.id]||'?'}</div>`;
      }).join('');
      const cls = 'sis-cell' + (isThisMonth && c.n===today.getDate() ? ' today' : '');
      cellsHtml += `<div class="${cls}" data-day="${c.n}"><span class="d">${c.n}</span>${chips}</div>`;
    });

    let listHtml = '';
    if(monthMeets.length){
      listHtml = monthMeets.map(m=>{
        const g = sisGroupById(m.groupId);
        const noteLine = (m.note && m.note.trim())
          ? `（${sisWeekdayOf(m.date)}）${escapeHtml(m.note)}`
          : `星期${sisWeekdayOf(m.date)}`;
        return `<div class="sis-ev" data-meet="${m.id}">
          <span class="dt">${sisFmtDate(m.date)}</span>
          <span class="sw" style="background:${g ? g.color : '#8A7A64'}"></span>
          <span class="txt"><span class="lb">${escapeHtml(sisGroupLabel(g))}</span>
            <div class="no">${noteLine}</div></span>
          <span class="nth">#${nth[m.id]||'?'}</span>
        </div>`;
      }).join('');
    } else {
      listHtml = '<div class="empty">這個月還沒有紀錄，點上面的日期就能新增。</div>';
    }

    const yearTotal = sisVisibleMeets(sisYear).length;

    return `
      <div class="sis-card">
        <div class="sis-nav">
          <button data-mnav="-1" aria-label="上個月">‹</button>
          <div class="lbl">${sisYear} 年 ${sisMonth+1} 月</div>
          <button data-mnav="1" aria-label="下個月">›</button>
        </div>
        <div class="sis-wd">${WEEKDAY_NAMES.map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="sis-grid">${cellsHtml}</div>
      </div>
      <div class="sis-sum">
        <div><div class="k">本月見面</div><div class="v">${monthMeets.length} 次</div></div>
        <div><div class="k">${sisYear} 年累計</div><div class="v">${yearTotal} 次</div></div>
      </div>
      <div class="sis-card">
        <div class="sis-cardhead"><span>本月見面紀錄</span><span class="cnt">${monthMeets.length}</span></div>
        <div class="sis-hint">點任一筆可以修改或刪除。</div>
        ${listHtml}
      </div>
    `;
  }

  // ---------- 組合 ----------
