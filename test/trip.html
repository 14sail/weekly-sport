<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程行程</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCM3vjVCn1jN_koNyZr2xL0z6ikledqG_0",
    authDomain: "weekly-sport-test.firebaseapp.com",
    databaseURL: "https://weekly-sport-test-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "weekly-sport-test",
    storageBucket: "weekly-sport-test.firebasestorage.app",
    messagingSenderId: "377712374301",
    appId: "1:377712374301:web:1168a4a1cb16616c9f4cf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  window.db = getDatabase(app);
  window.dbRef = ref;
  window.dbGet = get;
  window.dbSet = set;

  signInAnonymously(auth)
    .catch((e)=>console.error('anonymous sign-in failed', e))
    .finally(()=>{
      window.firebaseReady = true;
      document.dispatchEvent(new Event('firebase-ready'));
    });
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #796B58;
    --line: #E4D9C4;
    --line-soft: #DFD7C9;
    --line-hour: #C4B79E;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    /* 語意色疊在自己的淺底上要另外一組。--red/--green/--amber 是照「放在 --bg-card
       上」調的（4.59／4.55／2.98），一放到同色淺底就掉到 3.72／3.81／2.54，小字過不了
       4.5:1。文字疊在 -soft 底色上一律用這三個，實心按鈕和框線維持用原本的。 */
    --red-ink: #A04E3D;     /* 4.58 on --red-soft */
    --green-ink: #5E6B46;   /* 4.72 on --green-soft */
    --amber-ink: #8A6220;   /* 4.57 on --amber-soft */
    --radius: 16px;
    --radius-sm: 10px;
    /* 疊層順序集中在這裡，不要在各處自己填數字 */
    --z-stick: 20;
    --z-corner: 30;   /* 說明鈕要浮在釘住的日期列之上 */
    --z-help: 50;
    --z-mask: 40;
    --z-sheet: 41;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 18px; }

  header.top{ padding:26px 18px 16px; text-align:center; position:relative; }
  header.top .brand{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px;
    letter-spacing:.05em;
  }
  header.top .seed{ color:var(--accent); }
  header.top .who{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  /* 右上角的說明鈕，跟運動排程站的角落鈕同一個做法 */
  .corner-btn{
    position:fixed; z-index:var(--z-corner);
    /* 橫向使用時瀏海會吃掉右上角，所以要把安全區算進去 */
    top:calc(10px + env(safe-area-inset-top));
    right:calc(10px + env(safe-area-inset-right));
    width:44px; height:44px; padding:0; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:50%; box-shadow:0 1px 3px rgba(58,46,34,.12);
  }
  .corner-btn .ic{ width:19px; height:19px; vertical-align:0; margin:0; }
  .corner-btn:active{ background:var(--accent-soft); color:var(--accent-deep); }

  /* 說明書：整頁蓋掉，內容長，要能好好捲 */
  .help{
    position:fixed; inset:0; z-index:var(--z-help);
    background:var(--bg); overflow-y:auto;
    padding:0 18px calc(28px + env(safe-area-inset-bottom));
  }
  .help-in{ max-width:620px; margin:0 auto; }
  .help-top{
    position:sticky; top:0; background:var(--bg);
    display:flex; align-items:center; gap:10px;
    padding:14px 0 10px; margin-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .help-top h1{ flex:1; min-width:0; margin:0; font-size:18px; }
  .help h2{
    font-family:'Noto Serif TC',serif; font-size:13px; letter-spacing:.12em;
    color:var(--accent); margin:26px 0 10px; font-weight:700;
  }
  .help dl{ margin:0; }
  .help dt{
    font-size:14.5px; font-weight:700; color:var(--ink); margin-top:14px;
  }
  .help dt:first-child{ margin-top:0; }
  .help dd{
    margin:3px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.75;
  }
  .help .step{
    display:flex; gap:10px; align-items:baseline;
    padding:9px 0; border-top:1px solid var(--line-soft); font-size:14px;
  }
  .help .step:first-of-type{ border-top:0; }
  .help .step b{ flex:none; color:var(--accent-deep); }
  .help ul{ margin:0; padding-left:1.15em; font-size:13.5px; line-height:1.8; color:var(--ink-soft); }
  .help ul li::marker{ color:var(--accent); }

  .list-title{ margin:2px 0 12px; }
  .card{
    background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-bottom:14px;
  }
  h1{ font-family:'Noto Serif TC',serif; font-size:19px; margin:0 0 8px; }
  h2{ font-size:16px; margin:0 0 10px; }
  p.desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:inline-block; border:1px solid var(--accent-deep); background:var(--accent-deep);
    color:#fff; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:500;
  }
  .btn.ghost{ background:transparent; color:var(--accent-deep); }
  .btn.wide{ display:block; width:100%; text-align:center; }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  .btn.danger{ background:var(--red); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* min-height 44px：手指點得到的最小尺寸。原本算出來只有約 38px。 */
  input, select, textarea{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 11px; width:100%;
    min-height:44px;
  }
  /* 核取方塊不適用上面的最小高度，會被撐成一個 44px 的大方塊。
     觸控範圍改由包住它的整列 .chk-row 提供。 */
  input[type="checkbox"], input[type="radio"]{ width:auto; min-height:0; }
  .chk-row{
    display:flex; gap:10px; align-items:center; min-height:44px;
    padding:2px; font-size:14.5px;
  }
  /* --accent-soft 對卡片底只有 1.28:1，等於把瀏覽器原本看得見的外框換成看不見的。
     焦點指示要 3:1，改用跟 button:focus-visible 同一個 --accent-deep（6.63:1）。 */
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent-deep); outline-offset:1px; }

  /* 鍵盤操作要看得到焦點在哪。用 :focus-visible，滑鼠點按不會跳出外框。 */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-deep); outline-offset:2px; border-radius:var(--radius-sm);
  }
  /* 去掉行動瀏覽器點擊後那 300ms 的等待（等雙擊縮放） */
  button, a, label, summary{ touch-action:manipulation; }

  /* 按下去要馬上看得到反應。一律用顏色變化，不動版面，免得畫面跳動。 */
  .mini:active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep); }
  .btn:active{ filter:brightness(.92); }
  .picker-list button:active,
  .trip-card:active,
  .daybar button:active{ background:var(--accent-soft); }
  .sheet-place:active{ background:var(--accent-deep); color:#fff; }
  .sheet-place:active .pcode{ background:rgba(255,255,255,.3); color:#fff; }
  .tt-block:active .tt-b-in{ border-color:var(--accent-deep); box-shadow:0 0 0 2px var(--accent-soft); }

  /* 選中狀態（.on）跟 :active 同優先級且寫在後面，會把按壓回饋整個蓋掉。
     這些規則多一個 class，優先級才壓得過去。
     實心的選中狀態按下用「變暗」，套淺色底會看起來像被取消選取。 */
  .tabs button.on:active,
  .daybar button.on:active,
  .switchbar a.on:active{ filter:brightness(.9); }
  .mini.on:active{ filter:brightness(.94); }
  .switchbar a:active{ background:var(--accent-soft); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .person-btn:active{ transform:none; }
  }
  label.fld{ display:block; margin-bottom:10px; }
  label.fld > span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .msg{ font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; }
  .msg.err{ background:var(--red-soft); color:var(--red-ink); }
  .msg.ok{ background:var(--green-soft); color:var(--green-ink); }
  .msg.warn{ background:var(--amber-soft); color:var(--amber-ink); }

  /* ---------- 旅程卡 ---------- */
  .trip-card{
    background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    color:inherit; font-size:inherit;
  }
  /* 不用 opacity 淡化：整張卡連文字一起變淡，說明文字的對比會掉到 2.97，
     低於 4.5 的標準。改成把底色壓成頁面底色，看起來一樣是「收起來的」，
     但文字維持原本的對比。狀態另有「已結束」標籤，不靠顏色分辨。 */
  .trip-card.done{ background:var(--bg); }
  /* .done 跟 :active 同為兩個 class 的優先級，.done 寫在後面會贏，
     已結束的卡片就完全沒有按壓回饋。這條把它補回來。 */
  .trip-card.done:active{ background:var(--accent-soft); }
  .trip-card .tc-main{ flex:1; min-width:0; }
  .trip-card .tc-name{ font-weight:700; font-size:16px; }
  .trip-card .tc-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .trip-card .tc-go{ color:var(--accent); font-size:20px; }

  /* ---- 選人畫面：跟運動排程站一樣的小方塊 ---- */
  .people-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .person-btn{
    height:64px; display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:8px; text-align:center;
    font-size:14px; font-weight:500; color:var(--accent-deep); cursor:pointer;
  }
  .person-btn:active{ transform:scale(0.97); }

  .tag{
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
    border:1px solid var(--line); color:var(--ink-soft); background:#fff; margin-left:6px;
  }
  .tag.hot{ border-color:var(--red); color:var(--red-ink); background:var(--red-soft); }
  .tag.soft{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }

  /* ---------- 分頁 ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button{
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:13.5px;
  }
  .tabs button.on{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; font-weight:500; }

  /* ---------- 日期列 ---------- */
  .daybar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .daybar button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--bg-card);
    border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; color:var(--ink-soft);
    text-align:center; line-height:1.35;
  }
  .daybar button.on{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; }
  .daybar button .d2{ display:block; font-size:11px; opacity:.8; }
  .daybar button.half{ border-style:dashed; }

  /* ---------- 課表 ---------- */
  /* 分頁列＋日期列釘在畫面上緣，往下捲課表時還能直接換天，不用捲回去 */
  .tt-stick{
    position:sticky; top:0; z-index:var(--z-stick);
    background:var(--bg); padding-top:6px; margin:0 -18px; padding-left:18px; padding-right:18px;
    box-shadow:0 6px 10px -8px rgba(58,46,34,.35);
  }
  .tt-bar{ display:flex; align-items:center; gap:8px; margin:10px 0; }

  .tt{ position:relative; display:grid; grid-template-columns:44px 1fr; margin-bottom:14px; }
  .tt-gutter{ position:relative; }
  .tt-tick{
    position:absolute; right:8px; transform:translateY(-50%);
    font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  /* 車道是「表面」不是卡片，所以用頁面底色，行程方塊才浮得起來。
     本來這裡是 --bg-card，跟交通分類的方塊同一個色票，那些白卡片只剩一條
     1px 框線撐著，等於看不見。其他分類是靠色相（紅綠琥珀咖啡）在區分，
     不是靠明暗——五種底色對車道都只有 1.06～1.15，交通連色相都沒有。
     這也讓時間軸跟全站一致：白卡片浮在米色頁面上。 */
  .tt-lane{
    position:relative; overflow:hidden;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm);
  }
  /* 被壓縮的區段：它代表「這裡什麼都沒有」，所以要是整頁最安靜的地方。
     原本畫滿斜紋反而變成最吵的東西，改成一塊比車道略沉的色塊，
     裡面的格線改成虛線就夠了。
     車道改成 --bg 之後這裡不能再用 --bg（會同色消失），換成 --line-soft，
     對車道是 1.27，比原本的 1.11 還清楚一點。 */
  .tt-sq{
    position:absolute; left:0; right:0; pointer-events:none;
    background:var(--line-soft);
  }
  .tt-line{
    position:absolute; left:0; right:0; height:0;
    border-top:1px solid var(--line-soft);
  }
  .tt-line.hr{ border-top-color:var(--line-hour); }
  .tt-line.sq{ border-top-style:dashed; }
  /* 壓縮區的整點線要比外面淡，但底色換成 --line-soft 之後 --line 只剩 1.02，
     整條線等於不見了。--line-hour 對壓縮底是 1.39，對照一般區的 1.76，
     一樣是「比外面安靜」但看得到。 */
  .tt-line.hr.sq{ border-top-color:var(--line-hour); }
  .tt-block{
    position:absolute; padding:0 2px; cursor:grab;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    /* 預設＝交通／沒有分類。分類 class 掛在這一層而不是 .tt-b-in 上，
       因為 .tt-grip 是 .tt-b-in 的兄弟節點，自訂屬性只往下繼承，
       掛在裡面的話把手讀不到 --tint-ink，編號 chip 的字會沒有顏色。 */
    --tint-bg:var(--bg-card);
    --tint-ink:var(--ink-soft);    /* 次要文字：時間、第二行、編號 */
  }
  /* 分類底色。六個分類、四組淺底加白底，所以交通與其他共用中性的白。
     次要文字疊在有色底上一定要換成該色的 -ink：--ink-soft 在這四種淺底上
     只有 3.99～4.34，過不了小字的 4.5:1。
     五組都算過：名稱（--ink）≥10.1、次要（--tint-ink）≥4.57、編號 chip 在白底上 ≥5.09。 */
  .tt-block.c-move{ --tint-bg:var(--bg-card);     --tint-ink:var(--ink-soft); }
  .tt-block.c-eat{  --tint-bg:var(--red-soft);    --tint-ink:var(--red-ink); }
  .tt-block.c-see{  --tint-bg:var(--accent-soft); --tint-ink:var(--accent-deep); }
  .tt-block.c-stay{ --tint-bg:var(--green-soft);  --tint-ink:var(--green-ink); }
  .tt-block.c-shop{ --tint-bg:var(--amber-soft);  --tint-ink:var(--amber-ink); }
  .tt-b-in{
    height:100%; overflow:hidden; padding:6px 10px;
    background:var(--tint-bg); border:1px solid var(--line);
    border-radius:var(--radius-sm);
    display:flex; flex-direction:column; gap:2px;
  }

  /* 標題一行到底：編號、名稱（過長省略號）、時間靠右。不分方塊高矮都一樣。 */
  .tt-b-hd{ display:flex; align-items:center; gap:7px; }
  .tt-b-hd .pcode{
    flex:none; margin-right:0; min-width:20px; padding:0 4px;
    font-size:11px; line-height:16px;
    background:var(--bg-card); border:1px solid var(--line); color:var(--tint-ink);
  }
  .tt-b-name{
    flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--ink); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tt-b-time{ flex:none; font-size:11px; color:var(--tint-ink); font-variant-numeric:tabular-nums; }
  .tt-b-sub{
    font-size:11.5px; line-height:1.5; color:var(--tint-ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* 上下邊帶＝拉時間，中間＝整塊移動。邊帶只在方塊夠高時才畫，見 GRIP_MIN_PX。
     高度是行內樣式給的（依方塊高度算），這裡只管定位和長相。 */
  .tt-grip{ position:absolute; left:2px; right:2px; cursor:ns-resize; }
  .tt-grip.top{ top:0; }
  .tt-grip.bot{ bottom:0; }
  /* 一段細線當提示。原本是 26x3px 實心浮在邊緣內側，看起來像卡片裂了一條縫；
     改成 34x2px、貼著邊。把手是操作元件不是分類標示，所以不跟著分類變色——
     --accent 在五種方塊底色上都是 3.06～3.90，過得了非文字 3:1 而且夠輕；
     --ink-soft 會到 3.99～5.09，在白色的交通卡片上太搶戲。 */
  .tt-grip::after{
    content:''; position:absolute; left:50%; transform:translateX(-50%);
    width:34px; height:2px; border-radius:99px; background:var(--accent);
  }
  .tt-grip.top::after{ top:2px; }
  .tt-grip.bot::after{ bottom:2px; }
  .tt-grip:active::after{ background:var(--ink); height:3px; }
  .tt-block.drag{ z-index:5; cursor:grabbing; }
  .tt-block.drag .tt-b-in{ box-shadow:0 8px 20px rgba(58,46,34,.25); border-color:var(--accent-deep); }
  /* 拖曳中的落點時間。方塊矮的時候名稱和時間會擠成一行，正好被手指蓋住，
     所以另外釘一個在畫面上緣。白字配 --accent-deep 是 6.74:1。 */
  .tt-hud{
    display:none; position:fixed; z-index:var(--z-sheet); pointer-events:none;
    top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%);
    background:var(--accent-deep); color:#fff; border-radius:99px;
    padding:8px 16px; font-size:14px; font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums; box-shadow:0 6px 18px rgba(58,46,34,.3);
  }
  .tt-hud.on{ display:block; }

  /* ---------- 貼底面板 ---------- */
  body.sheet-open{ overflow:hidden; }
  .sheet-mask{ position:fixed; inset:0; background:rgba(58,46,34,.45); z-index:var(--z-mask); }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:var(--z-sheet);
    background:var(--bg-card); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:8px 18px 18px;
    /* dvh 才是手機上真正可見的高度，vh 會被瀏覽器工具列灌水 */
    max-height:82vh; max-height:82dvh; overflow-y:auto;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(58,46,34,.18);
  }
  /* 只有「剛打開」才滑入。按 ±15 分會整頁重繪，不加這個判斷的話
     每按一次面板就重新滑一次，很煩。 */
  .sheet.in{ animation:sheet-up .22s cubic-bezier(.2,.8,.25,1); }
  .sheet-mask.in{ animation:sheet-fade .22s ease-out; }
  @keyframes sheet-up{ from{ transform:translateY(100%); } }
  @keyframes sheet-fade{ from{ opacity:0; } }
  .sheet-grip{
    width:40px; height:4px; border-radius:99px; background:var(--line);
    margin:0 auto 14px;
  }
  .sheet h3{ font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 12px; }
  /* 面板最上面那列就是進景點編輯的入口 */
  .sheet-place{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;
    color:var(--accent-deep); font-size:15px; font-weight:700; min-height:44px;
  }
  .sheet-place .sp-name{ flex:1; min-width:0; }
  .sheet-place .sp-go{ flex:none; display:flex; }
  .sheet-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0; border-top:1px solid var(--line-soft);
  }
  .sheet-row .lab{ font-size:12.5px; color:var(--ink-soft); }
  .sheet-row .val{ font-size:14px; font-weight:700; min-width:52px; text-align:center; }
  .sheet-note{
    font-size:12.5px; color:var(--ink-soft); line-height:1.6;
    padding:10px 0 2px; border-top:1px solid var(--line-soft);
  }

  /* width:auto 讓瀏覽器照自己的語系決定寬度。中文 Chrome 會顯示成「上午 09:00」，
     寫死寬度會把分鐘切掉。 */
  input.start-time{
    width:auto; min-width:0; flex:none; padding:4px 7px;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--accent-deep); background:var(--accent-soft); border-color:var(--accent);
  }


  /* 看起來還是小顆，但用 ::after 把可點範圍撐到 44px。
     直接把按鈕做成 44px 高會讓整排控制鈕變得很笨重。
     inset 的 4px 剛好等於 gap 的一半，相鄰按鈕的感應範圍不會疊在一起。 */
  .mini{
    position:relative;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px; line-height:1.3;
    min-height:36px; display:inline-flex; align-items:center; gap:5px;
    touch-action:manipulation;
  }
  .mini::after{ content:''; position:absolute; inset:-4px; }
  .mini.on{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }
  .mini.warn{ border-color:var(--red); color:var(--red); }
  .mini.grab{ cursor:grab; }
  .spacer{ flex:1; }

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:22px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px;
  }

  /* ---------- 搜尋下拉 ---------- */
  .picker{ position:relative; }
  .picker-list{
    border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff;
    max-height:240px; overflow-y:auto; margin-top:6px;
  }
  .picker-list button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 12px; font-size:14px; color:inherit; border-bottom:1px solid var(--line);
  }
  .picker-list button:last-child{ border-bottom:0; }
  .picker-list button:hover{ background:var(--accent-soft); }
  .picker-list .pl-sub{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .picker-list .none{ padding:12px; font-size:13px; color:var(--ink-soft); }

  /* ---------- 行前 ---------- */
  .pre-h{
    font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 10px;
  }
  .pre-row{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .pre-top{ display:flex; align-items:center; gap:8px; }
  .pre-text{ flex:1; min-width:0; font-size:14.5px; font-weight:500; }
  .pre-text.note{ font-weight:400; color:var(--ink-soft); }
  .pre-sep{
    font-size:12px; letter-spacing:.1em; color:var(--ink-soft);
    margin:20px 0 8px;
  }
  /* 一起的清單：一個項目一列，成員名字只在表頭出現一次。
     成員多的時候橫向捲動，項目名稱那一欄釘住不動。 */
  .sr-only{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }
  .pre-table-wrap{
    overflow-x:auto; background:var(--bg-card);
    border:1px solid var(--line); border-radius:var(--radius);
  }
  .pre-table{ border-collapse:collapse; width:100%; }
  .pre-table th, .pre-table td{ padding:0; }
  .pre-table thead th{
    font-size:12px; font-weight:500; color:var(--ink-soft);
    padding:9px 4px; text-align:center; white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  .pre-table tbody tr + tr th, .pre-table tbody tr + tr td{ border-top:1px solid var(--line-soft); }
  .pre-table .c-name{
    text-align:left; position:sticky; left:0; z-index:1;
    background:var(--bg-card); min-width:104px;
  }
  .pre-table thead .c-name{ border-bottom:1px solid var(--line); }
  .pre-table .c-name button{
    display:block; width:100%; text-align:left; border:0; background:none;
    padding:10px 10px 10px 13px; font-size:14px; font-weight:500; color:inherit;
    min-height:44px; line-height:1.4;
  }
  .pre-table .c-name button:active{ background:var(--accent-soft); }
  .all-pill{
    min-width:42px; height:44px; padding:0 6px; border:0; background:none;
    font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .all-pill.on{ color:var(--accent-deep); font-weight:700; }
  .all-pill:active{ background:var(--accent-soft); }
  .cell-tick{
    width:100%; min-width:40px; height:44px; padding:0; border:0; background:none;
    display:grid; place-items:center;
  }
  .cell-tick .box{
    width:24px; height:24px; border-radius:7px;
    border:1px solid var(--line); background:#fff; color:#fff;
    display:grid; place-items:center;
  }
  .cell-tick .box .ic{ width:14px; height:14px; margin:0; vertical-align:0; }
  .cell-tick.on .box{ background:var(--accent-deep); border-color:var(--accent-deep); }
  .cell-tick:active .box{ background:var(--accent-soft); }
  .cell-tick.on:active .box{ filter:brightness(.9); background:var(--accent-deep); }

  .pre-form{
    background:var(--bg-card); border:1px solid var(--accent); border-radius:var(--radius);
    padding:14px; margin-bottom:8px;
  }

  .memo-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .memo-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .memo-head h3{
    flex:1; min-width:0; margin:0;
    font-family:'Noto Serif TC',serif; font-size:15px;
  }
  .memo-item{
    display:flex; align-items:center; gap:9px;
    padding:5px 0; border-top:1px solid var(--line-soft); min-height:44px;
  }
  .memo-item:first-of-type{ border-top:0; }
  .mi-tick{
    flex:none; position:relative; width:26px; height:26px; padding:0;
    border:1px solid var(--line); background:#fff; color:#fff;
    border-radius:8px; display:grid; place-items:center;
  }
  .mi-tick::after{ content:''; position:absolute; inset:-9px; }
  .mi-tick .ic{ width:15px; height:15px; margin:0; vertical-align:0; }
  .mi-tick.on{ background:var(--accent); border-color:var(--accent); }
  .mi-tick:active{ background:var(--accent-soft); }
  .mi-tick.on:active{ filter:brightness(.9); background:var(--accent); }
  .mi-text{ flex:1; min-width:0; font-size:14px; }
  .mi-note{ flex:1; min-width:0; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }

  /* ---------- 景點 ---------- */
  .place-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .place-card .pc-name{ font-weight:600; font-size:15px; }
  /* 景點編號 A、B、C…，建立時就固定，用來在搜尋框裡快速叫出某個景點 */
  .pcode{
    display:inline-block; min-width:21px; text-align:center;
    font-size:11.5px; font-weight:700; letter-spacing:.04em;
    color:var(--accent-deep); background:var(--accent-soft);
    border-radius:6px; padding:1px 5px; margin-right:7px;
  }
  .place-card .pc-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6; }
  .place-card .pc-note:empty{ display:none; }
  .place-card .pc-btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }

  .hint{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin-top:8px; }
  .foot{ text-align:center; margin-top:26px; }
  .foot button{ background:none; border:0; color:var(--ink-soft); font-size:13px; text-decoration:underline; }

  /* 視窗夠寬時把景點清單搬到右邊當參考，手機完全不受影響 */
  .side{ display:none; }
  @media (min-width:1000px){
    /* 只有課表需要放右欄才變寬；列表和表單維持 760px，一行才不會長到難讀 */
    .wrap.wide{ max-width:1140px; }
    .tl-cols{ display:grid; grid-template-columns:1fr 300px; gap:22px; align-items:start; }
    /* 景點分頁沒有右欄，用兩欄把多出來的寬度吃掉，卡片才不會被拉成長條 */
    .place-list{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; align-items:start; }
    /* 兩欄並排時高度一長一短會很亂。桌機把每張卡片鎖成一樣高：名稱一行、
       停留一行、備註一行，超出的用省略號（全文在編輯畫面，滑鼠停著也看得到）。
       手機是單欄、上下沒得比，維持完整顯示，這整段只在桌機生效。 */
    .place-list .pc-name{ display:flex; align-items:center; flex-wrap:nowrap; min-width:0; }
    .place-list .pc-nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .place-list .pc-name .pcode, .place-list .pc-name .tag{ flex:none; }
    .place-list .pc-line{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* 沒備註的卡片也要留著那一行，不然它會比隔壁矮一行 */
    /* 12.5px x 1.6 line-height = 20px，剛好一行的高度 */
    .place-list .pc-note:empty{ display:block; min-height:20px; }
    .side{ display:block; position:sticky; top:12px; }
    .side h3{ font-family:'Noto Serif TC',serif; font-size:14px; margin:0 0 8px; }
    .side-list{
      border:1px solid var(--line); border-radius:var(--radius-sm);
      background:var(--bg-card); max-height:70vh; overflow-y:auto;
    }
    .side-list button{
      display:block; width:100%; text-align:left; border:0; background:transparent;
      padding:10px 12px; font-size:13.5px; color:inherit; border-bottom:1px solid var(--line-soft);
      min-height:44px;
    }
    .side-list button:last-child{ border-bottom:0; }
    .side-list button:hover{ background:var(--accent-soft); }
    .side-list button:active{ background:var(--accent-soft); color:var(--accent-deep); }
    .side-list .sl-sub{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  }

  .switchbar{ display:flex; gap:8px; margin-bottom:14px; }
  .switchbar a{
    flex:1; text-align:center; text-decoration:none; font-size:13.5px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:8px 10px;
  }
  .switchbar a.on{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; font-weight:500; }


  /* Feather Icons 內嵌用 */
  .ic{ width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto; }
  .mini .ic, .btn .ic{ margin-right:.3em; }
  .mini .ic{ margin-right:0; }
  .mini.icon-only .ic, .btn .ic.only{ margin-right:0; }

  /* 離線唯讀：所有會改資料的控制項一律停用 */
  .offbar{
    display:flex; align-items:center; gap:9px;
    background:var(--amber-soft); border:1px solid var(--amber); color:#7d5716;
    border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:14px;
    font-size:13px; line-height:1.6;
  }
  .offbar .ic{ width:1.2em; height:1.2em; }
  button:disabled, input:disabled, select:disabled{ opacity:.4; cursor:not-allowed; }

  @media (max-width:480px){
    .row2{ grid-template-columns:1fr; }
    .desktop-only{ display:none !important; }
  }
  @media (min-width:481px){
    .mobile-only{ display:none !important; }
  }
</style>

<body>

<header class="top">
  <div class="brand"><span class="seed">●</span> 旅程行程 <span class="seed">●</span></div>
  <div class="who" id="whoLine"></div>
</header>
<button class="corner-btn" id="helpBtn" title="說明書" aria-label="說明書"></button>

<div class="wrap" id="app">
  <div class="card"><p class="desc">載入中…</p></div>
</div>

<script>
(function(){
  'use strict';

  const app = document.getElementById('app');
  const whoLine = document.getElementById('whoLine');
  const helpBtn = document.getElementById('helpBtn');

  // 圖示：Feather Icons 4.29.2（MIT License, https://feathericons.com）
  // tack 來自 Lucide（Feather 的後繼，同樣 MIT），Feather 本身沒有圖釘。
  // 直接內嵌 SVG path，不連 CDN，離線一樣顯示得出來。
  const ICONS = {
    map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>',
    wallet:'<rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>',
    route:'<polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>',
    note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    trash:'<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
    edit:'<path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>',
    gear:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
    back:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
    offline:'<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path><line x1="1" y1="1" x2="23" y2="23"></line>',
    chevR:'<polyline points="9 18 15 12 9 6"></polyline>',
    help:'<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>',
    close:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    check:'<polyline points="20 6 9 17 4 12"></polyline>',
    up:'<polyline points="18 15 12 9 6 15"></polyline>',
    down:'<polyline points="6 9 12 15 18 9"></polyline>'
  };
  function ic(name){
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }

  // ================= Storage（與 index.html 同一層 data/ 節點） =================
  function safeKey(key){ return key.replace(/[.#$\[\]]/g, '_'); }

  async function sGet(key){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data/' + safeKey(key)));
      if(!snap.exists()) return null;
      return JSON.parse(snap.val());
    }catch(e){ console.error('sGet error', key, e); return null; }
  }
  async function sSet(key, val){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), JSON.stringify(val));
      return true;
    }catch(e){ console.error('sSet error', key, e); return false; }
  }
  async function sDelete(key){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), null);
      return true;
    }catch(e){ console.error('sDelete error', key, e); return false; }
  }
  // 一次把整包 data 撈下來再自己篩前綴。資料量小（一個站全部），比逐 key 查快很多。
  async function sAll(){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data'));
      if(!snap.exists()) return {};
      return snap.val() || {};
    }catch(e){ console.error('sAll error', e); return null; }
  }
  function parseVal(raw){
    if(raw === undefined || raw === null) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }

  // ================= 離線快取 =================
  // 讀得到 Firebase 就順手存一份；讀不到就用快取撐著（唯讀）。
  const CACHE_KEY = 'trip-cache-v1';
  let offline = false;

  // 整包 data 裡的 people-list 帶著所有人的明碼密碼。主站只放在記憶體裡，
  // 寫進 localStorage 等於把它落地到硬碟、跨分頁跨關機都還在，共用電腦上會外流。
  // 登入只需要 id 與名字，所以存進快取前先把 password 拔掉。
  function stripSecrets(all){
    const out = {};
    Object.keys(all).forEach(k=>{ out[k] = all[k]; });
    try{
      const raw = out['people-list'];
      if(raw){
        const list = JSON.parse(raw);
        if(Array.isArray(list)){
          out['people-list'] = JSON.stringify(list.map(p=>{
            const c = Object.assign({}, p);
            delete c.password;
            return c;
          }));
        }
      }
    }catch(e){ delete out['people-list']; }   // 剖析不了就整個不要快取，寧可不能離線登入
    return out;
  }
  function writeCache(all){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), all:stripSecrets(all)})); }catch(e){}
  }
  function readCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  // ================= 狀態 =================
  let people = [];
  let allData = {};          // 整包 data 的原始（字串）副本
  let me = null;             // 目前登入者 id
  let view = 'pick';
  let msg = null;            // {type, text}

  let trips = [];            // [{...}]
  let curTripId = null;
  let places = [];           // 目前旅程的景點
  let items = [];            // 目前旅程的所有行程項目
  let pres  = [];            // 行前：一起的清單
  let memo  = null;          // 行前：我自己的備忘錄（只讀自己那一包）
  let curDate = null;
  let tab = 'timeline';      // timeline | places
  // 貼底面板：null＝沒開，{type:'add', at:分鐘} 或 {type:'item', id:項目 id}
  let sheet = null;
  let sheetJustOpened = false;
  let pickerQuery = '';

  // 只記「上次是誰」，不是憑證。快取已經沒有密碼，離線重開瀏覽器時
  // 靠這個才進得去唯讀模式；否則會變成沒網路就完全打不開。
  const SESSION_KEY = 'trip-me';
  function rememberMe(id){
    try{ id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  function recallMe(){
    try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; }
  }

  // ================= 小工具 =================
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function personName(id){
    const p = people.find(x=>x.id===id);
    return p ? p.name : '(已離開的成員)';
  }

  const WD = ['日','一','二','三','四','五','六'];
  function toKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fromKey(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  // 日期運算一律走這裡，讓 JS 自己處理月底與閏年，不要自己加減字串。
  function shiftDate(k, n){
    const d = fromKey(k);
    return toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n));
  }
  function dateRange(start, end){
    const out = [];
    let cur = start;
    let guard = 0;
    while(guard++ < 400){
      out.push(cur);
      if(cur === end) break;
      cur = shiftDate(cur, 1);
    }
    return out;
  }
  function dayLabel(k){
    const d = fromKey(k);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function dayWd(k){ return '週' + WD[fromKey(k).getDay()]; }

  // 分鐘 <-> "HH:MM"
  function toMin(hhmm){
    if(!hhmm) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm.trim());
    if(!m) return null;
    return Number(m[1])*60 + Number(m[2]);
  }
  // 給 <input type="time"> 用：一定是合法的 00:00–23:59。
  // toHHMM() 會產生「25:30 (+1)」這種跨日寫法，直接塞進 time 欄會被瀏覽器當成空值。
  function toClock(min){
    if(min == null) return '12:00';
    const m = ((Math.round(min) % 1440) + 1440) % 1440;
    return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  }
  function toHHMM(min){
    if(min == null) return '--:--';
    let m = Math.round(min);
    const sign = m < 0 ? '-' : '';
    m = Math.abs(m);
    const dayOver = Math.floor(m / 1440);
    const rest = m % 1440;
    const s = sign + String(Math.floor(rest/60)).padStart(2,'0') + ':' + String(rest%60).padStart(2,'0');
    return dayOver > 0 ? s + ' (+' + dayOver + ')' : s;
  }

  // ================= 地圖服務 =================
  const APPNAME = '14sail.github.io';

  function mapQuery(place){
    return (place.localName && place.localName.trim()) ? place.localName.trim() : place.name;
  }
  function webMapUrl(trip, place){
    if(place.mapUrl && place.mapUrl.trim()) return place.mapUrl.trim();
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'https://map.naver.com/p/search/' + q
      : 'https://www.google.com/maps/search/?api=1&query=' + q;
  }
  function appMapUrl(trip, place){
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'nmap://search?query=' + q + '&appname=' + APPNAME
      : 'comgooglemaps://?q=' + q;
  }
  // NAVER 的 App 路線要起訖座標才算得出來，景點不再存座標之後就不做 App 跳轉，
  // 一律開網頁版，NAVER 那邊改成複製終點名稱讓使用者自己貼。
  function webRouteUrl(trip, from, to){
    if(trip.mapProvider === 'naver'){
      return 'https://map.naver.com/p/directions/-/-/-/transit';
    }
    const d = encodeURIComponent(mapQuery(to));
    const s = from ? encodeURIComponent(mapQuery(from)) : '';
    return 'https://www.google.com/maps/dir/?api=1&destination=' + d + (s ? '&origin=' + s : '') + '&travelmode=transit';
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // 手機才試 App scheme；1.2 秒內沒跳走就退回網頁版，沒裝 App 也不會卡死。
  function openMap(scheme, web){
    if(!isMobile || !scheme){ window.open(web, '_blank', 'noopener'); return; }
    let done = false;
    const bail = ()=>{ done = true; };
    window.addEventListener('pagehide', bail, {once:true});
    document.addEventListener('visibilitychange', bail, {once:true});
    setTimeout(()=>{
      window.removeEventListener('pagehide', bail);
      if(!done && !document.hidden) window.location.href = web;
    }, 1200);
    window.location.href = scheme;
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      // clipboard API 在非 https 或舊瀏覽器會失敗，退回舊做法
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(e2){ return false; }
    }
  }

  // ================= 時間軸推算 =================
  // 舊版的推算方式：只存順序＋停留＋移動，抵達時間即時算出來。
  // 改成課表之後每個項目自己存 startTime，這個函式只剩下 ensureItemTimes()
  // 轉換舊資料時會用到——把當初畫面上顯示的時間原封不動寫回去。
  function legacyComputeDay(dayItems, defaultStart){
    const rows = [];
    let cur = null;
    let conflicted = false;

    dayItems.forEach((it, idx)=>{
      const pin = toMin(it.pinTime);
      let arrive, lateBy = 0, slack = null;

      if(pin != null){
        if(cur == null || cur <= pin){
          slack = cur == null ? null : pin - cur;
          arrive = pin;
        }else{
          // 前面拖太久，撞上釘選項目
          arrive = cur;
          lateBy = cur - pin;
          conflicted = true;
        }
      }else{
        arrive = (cur == null) ? (toMin(defaultStart) ?? 9*60) : cur;
      }

      const stay = Number(it.stayMin) || 0;
      const move = Number(it.moveMin) || 0;
      const depart = arrive + stay;
      cur = depart + move;

      rows.push({
        item: it, idx,
        arrive, depart, stay, move,
        pinned: pin != null,
        lateBy, slack,
        afterConflict: conflicted && lateBy === 0
      });
    });

    return rows;
  }

  // ================= 資料載入 =================
  // 一份名單、分站開放。旅程與記帳共用 canTrip；沒有這個欄位的是改版前就存在的
  // 成員，一律當作全開，不要讓誰突然消失。運動排程站的 canSport 同一套寫法。
  function inTrip(p){ return p && p.canTrip !== false; }
  // people 本身永遠是完整名單（依 id 查名字、既有旅程／帳本的成員都要用），
  // 選人與挑成員的畫面才走 tripPeople()。
  function tripPeople(){ return people.filter(inTrip); }

  // 挑成員的清單＝現在開放旅遊記帳的人，再補上已經被選進來的舊成員。
  function memberChoices(ids){
    const roster = tripPeople();
    const extra = (ids || [])
      .filter(id => !roster.some(p => p.id === id))
      .map(id => people.find(p => p.id === id))
      .filter(Boolean);
    return roster.concat(extra);
  }

  function hydrate(all){
    allData = all;
    people = parseVal(all['people-list']) || [];

    trips = [];
    Object.keys(all).forEach(k=>{
      if(k.startsWith('trip:')){
        const t = parseVal(all[k]);
        if(t && t.id) trips.push(t);
      }
    });
    trips.sort((a,b)=> String(b.startDate||'').localeCompare(String(a.startDate||'')));
  }

  function loadTripChildren(tripId){
    places = [];
    items = [];
    pres = [];
    const pPrefix = safeKey('trip-place:' + tripId + ':');
    const iPrefix = safeKey('trip-item:' + tripId + ':');
    const rPrefix = safeKey('trip-pre:' + tripId + ':');
    Object.keys(allData).forEach(k=>{
      if(k.startsWith(pPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) places.push(v);
      }else if(k.startsWith(iPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) items.push(v);
      }else if(k.startsWith(rPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) pres.push(v);
      }
    });
    sortPlaces();
    items.sort((a,b)=> (a.order||0) - (b.order||0));
    pres.sort((a,b)=> (a.order||0) - (b.order||0));
    // 備忘錄只讀自己那一包。別人的資料還在同一個 data 節點裡，
    // 這是畫面層的過濾，不是資料庫權限。
    memo = parseVal(allData[safeKey('trip-memo:' + tripId + ':' + me)]) || null;
  }

  async function refresh(){
    const all = await sAll();
    if(all === null){
      const cache = readCache();
      if(cache && cache.all){
        offline = true;
        hydrate(cache.all);
        msg = {type:'warn', text:'目前連不上資料庫，顯示的是離線快取（' + new Date(cache.at).toLocaleString('zh-TW') + '），這個狀態下的修改不會被儲存。'};
        return;
      }
      offline = true;
      msg = {type:'err', text:'連不上資料庫，而且本機沒有快取。請檢查網路後重新整理。'};
      hydrate({});
      return;
    }
    offline = false;
    hydrate(all);
    writeCache(all);
  }

  // 單筆寫入：每個項目自己一個 key，兩個人同時改不同項目不會互相蓋掉。
  async function putTrip(t){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip:' + t.id, t);
    if(ok) allData[safeKey('trip:' + t.id)] = JSON.stringify(t);
    return ok;
  }
  async function putPlace(tripId, p){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-place:' + tripId + ':' + p.id, p);
    if(ok) allData[safeKey('trip-place:' + tripId + ':' + p.id)] = JSON.stringify(p);
    return ok;
  }
  async function putPre(tripId, r){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-pre:' + tripId + ':' + r.id, r);
    if(ok) allData[safeKey('trip-pre:' + tripId + ':' + r.id)] = JSON.stringify(r);
    return ok;
  }
  async function delPre(tripId, id){
    if(offline) return false;
    const ok = await sDelete('trip-pre:' + tripId + ':' + id);
    if(ok) delete allData[safeKey('trip-pre:' + tripId + ':' + id)];
    return ok;
  }
  // 備忘錄一個人一包，整包覆寫
  async function putMemo(tripId, m){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-memo:' + tripId + ':' + me, m);
    if(ok) allData[safeKey('trip-memo:' + tripId + ':' + me)] = JSON.stringify(m);
    return ok;
  }

  async function delPlace(tripId, placeId){
    if(offline) return false;
    const ok = await sDelete('trip-place:' + tripId + ':' + placeId);
    if(ok) delete allData[safeKey('trip-place:' + tripId + ':' + placeId)];
    return ok;
  }
  async function putItem(tripId, date, it){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-item:' + tripId + ':' + date + ':' + it.id, it);
    if(ok) allData[safeKey('trip-item:' + tripId + ':' + date + ':' + it.id)] = JSON.stringify(it);
    return ok;
  }
  async function delItem(tripId, date, itemId){
    if(offline) return false;
    const ok = await sDelete('trip-item:' + tripId + ':' + date + ':' + itemId);
    if(ok) delete allData[safeKey('trip-item:' + tripId + ':' + date + ':' + itemId)];
    return ok;
  }

  // ================= 畫面 =================
  function flash(){
    if(!msg) return '';
    // role="alert" 讀螢幕才會把錯誤念出來，畫面上看不出差別
    const h = '<div class="msg ' + msg.type + '" role="alert">' + esc(msg.text) + '</div>';
    msg = null;
    return h;
  }

  // 離線時：除了標了 data-nav 的瀏覽類控制項，其餘一律停用，連拖拉也拿掉。
  function applyReadOnly(){
    if(!offline) return;
    app.querySelectorAll('button, input, select, textarea').forEach(el=>{
      if(el.hasAttribute('data-nav')) return;
      el.disabled = true;
    });
    app.querySelectorAll('.tl-item').forEach(el=>{ el.removeAttribute('draggable'); });
  }
  function offBar(){
    if(!offline) return '';
    return '<div class="offbar">' + ic('offline') +
      '<span>離線中，唯讀模式</span></div>';
  }

  function switchBar(active){
    return '<div class="switchbar">' +
      '<a class="' + (active==='trip'?'on':'') + '" href="trip.html">' + ic('map') + ' 行程</a>' +
      '<a class="' + (active==='split'?'on':'') + '" href="split.html">' + ic('wallet') + ' 記帳</a>' +
      '</div>';
  }

  let sheetWasOpen = false;
  function render(){
    // 面板只有第一次出現才滑入。按 ±15 分也會走 render()，
    // 每次都播動畫的話面板會一直重新滑，很煩。
    sheetJustOpened = !!sheet && !sheetWasOpen;
    sheetWasOpen = !!sheet;
    renderView();
    // 寬版是整個旅程內頁的事，不是某個分頁的事。只在時間軸套用的話，
    // 切到景點分頁時整頁寬度會跳動。
    app.classList.toggle('wide', view === 'trip');
    if(helpOpen) app.insertAdjacentHTML('beforeend', helpHtml());
    wireHelp();
    applyReadOnly();
    document.body.classList.toggle('sheet-open', !!sheet || helpOpen);
  }

  function renderView(){
    whoLine.textContent = me ? personName(me) : '';
    if(view === 'pick') return renderPick();
    if(view === 'password') return renderPassword();
    if(view === 'list') return renderList();
    if(view === 'tripForm') return renderTripForm();
    if(view === 'trip') return renderTrip();
    renderList();
  }

  // ---------- 選人／登入 ----------
  let pendingPersonId = null;

  function renderPick(){
    const roster = tripPeople();
    if(!roster.length){
      app.innerHTML = flash() + '<div class="card"><h1>還沒有成員資料</h1>' +
        '<p class="desc">請先到 <a href="index.html">主站</a> 建立成員，並開放「旅遊記帳」。</p></div>';
      return;
    }
    let h = flash() + '<div class="card"><h1>你是哪位快樂姊妹？</h1>' +
      '<p class="desc">選擇你的名字，密碼跟運動排程站是同一組。</p>' +
      '<div class="people-grid">';
    roster.forEach(p=>{
      h += '<button class="person-btn" data-pick="' + esc(p.id) + '" data-nav>' +
           esc(p.name) + '</button>';
    });
    h += '</div></div>';
    app.innerHTML = h;
    app.querySelectorAll('[data-pick]').forEach(b=>{
      b.onclick = ()=>{
        pendingPersonId = b.dataset.pick;
        const p = people.find(x=>x.id===pendingPersonId);
        if(!p.password){
          msg = offline
            ? {type:'err', text:'離線中無法驗證密碼（快取不保存密碼）。請連上網路後登入一次。'}
            : {type:'err', text:'「' + p.name + '」還沒在主站設定密碼，請先到主站設定後再回來。'};
          render();
          return;
        }
        view = 'password';
        render();
      };
    });
  }

  function renderPassword(){
    const p = people.find(x=>x.id===pendingPersonId);
    app.innerHTML = flash() +
      '<div class="card"><h1>' + esc(p.name) + '</h1>' +
      '<label class="fld"><span>密碼</span><input id="pw" type="password" autocomplete="current-password" data-nav></label>' +
      '<button class="btn wide" id="go" data-nav>登入</button>' +
      '<div class="foot"><button id="back" data-nav>回到選擇身份</button></div></div>';
    const pw = document.getElementById('pw');
    pw.focus();
    const submit = ()=>{
      if(pw.value === p.password){
        me = p.id;
        rememberMe(me);
        view = 'list';
        render();
      }else{
        msg = {type:'err', text:'密碼不對。'};
        render();
      }
    };
    document.getElementById('go').onclick = submit;
    pw.onkeydown = (e)=>{ if(e.key === 'Enter') submit(); };
    document.getElementById('back').onclick = ()=>{ view='pick'; render(); };
  }

  // ---------- 旅程列表 ----------
  function myTrips(){
    return trips.filter(t => (t.memberIds||[]).indexOf(me) >= 0);
  }

  function renderList(){
    const mine = myTrips();
    const live = mine.filter(t=>!t.archived);
    const done = mine.filter(t=>t.archived);

    let h = flash() + offBar() + switchBar('trip');
    h += '<h1 class="list-title">我的旅程</h1>';

    if(!live.length && !done.length){
      h += '<div class="empty">還沒有旅程</div>';
    }
    const cardHtml = (t)=>{
      const days = (t.startDate && t.endDate) ? dateRange(t.startDate, t.endDate).length : 0;
      const prov = t.mapProvider === 'naver' ? 'NAVER' : 'Google';
      return '<button class="trip-card' + (t.archived?' done':'') + '" data-trip="' + esc(t.id) + '" data-nav>' +
        '<div class="tc-main"><div class="tc-name">' + esc(t.name) +
          (t.archived ? '<span class="tag">已結束</span>' : '') + '</div>' +
        '<div class="tc-meta">' + esc(t.startDate||'?') + ' → ' + esc(t.endDate||'?') +
          (days? '　' + days + ' 天' : '') + '　' + prov + '　' +
          (t.memberIds||[]).length + ' 人</div></div>' +
        '<div class="tc-go">' + ic('chevR') + '</div></button>';
    };
    live.forEach(t=>{ h += cardHtml(t); });
    if(done.length){
      h += '<h2 style="margin:22px 0 8px;font-size:14px;color:var(--ink-soft)">已結束</h2>';
      done.forEach(t=>{ h += cardHtml(t); });
    }
    h += '<button class="btn wide" id="newTrip" style="margin-top:18px">' + ic('plus') + '建立新旅程</button>';
    h += '<div class="foot"><button id="logout" data-nav>回到選擇身份</button></div>';
    app.innerHTML = h;

    document.getElementById('newTrip').onclick = ()=>{ editingTrip = null; view='tripForm'; render(); };
    app.querySelectorAll('[data-trip]').forEach(b=>{
      b.onclick = async ()=>{
        curTripId = b.dataset.trip;
        loadTripChildren(curTripId);
        const t = trips.find(x=>x.id===curTripId);
        curDate = t.startDate;
        tab = 'timeline';
        view = 'trip';
        render();
        // 舊景點補編號、舊行程補開始時間；補完再畫一次，不擋住第一次進畫面的速度。
        await ensurePlaceCodes(curTripId);
        await ensureItemTimes(curTripId, t);
        render();
      };
    });
    document.getElementById('logout').onclick = ()=>{
      me = null;
      rememberMe(null);
      view='pick'; render();
    };
  }

  // ---------- 建立／編輯旅程 ----------
  let editingTrip = null;

  function renderTripForm(){
    const t = editingTrip || {
      id:'', name:'', startDate:'', endDate:'',

      '<div class="row2">' +
        '<label class="fld"><span>出發日</span><input id="fStart" type="date" value="' + esc(t.startDate) + '"></label>' +
        '<label class="fld"><span>結束日</span><input id="fEnd" type="date" value="' + esc(t.endDate) + '"></label>' +

      '<label class="fld"><span>每天起點時間</span>' +
        '<input id="fDayStart" type="time" value="' + esc(t.dayStart||'09:00') + '"></label>' +
      '<label class="fld"><span>目的地類型</span><select id="fProv">' +
        '<option value="google-tw"' + (t.mapProvider==='google'&&!t.needsLocalName?' selected':'') + '>台灣／國內（Google Maps）</option>' +
        '<option value="naver"' + (t.mapProvider==='naver'?' selected':'') + '>韓國（NAVER Map）</option>' +
        '<option value="google-local"' + (t.mapProvider==='google'&&t.needsLocalName?' selected':'') + '>日本／其他（Google Maps）</option>' +
      '</select></label>';

    h += '<label class="fld" style="margin-top:14px"><span>同行成員</span></label>';
    // 已經在這趟旅程裡、但後來被關掉「旅遊記帳」的人也要列出來（勾著），
    // 否則一存檔就被靜靜地踢出旅程。
    memberChoices(t.memberIds).forEach(p=>{
      const on = (t.memberIds||[]).indexOf(p.id) >= 0;
      const isMe = p.id === me;
      h += '<label class="chk-row">' +
        '<input type="checkbox" data-mem="' + esc(p.id) + '"' +
        (on?' checked':'') + (isMe?' disabled':'') + '>' +
        esc(p.name) + (isMe?'<span class="tag soft">你自己</span>':'') + '</label>';
    });

    if(!isNew){
      h += '<label class="chk-row" style="margin-top:8px">' +
        '<input type="checkbox" id="fArch"' + (t.archived?' checked':'') + '> 標記為已結束</label>';
    }

    h += '<div style="display:flex;gap:8px;margin-top:16px">' +
      '<button class="btn" id="save" style="flex:1">' + (isNew?'建立':'儲存') + '</button>' +

    app.innerHTML = h;

    document.getElementById('cancel').onclick = ()=>{

      };
      const ok = await putTrip(rec);
      if(!ok){ render(); return; }
      const i = trips.findIndex(x=>x.id===rec.id);
      if(i>=0) trips[i] = rec; else trips.unshift(rec);

      if(editingTrip){

      }else{
