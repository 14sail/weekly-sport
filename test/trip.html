  }

  // ---------- 旅程內頁 ----------
  function curTrip(){ return trips.find(t=>t.id===curTripId); }

  // 課表時代：順序由開始時間決定，order 只在同時間時當個穩定的排序依據。
  function itemStart(it){
    const m = toMin(it && it.startTime);
    return m == null ? 9 * 60 : m;
  }
  function dayItems(date){
    return items.filter(i=>i.date===date)
                .sort((a,b)=> (itemStart(a) - itemStart(b)) || ((a.order||0) - (b.order||0)));
  }
  function placeById(id){ return places.find(p=>p.id===id); }

  // ---------- 景點編號 ----------
  // A、B…Z、AA、AB…。編號在建立景點時就寫進資料裡，之後不會因為改名、
  // 排序或新增別的景點而跳號——寫在紙上的「先去 B 再去 D」才不會隔天變成別的地方。
  function codeOfIndex(n){
    let s = '';
    while(n >= 0){
      s = String.fromCharCode(65 + (n % 26)) + s;
      n = Math.floor(n / 26) - 1;
    }
    return s;
  }
  function nextPlaceCode(list){
    const used = {};
    list.forEach(p=>{ if(p.code) used[p.code] = true; });
    for(let i = 0; i < 5000; i++){
      const c = codeOfIndex(i);
      if(!used[c]) return c;
    }
    return '';
  }
  function placeCode(p){ return p && p.code ? p.code : '—'; }
  function codeTag(p){ return '<span class="pcode">' + esc(placeCode(p)) + '</span>'; }

  // 搜尋框打 A 就叫得出 A 那個景點；打名字或當地語名也一樣找得到。
  function placeMatches(p, q){
    if(!q) return true;
    return (p.code||'').toLowerCase().startsWith(q)
        || (p.name||'').toLowerCase().includes(q)
        || (p.localName||'').toLowerCase().includes(q);
  }
  function pickerRowHtml(p){
    return '<button data-add="' + esc(p.id) + '">' + codeTag(p) + esc(p.name) +
           '<span class="pl-sub">' + esc(catOf(p)) +
           (p.localName?'　'+esc(p.localName):'') + '　' + (p.stayMin||60) + ' 分</span></button>';
  }

  // 短的編號排前面（Z 在 AA 前面），沒編號的沿用名字排序墊底。
  function sortPlaces(){
    places.sort((a,b)=>{
      const ca = a.code || '', cb = b.code || '';
      if(ca && cb){
        if(ca.length !== cb.length) return ca.length - cb.length;
        return ca < cb ? -1 : (ca > cb ? 1 : 0);
      }
      if(ca) return -1;
      if(cb) return 1;
      return String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant');
    });
  }

  // 這個功能上線前建立的景點沒有編號，第一次打開旅程時補上。
  // 照原本看到的名字順序補，編出來的 A、B、C 才跟她們印象中的清單一致。
  async function ensurePlaceCodes(tripId){
    if(offline) return;
    const missing = places.filter(p=>!p.code);
    if(!missing.length) return;
    missing.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant'));
    for(let i = 0; i < missing.length; i++){
      missing[i].code = nextPlaceCode(places);
      await putPlace(tripId, missing[i]);
    }
    sortPlaces();
  }

  // 課表化之前的行程只有順序＋停留＋移動，沒有自己的開始時間。
  // 用舊的推算方式算一次，把當時畫面上顯示的時間直接寫成 startTime，
  // 姊妹們原本排好的行程才不會因為改版整個跑掉。
  async function ensureItemTimes(tripId, trip){
    if(offline) return;
    const missing = items.filter(it=>!it.startTime);
    if(!missing.length) return;
    const dates = [];
    missing.forEach(it=>{ if(dates.indexOf(it.date) < 0) dates.push(it.date); });
    for(let d = 0; d < dates.length; d++){
      const list = items.filter(i=>i.date===dates[d]).sort((a,b)=>(a.order||0)-(b.order||0));
      const rows = legacyComputeDay(list, trip.dayStart);
      for(let r = 0; r < rows.length; r++){
        if(rows[r].item.startTime) continue;
        // 舊的推算允許跨午夜（會算出 25:00 這種），但 toClock() 會把它繞回 01:00，
        // 那筆就會跳到當天最前面。轉換時一律壓在 23:45，寧可擠在晚上也不要亂序。
        rows[r].item.startTime = toClock(Math.min(rows[r].arrive, 23 * 60 + 45));
        await putItem(tripId, rows[r].item.date, rows[r].item);
      }
    }
  }

  function renderTrip(){
    const t = curTrip();
    if(!t){ view='list'; render(); return; }
    const dates = dateRange(t.startDate, t.endDate);
    if(dates.indexOf(curDate) < 0) curDate = dates[0];

    let h = flash() + offBar() + switchBar('trip');
    h += '<div class="card" style="padding:14px 16px">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="flex:1;min-width:0"><h1 style="margin:0">' + esc(t.name) + '</h1>' +
      '<div class="tc-meta" style="font-size:12.5px;color:var(--ink-soft);margin-top:3px">' +
        esc(t.startDate) + ' → ' + esc(t.endDate) + '　' + dates.length + ' 天　' +
        (t.mapProvider==='naver'?'NAVER':'Google') + '</div></div>' +
      '<button class="mini icon-only" id="editTrip" title="旅程設定" aria-label="旅程設定">' + ic('gear') + '</button></div></div>';

    // 時間軸的分頁列要跟日期列一起釘在上面，所以由 timelineHtml() 自己畫。
    if(tab === 'timeline'){
      h += timelineHtml(t, dates);
    }else if(tab === 'pre'){
      h += tabsHtml();
      h += preHtml(t);
    }else{
      h += tabsHtml();
      h += placesHtml(t);
    }

    h += '<div class="foot"><button id="back" data-nav>' + ic('back') + ' 回旅程列表</button></div>';
    app.innerHTML = h;

    document.getElementById('editTrip').onclick = ()=>{ editingTrip = t; view='tripForm'; render(); };
    document.getElementById('back').onclick = ()=>{ view='list'; render(); };
    app.querySelectorAll('[data-tab]').forEach(b=>{
      b.onclick = ()=>{ tab = b.dataset.tab; sheet = null; render(); };
    });

    if(tab === 'timeline') wireTimeline(t, dates);
    else if(tab === 'pre') wirePre(t);
    else wirePlaces(t);
  }

  // ---------- 課表 ----------
  // 每個項目自己記住 startTime（'HH:MM'），拖到哪就是幾點。
  // 舊資料只有順序＋停留＋移動，第一次打開時用 legacyComputeDay() 推算一次寫回去。
  const SNAP_MIN = 15;      // 拖拉吸附到 15 分
  const GRID_MIN = 30;      // 格線每 30 分一條
  // 1 分鐘 1.5px，所以最常見的 30 分鐘停留是 45px，本身就超過 44px 的觸控下限，
  // 不需要靠「最小高度」去撐。之前用 1px/分再硬撐最小高度，等於讓觸控尺寸
  // 污染了重疊判定：三段連續的 30 分行程明明沒撞在一起，卻會被判成同一組而全部畫成半寬。
  const PX_PER_MIN = 1.5;
  // 最矮 44px＝手指點得到的尺寸。這只影響畫出來的高度，不參與重疊判定，
  // 所以短行程撐高不會再害後面的行程被誤判成撞期。
  const MIN_DRAW_PX = 44;
  // 方塊至少這麼高才放第二行（備註，或「停留 X 分　分類」）。
  // 標題列約 18px＋上下 padding 12px＝30px，第二行約 17px，62 留一點呼吸空間。
  const SUB_MIN_PX = 62;
  const CATS = ['飯店', '餐廳', '景點', '購物', '交通', '其他'];
  // 六個分類對到五組底色：能用的淺底只有四組加白底，所以交通與其他共用中性的白。
  // 兩個都是「不是目的地」的類型，共用剛好。
  const CAT_CLASS = {
    '飯店':'c-stay', '餐廳':'c-eat', '景點':'c-see',
    '購物':'c-shop', '交通':'c-move', '其他':'c-move'
  };
  // 「場館」這個分類拿掉了。舊資料裡還留著的一律當成「其他」顯示，
  // 不去動資料庫——那個景點下次被編輯存檔時自然就更新了。
  function catOf(p){
    const c = (p && p.category) || '景點';
    return CATS.indexOf(c) >= 0 ? c : '其他';
  }
  // 上下邊帶（拉時間）的尺寸看指標種類。
  // 只要這台機器「有」粗指標（觸控螢幕）就一律用手指的尺寸——寧可大不要小。
  // 用 any-pointer 不用 pointer：觸控筆電的主要指標是滑鼠，但手還是會去摸螢幕。
  const COARSE = !!(window.matchMedia && window.matchMedia('(any-pointer:coarse)').matches);
  // 方塊至少這麼高才畫邊帶。
  // 手指：邊帶各佔高度的 1/4，中間留給「整塊移動」的一定是 h/2，88px 剛好讓它
  //       等於 44px 的觸控下限。想調低之前先算一次，低於 88 中間就不到 44px 了。
  // 滑鼠：MIN_DRAW_PX 是 44，所以 40 等於「每個方塊都有邊帶」。
  const GRIP_MIN_PX = COARSE ? 88 : 40;
  function gripPx(h){
    if(h < GRIP_MIN_PX) return 0;
    // 滑鼠固定 10px 就夠抓，不用吃掉移動區
    return Math.min(COARSE ? 44 : 10, Math.round(h / 4));
  }

  // 課表預設就畫 08:00-21:00 這一段，不管那天有沒有排東西，
  // 每天長度一致比較好對照。超出這個範圍的行程當然照畫，也可以手動往前後延伸。
  const WIN_LO = 8 * 60;
  const WIN_HI = 21 * 60;

  // 壓縮：一段連續的區間（不管是行程還是空檔），前 60 分照原比例畫，
  // 超過的部分只用 1/5 的比例。三小時的午餐和一整個下午的空檔都會縮短，
  // 代價是時間軸不再等比，所以做成可以關掉的開關。
  const SQ_FULL = 60;
  const SQ_RATE = 0.2;
  const SQ_KEY = 'trip-squeeze';

  let squeeze = true;
  try{ squeeze = localStorage.getItem(SQ_KEY) !== '0'; }catch(e){}
  function setSqueeze(on){
    squeeze = !!on;
    try{ localStorage.setItem(SQ_KEY, squeeze ? '1' : '0'); }catch(e){}
  }

  let ttLo = WIN_LO, ttHi = WIN_HI;   // 目前畫出來的時間範圍
  let ttExtLo = 0, ttExtHi = 0;       // 使用者按「往前／往後」多要的小時數
  let ttMap = { segs: [], total: 0 }; // 分鐘↔像素的對應表（壓縮後不是等比）

  function stayOf(it){ return Math.max(0, Number(it && it.stayMin) || 0); }
  function blockLen(it){ return Math.max(stayOf(it), SNAP_MIN); } // 接在後面時用

  function dayRange(t, rows){
    let lo = WIN_LO - ttExtLo * 60;
    let hi = WIN_HI + ttExtHi * 60;
    // 排在視窗外的行程一定要畫出來，否則會整筆看不見
    rows.forEach(r=>{
      if(r.start < lo) lo = r.start;
      if(r.drawEnd > hi) hi = r.drawEnd;
    });
    lo = Math.max(0, Math.floor(lo / 60) * 60);
    hi = Math.min(24 * 60, Math.ceil(hi / 60) * 60);
    if(hi - lo < 3 * 60) hi = Math.min(24 * 60, lo + 3 * 60);
    return { lo, hi };
  }

  // 時間重疊的並排顯示。一群互相重疊的算一組，組內每個找第一個放得下的欄位。
  function layoutDay(list){
    const rows = list.map(it=>{
      const start = itemStart(it);
      const end = start + stayOf(it);
      return {
        item: it, start, end, stay: stayOf(it),
        // 判重疊用真實時間。停留 0 分的也給一點寬度，否則永遠不算佔位。
        edge: Math.max(end, start + SNAP_MIN),
        // 畫出來的底部：太短的行程撐到看得見名字為止，但這只影響高度，不影響判重疊。
        drawEnd: Math.max(end, start + MIN_DRAW_PX / PX_PER_MIN),
        col: 0, cols: 1
      };
    });
    let i = 0;
    while(i < rows.length){
      let j = i, groupEnd = rows[i].edge;
      while(j + 1 < rows.length && rows[j + 1].start < groupEnd){
        j++;
        if(rows[j].edge > groupEnd) groupEnd = rows[j].edge;
      }
      const group = rows.slice(i, j + 1);
      const colEnds = [];
      group.forEach(r=>{
        let c = 0;
        while(c < colEnds.length && colEnds[c] > r.start) c++;
        r.col = c;
        colEnds[c] = r.edge;
      });
      group.forEach(r=>{ r.cols = colEnds.length; });
      i = j + 1;
    }
    return rows;
  }

  // ---------- 分鐘 ↔ 像素 ----------
  // 把一天沿著「行程開始／結束」切成一段一段，每段各自算高度。
  // 壓縮開著時，每段前 SQ_FULL 分鐘照原比例，超過的部分用 SQ_RATE。
  function buildMap(rows, lo, hi){
    const marks = [lo, hi];
    rows.forEach(r=>{
      if(r.start > lo && r.start < hi) marks.push(r.start);
      if(r.drawEnd > lo && r.drawEnd < hi) marks.push(r.drawEnd);
    });
    marks.sort((a,b)=> a - b);

    const segs = [];
    let y = 0;
    for(let i = 0; i < marks.length - 1; i++){
      const m0 = marks[i], m1 = marks[i+1];
      if(m1 <= m0) continue;
      const len = m1 - m0;
      const full = squeeze ? Math.min(len, SQ_FULL) : len;
      const rest = len - full;
      const px = full * PX_PER_MIN + rest * PX_PER_MIN * SQ_RATE;
      segs.push({ m0, m1, len, full, rest, y0: y, y1: y + px });
      y += px;
    }
    return { segs, total: y };
  }

  function ttY(m){
    const segs = ttMap.segs;
    if(!segs.length) return 0;
    if(m <= segs[0].m0) return 0;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(m <= s.m1){
        const d = m - s.m0;
        return d <= s.full
          ? s.y0 + d * PX_PER_MIN
          : s.y0 + s.full * PX_PER_MIN + (d - s.full) * PX_PER_MIN * SQ_RATE;
      }
    }
    return ttMap.total;
  }

  // 這條格線是不是落在被壓縮的區段裡？是的話畫成虛線。
  function inSqueezed(m){
    const segs = ttMap.segs;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(m > s.m0 && m <= s.m1) return s.rest > 0 && (m - s.m0) > s.full;
    }
    return false;
  }

  function ttMinAt(y){
    const segs = ttMap.segs;
    if(!segs.length) return ttLo;
    if(y <= 0) return segs[0].m0;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(y <= s.y1){
        const d = y - s.y0;
        const fullPx = s.full * PX_PER_MIN;
        return d <= fullPx
          ? s.m0 + d / PX_PER_MIN
          : s.m0 + s.full + (d - fullPx) / (PX_PER_MIN * SQ_RATE);
      }
    }
    return segs[segs.length - 1].m1;
  }

  function timelineHtml(t, dates){
    let h = '<div class="tt-stick"><div class="tabs">' +
      '<button data-tab="timeline" data-nav class="' + (tab==='timeline'?'on':'') + '">時間軸</button>' +
      '<button data-tab="places" data-nav class="' + (tab==='places'?'on':'') + '">景點 ' + places.length + '</button>' +
        '<button data-tab="pre" data-nav class="' + (tab==='pre'?'on':'') + '">行前</button>' +
      '</div><div class="daybar">';
    dates.forEach((d,i)=>{
      const n = dayItems(d).length;
      const half = (i===0 || i===dates.length-1);
      h += '<button data-day="' + d + '" data-nav class="' + (d===curDate?'on':'') + (half?' half':'') + '">' +
           dayLabel(d) + '<span class="d2">' + dayWd(d) + (n?'・'+n:'') + '</span></button>';
    });
    h += '</div></div>';

    const rows = layoutDay(dayItems(curDate));
    const range = dayRange(t, rows);
    ttLo = range.lo;
    ttHi = range.hi;
    ttMap = buildMap(rows, ttLo, ttHi);

    // 提示只在空的日子出現，其他時候不佔位置
    if(!rows.length){
      h += '<p class="hint">點空白處就可以加景點</p>';
    }

    h += '<div class="tl-cols"><div>';

    h += '<div class="tt-bar">' +
      '<button class="mini" id="extUp"' + (ttLo <= 0 ? ' disabled' : '') + '>' + ic('up') + '往前 1 小時</button>' +
      '<span class="spacer"></span>' +
      '<button class="mini' + (squeeze ? ' on' : '') + '" id="sqToggle" aria-pressed="' + (squeeze?'true':'false') + '">' +
        (squeeze ? '已壓縮空白' : '完整比例') + '</button></div>';

    h += timetableHtml(rows);

    h += '<div class="tt-bar">' +
      '<button class="mini" id="extDown"' + (ttHi >= 24*60 ? ' disabled' : '') + '>' + ic('down') + '往後 1 小時</button></div>';

    h += '<button class="btn wide ghost" id="openPicker">' + ic('plus') + '加入景點</button>';
    h += '</div>' + sideHtml() + '</div>';
    h += sheetHtml(t, rows);
    return h;
  }

  // 桌機右欄：把景點清單放在旁邊當參考，排行程時不用切分頁。
  // 手機上 .side 是 display:none，完全不佔位置。
  function sideHtml(){
    let h = '<div class="side"><h3>景點 ' + places.length + '</h3>';
    if(!places.length){
      h += '<div class="empty">還沒有景點</div></div>';
      return h;
    }
    const used = new Set(items.map(i=>i.placeId));
    h += '<div class="side-list">';
    places.forEach(p=>{
      h += '<button data-goedit="' + esc(p.id) + '">' + codeTag(p) + esc(p.name) +
           '<span class="sl-sub">' + esc(catOf(p)) + '　' + (p.stayMin||60) + ' 分' +
           (used.has(p.id) ? '' : '　還沒排') + '</span></button>';
    });
    h += '</div></div>';
    return h;
  }

  // 左側的整點刻度。壓縮區裡整點會擠在一起疊字，太近的就不畫，看得懂比畫得齊重要。
  function ttTicksHtml(){
    let h = '';
    let lastTick = -99;
    for(let m = ttLo; m <= ttHi; m += 60){
      const y = ttY(m);
      if(m !== ttLo && m !== ttHi && y - lastTick < 20) continue;
      h += '<div class="tt-tick" style="top:' + Math.round(y) + 'px">' + toClock(m) + '</div>';
      lastTick = y;
    }
    return h;
  }

  // 車道的裝飾層：壓縮斜線與格線。沒有人會按在這上面，所以重建它是安全的。
  function ttDecorHtml(){
    let h = '';
    // 被壓縮的區段畫上斜線，讓人知道這一段的比例被縮過，不是真的那麼短
    ttMap.segs.forEach(s=>{
      if(!s.rest) return;
      const y0 = ttY(s.m0 + s.full), y1 = s.y1;
      if(y1 - y0 < 2) return;
      h += '<div class="tt-sq" style="top:' + Math.round(y0) + 'px;height:' +
           Math.round(y1 - y0) + 'px"></div>';
    });

    let lastLine = -99;
    for(let m = ttLo + GRID_MIN; m < ttHi; m += GRID_MIN){
      const y = ttY(m);
      if(y - lastLine < 8) continue;   // 壓縮區的格線也會糊成一片
      const sq = inSqueezed(m);
      // 壓縮區代表「這段沒事」，不需要半小時的精度，只留整點就好
      if(sq && m % 60 !== 0) continue;
      h += '<div class="tt-line' + ((m % 60 === 0) ? ' hr' : '') +
           (sq ? ' sq' : '') + '" style="top:' + Math.round(y) + 'px"></div>';
      lastLine = y;
    }
    return h;
  }

  // 依現在的 ttMap 重排車道，但**絕對不換掉方塊節點**。
  // 手指按著的節點一旦離開文件，瀏覽器就會送出 touchcancel，拖曳當場中斷，
  // 放開手只剩下「點一下＝開面板」的結果。所以這裡只重建刻度與格線（純裝飾），
  // 方塊一律只改 style。拖曳中要換比例就走這裡，不要呼叫 render()。
  function relayoutLane(){
    const lane = document.getElementById('ttLane');
    const tt = lane && lane.closest('.tt');
    const gutter = tt && tt.querySelector('.tt-gutter');
    if(!lane || !tt || !gutter) return false;

    const rows = layoutDay(dayItems(curDate));
    ttMap = buildMap(rows, ttLo, ttHi);
    tt.style.height = Math.round(ttMap.total) + 'px';

    gutter.innerHTML = ttTicksHtml();
    lane.querySelectorAll('.tt-sq, .tt-line').forEach(el=>el.remove());
    lane.insertAdjacentHTML('afterbegin', ttDecorHtml());

    rows.forEach(r=>{
      const el = lane.querySelector('[data-block="' + r.item.id + '"]');
      if(!el) return;
      const top = ttY(r.start);
      const hgt = Math.max(MIN_DRAW_PX, ttY(r.drawEnd) - top);
      el.style.top = Math.round(top) + 'px';
      el.style.height = Math.round(hgt) + 'px';
      const subEl = el.querySelector('.tt-b-sub');
      if(subEl) subEl.style.display = hgt >= SUB_MIN_PX ? '' : 'none';
      // 方塊變高了邊帶跟著長大。拖到一半不新增也不移除邊帶，只調現有的尺寸。
      const g = offline ? 0 : gripPx(hgt);
      if(g) el.querySelectorAll('.tt-grip').forEach(x=>{ x.style.height = g + 'px'; });
    });
    return true;
  }

  function timetableHtml(rows){
    let h = '<div class="tt" style="height:' + Math.round(ttMap.total) + 'px">';
    h += '<div class="tt-gutter">' + ttTicksHtml() + '</div>';
    h += '<div class="tt-lane" id="ttLane">' + ttDecorHtml();

    rows.forEach(r=>{
      const p = placeById(r.item.placeId);
      const top = ttY(r.start);
      const hgt = Math.max(MIN_DRAW_PX, ttY(r.drawEnd) - top);
      const w = 100 / r.cols;
      const cat = catOf(p);
      // 第二行：備註是自己寫的、資訊量最高，有就放備註；沒有才退回停留與分類。
      const sub = (p && p.transitNote)
        ? ic('note') + ' ' + esc(p.transitNote)
        : ('停留 ' + r.stay + ' 分' + (p ? '\u3000' + esc(cat) : ''));
      // 離線是唯讀，邊帶畫出來也拉不動，乾脆不要畫
      const grip = offline ? 0 : gripPx(hgt);
      const nm = p ? p.name : '(景點已刪除)';
      // 方塊是可以操作的東西，不能只是一個 div：沒有 tabindex 就完全按不到，
      // 而開始／結束／停留／移除全部都在點下去才出現的面板裡，等於用鍵盤的人
      // 看不到也改不了任何已排的行程。離線是唯讀、點了也沒反應，就不要讓它可聚焦。
      const aria = nm + ' ' + toClock(r.start) + ' 到 ' + toClock(r.end) +
                   '，停留 ' + r.stay + ' 分，' + cat;
      h += '<div data-block="' + esc(r.item.id) + '"' +
             (p ? ' data-place="' + esc(p.id) + '"' : '') +
             ' class="tt-block ' + (CAT_CLASS[cat] || 'c-see') + '"' +
             (offline ? '' : ' tabindex="0" role="button"') +
             ' aria-label="' + esc(aria) + '"' +
             ' style="top:' + Math.round(top) + 'px;height:' + Math.round(hgt) +
             'px;left:' + (r.col * w) + '%;width:' + w + '%">' +
           '<div class="tt-b-in">' +
             '<div class="tt-b-hd">' +
               (p ? codeTag(p) : '') +
               // 名稱一定會被截斷，滑鼠停著要看得到全文；讀螢幕的走上面的 aria-label
               '<span class="tt-b-name" title="' + esc(nm) + '">' + esc(nm) + '</span>' +
               '<span class="tt-b-time">' + toClock(r.start) + '–' + toClock(r.end) + '</span>' +
             '</div>' +
             (hgt >= SUB_MIN_PX ? '<div class="tt-b-sub">' + sub + '</div>' : '') +
           '</div>' +
           (grip
             // 讀螢幕的人走面板裡的「開始 ±15」「停留 ±15／常用」，那邊有完整標籤，
             // 這兩條純粹是滑鼠與手指的把手，不要再念一次
             ? '<div class="tt-grip top" data-grip="top" aria-hidden="true" title="拉動改開始時間" style="height:' + grip + 'px"></div>' +
               '<div class="tt-grip bot" data-grip="bot" aria-hidden="true" title="拉動改停留" style="height:' + grip + 'px"></div>'
             : '') +
           '</div>';
    });

    h += '</div></div>';
    return h;
  }

  // ---------- 說明書 ----------
  // 右上角問號打開。寫法刻意用「名詞＋一句話」，讓人用掃的就找得到，
  // 不要寫成一段一段的說明文。
  let helpOpen = false;

  function helpHtml(){
    if(!helpOpen) return '';
    const term = (t, d)=> '<dt>' + t + '</dt><dd>' + d + '</dd>';
    const step = (k, d)=> '<div class="step"><b>' + k + '</b><span>' + d + '</span></div>';

    let h = '<div class="help" id="helpBox" role="dialog" aria-modal="true" aria-label="說明書" tabindex="-1">' +
      '<div class="help-in">' +
      '<div class="help-top"><h1>說明書</h1>' +
      '<button class="mini icon-only" id="helpClose" data-nav title="關閉" aria-label="關閉">' +
      ic('close') + '</button></div>';

    h += '<h2>課表怎麼用</h2>' +
      step('點空白處', '在那個時間加一個景點') +
      step('點格子', '改開始時間、停留多久、看地圖、刪掉') +
      step('長按格子', '拖到別的時間，會自動對齊 15 分');

    h += '<h2>行前</h2>' +
      step('一起的', '一個項目一列，每個人一個勾格。點名字可以改文字或刪掉') +
      step('那個數字', '點 2/4 就是幫所有人一次打勾，再點一次全部取消') +
      step('只是提醒', '不需要打勾的事情，會收在下面的「提醒」區') +
      step('我自己的', '只有你看得到。自己開主題，底下想列幾點就列幾點');

    h += '<h2>名詞</h2><dl>' +
      term('景點', '你存下來的地點。存了不一定要排進行程。') +
      term('編號 A、B、C', '每個景點的固定代號，建立時就決定，之後不會變。搜尋時打編號最快。') +
      term('還沒排', '這個景點還沒被放進任何一天。放進去之後標籤就會消失。') +
      term('課表', '一天的時間表。色塊的高度就是停留時間，時間重疊的會並排。') +
      term('停留', '在這個景點待多久。新加的預設 60 分。') +
      term('壓縮空白', '把很長的空檔和很長的行程縮短顯示，一整天才塞得進一個畫面。' +
           '被縮過的地方會畫斜線提醒你那裡不等比。按右上角的按鈕可以關掉。') +
      term('備註', '寫在景點裡的自由欄位，交通、要不要訂位都可以寫。會顯示在課表的面板裡。') +
      '</dl>';

    h += '<h2>其他</h2><ul>' +
      '<li><b>往前／往後 1 小時</b>：課表預設畫 08:00 到 21:00，不夠用就按這兩顆延伸。</li>' +
      '<li><b>地圖／路線</b>：韓國的旅程會先複製景點名稱，再開 NAVER 讓你貼上。</li>' +
      '<li><b>當地語名稱</b>：韓國、日本的店填了之後，「複製名稱」複製的是當地語，搜尋才找得到。</li>' +
      '<li><b>已結束</b>：旅程結束後在設定裡勾起來，會收到列表下面，資料不會刪掉。</li>' +
      '</ul>';

    h += '<h2>要知道的事</h2><ul>' +
      '<li>旅程<b>只有被勾選的成員看得到</b>，建立的時候記得把大家勾上。</li>' +
      '<li>沒網路時是<b>唯讀</b>，看得到之前載過的內容，但不能新增或修改。</li>' +
      '<li>同一筆資料大家都能改，要動別人排好的東西前先說一聲。</li>' +
      '<li>密碼只是防止手滑改到別人的資料，<b>不要用你其他重要網站的密碼</b>。</li>' +
      '</ul>';

    h += '<div class="foot"><button id="helpClose2" data-nav>關閉說明書</button></div>';
    h += '</div></div>';
    return h;
  }

  // 這顆鈕在 #app 外面，不會被重繪洗掉，所以只接一次。
  if(helpBtn){
    helpBtn.innerHTML = ic('help');
    helpBtn.onclick = ()=>{ helpOpen = true; render(); };
  }

  function wireHelp(){
    const close = ()=>{ helpOpen = false; render(); };
    const a = document.getElementById('helpClose');
    if(a) a.onclick = close;
    const b = document.getElementById('helpClose2');
    if(b) b.onclick = close;
    const box = document.getElementById('helpBox');
    if(box) box.focus();
  }

  // ---------- 貼底面板 ----------
  // 加景點、改景點都在這裡完成，不用捲到畫面下面去。
  function sheetHtml(t, rows){
    if(!sheet) return '';
    let inner = '';

    if(sheet.type === 'add'){
      inner += '<h3>加到 ' + toClock(sheet.at) + '</h3>' +
        '<label class="fld"><span>搜尋景點，或直接輸入新名稱</span>' +
        '<input id="pq" placeholder="編號或名稱，例如 A" value="' + esc(pickerQuery) + '" autocomplete="off"></label>';
      const q = pickerQuery.trim().toLowerCase();
      const hit = places.filter(p=> placeMatches(p, q));
      inner += '<div class="picker-list">' +
        (hit.length ? hit.map(pickerRowHtml).join('') : '<div class="none">沒有符合的景點</div>') +
        '</div>';
      // 這顆鈕一定要先存在，之後打字才有東西可以顯示／更新。
      inner += '<button class="btn wide" id="quickNew" style="margin-top:10px;display:' +
        (pickerQuery.trim() ? 'block' : 'none') + '">' + ic('plus') +
        '新增「<span id="qnName">' + esc(pickerQuery.trim()) + '</span>」</button>';

    }else{
      const idx = rows.findIndex(r=>r.item.id === sheet.id);
      if(idx < 0){ sheet = null; return ''; }
      const r = rows[idx];
      const p = placeById(r.item.placeId);

      inner += p
        ? '<button class="sheet-place" data-goedit="' + esc(p.id) + '">' +
            '<span class="sp-name">' + codeTag(p) + esc(p.name) + '</span>' +
            '<span class="sp-go">' + ic('chevR') + '</span></button>'
        : '<h3>(景點已刪除)</h3>';

      inner += '<div class="sheet-row"><span class="lab">開始</span>' +
        '<button class="mini" data-shift="-15" data-id="' + esc(r.item.id) + '" aria-label="提早 15 分">−15</button>' +
        '<input type="time" class="start-time" data-start="' + esc(r.item.id) + '" aria-label="開始時間" value="' +
        esc(toClock(r.start)) + '">' +
        '<button class="mini" data-shift="15" data-id="' + esc(r.item.id) + '" aria-label="延後 15 分">＋15</button></div>';

      // 結束時間自己一列（開始不動）。有了開始與結束兩個欄位，鍵盤就能排出任何
      // 起訖組合——包括「往前開始、結束不動」，那是上緣拉動的效果，本來只能用拖的。
      inner += '<div class="sheet-row"><span class="lab">結束</span>' +
        '<button class="mini" data-endshift="-15" data-id="' + esc(r.item.id) + '" aria-label="結束提早 15 分">−15</button>' +
        '<input type="time" class="start-time" data-end="' + esc(r.item.id) + '" aria-label="結束時間" value="' +
        esc(toClock(r.end)) + '">' +
        '<button class="mini" data-endshift="15" data-id="' + esc(r.item.id) + '" aria-label="結束延後 15 分">＋15</button></div>';

      inner += '<div class="sheet-row"><span class="lab">停留</span>' +
        '<button class="mini" data-stay="-15" data-id="' + esc(r.item.id) + '" aria-label="減少 15 分">−15</button>' +
        '<span class="val">' + r.stay + ' 分</span>' +
        '<button class="mini" data-stay="15" data-id="' + esc(r.item.id) + '" aria-label="增加 15 分">＋15</button></div>';

      // 常用長度：三小時改成一小時本來要按八下 −15
      inner += '<div class="sheet-row"><span class="lab">常用</span>' +
        [30, 60, 90, 120].map(n =>
          '<button class="mini' + (r.stay === n ? ' on' : '') + '" data-setstay="' + n +
          '" data-id="' + esc(r.item.id) + '" aria-pressed="' + (r.stay === n ? 'true' : 'false') +
          '">' + n + ' 分</button>'
        ).join('') + '</div>';

      if(p && p.transitNote){
        inner += '<div class="sheet-note">' + ic('note') + ' ' + esc(p.transitNote) + '</div>';
      }

      if(p){
        inner += '<div class="sheet-row">' +
          '<button class="mini" data-nav data-copy="' + esc(p.id) + '">' + ic('copy') + '複製名稱</button>' +
          '<button class="mini" data-nav data-map="' + esc(p.id) + '">' + ic('pin') + '地圖</button>';
        if(idx > 0 && rows[idx-1].item.placeId){
          inner += '<button class="mini" data-nav data-route="' + esc(p.id) + '" data-from="' +
                   esc(rows[idx-1].item.placeId) + '">' + ic('route') + '路線</button>';
        }
        inner += '</div>';
      }

      inner += '<button class="btn wide danger" data-del="' + esc(r.item.id) + '" style="margin-top:14px">' +
        ic('trash') + '從這天移除</button>';
    }

    const anim = sheetJustOpened ? ' in' : '';
    const title = sheet.type === 'add' ? '加入景點' : '這個行程';
    return '<div class="sheet-mask' + anim + '" id="sheetMask"></div>' +
           '<div class="sheet' + anim + '" id="sheetBox" role="dialog" aria-modal="true"' +
             ' aria-label="' + title + '" tabindex="-1"><div class="sheet-grip"></div>' +
           inner +
           '<button class="btn wide ghost" id="sheetClose" style="margin-top:12px">關閉</button></div>';
  }

  function openPlaceEdit(p){
    sheet = null;
    editingPlace = Object.assign({}, p);
    tab = 'places';
    render();
    window.scrollTo(0, 0);
  }

  // ---------- 課表拖拉 ----------
  // 手機優先：長按 300ms 才進入拖曳，長按成立之前照常捲動頁面。
  // 滑鼠沒有誤觸捲動的問題，移動超過 4px 就直接開始拖；沒移動就還是「點一下開面板」。
  // 不用 HTML5 drag（iOS Safari 不支援），也不寫 touch-action:none（會整個擋掉捲動）；
  // 改成進入拖曳後才在非 passive 的 touchmove 裡 preventDefault。
  let press = null;
  let dragWired = false;
  // 拖曳結束時瀏覽器還會補一個 click，不擋掉就會被當成「點了空白處」而跳出加景點面板
  let suppressClick = false;
  const MOUSE_SLOP = 4;   // 滑鼠移動超過這麼多 px 就當成要拖
  const TOUCH_SLOP = 8;   // 手指在長按成立前移動超過這麼多 px 就當成要捲頁面

  // touch 事件一輩子都送到「手指按下去的那個元素」，而 enterDragScale() 會 render()
  // 把它換掉——元素一離開文件就不再冒泡到 document，掛在 document 上的 touchmove／
  // touchend 會收不到，拖到一半整個斷掉。所以觸控的監聽要掛在那個元素自己身上。
  // 滑鼠沒有這個問題（事件跟著游標下面的東西走），維持掛在 document。
  let touchHost = null;
  function holdTouchHost(el){
    dropTouchHost();
    touchHost = el;
    el.addEventListener('touchmove', pressMove, { passive: false });
    el.addEventListener('touchend', pressUp);
    el.addEventListener('touchcancel', pressUp);
  }
  function dropTouchHost(){
    if(!touchHost) return;
    touchHost.removeEventListener('touchmove', pressMove);
    touchHost.removeEventListener('touchend', pressUp);
    touchHost.removeEventListener('touchcancel', pressUp);
    touchHost = null;
  }

  function pointOf(e){
    const p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: p.clientX, y: p.clientY };
  }

  // 拖曳中的落點時間。方塊矮的時候名稱和時間會擠成一行，時間正好被手指蓋住，
  // 所以另外釘一個在畫面上緣。掛在 body 底下，render() 重畫 app 不會把它清掉。
  function showHud(text){
    let el = document.getElementById('ttHud');
    if(!el){
      el = document.createElement('div');
      el.id = 'ttHud';
      el.className = 'tt-hud';
      el.setAttribute('aria-hidden', 'true');
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.classList.add('on');
  }
  function hideHud(){
    const el = document.getElementById('ttHud');
    if(el) el.classList.remove('on');
  }

  // 壓縮開著時像素和分鐘不是等比：空檔裡 1px 約等於 3.3 分、行程區 1px 約等於 0.67 分，
  // 同樣的手指移動距離時間跳動差五倍，吸附的 15 分在空檔裡只有 4.5px，根本對不準。
  // 而且 buildMap() 的分段是拿各行程的起訖時間切的，放開手之後空檔重算、整頁跟著位移。
  // 所以一進入拖曳就把比例攤平，放開再收回去——只改變數不寫 localStorage，
  // 使用者自己的「壓縮空白」開關不受影響。
  // 用鍵盤開面板的人，面板關掉之後要把焦點送回原本那個行程
  let refocusBlockId = null;
  let squeezeBeforeDrag = null;
  function enterDragScale(){
    if(!squeeze) return;
    const el = press.el;
    // 節點已經不在文件裡就別動了，量出來的位置是 0，捲動補償會亂跳
    if(!el.isConnected) return;
    // 捲動補償要錨在「手指抓著的那一邊」。攤平會把方塊變高（120 分從 108px 變成
    // 180px），錨在頂端的話下緣會往下跑掉快 60px，拉下緣時方塊會先瞬間縮一截。
    const edge = (e)=> press.mode === 'bot' ? e.bottom : e.top;
    const before = edge(el.getBoundingClientRect());
    squeeze = false;
    // relayoutLane() 不會換掉 el，所以底下繼續用同一個節點
    if(!relayoutLane()){ squeeze = true; return; }
    squeezeBeforeDrag = true;
    window.scrollBy(0, edge(el.getBoundingClientRect()) - before);
    // 捲不動（已經到頁底）時補償會不完全，而且方塊變高之後下緣也會跑掉，
    // 所以抓取位置重算一次。拉邊帶時夾在邊帶寬度之內（免得變成離參考邊很遠的怪值），
    // 整塊移動時可用範圍是整個方塊。
    const r2 = el.getBoundingClientRect();
    press.grabDy = press.mode === 'bot'
      ? Math.max(-press.band, Math.min(0, press.y - r2.bottom))
      : press.mode === 'top'
        ? Math.max(0, Math.min(press.band, press.y - r2.top))
        : Math.max(0, Math.min(r2.height, press.y - r2.top));
    const lane = document.getElementById('ttLane');
    if(lane) press.laneTop = lane.getBoundingClientRect().top;
  }
  function exitDragScale(){
    if(squeezeBeforeDrag === null) return;
    squeeze = squeezeBeforeDrag;
    squeezeBeforeDrag = null;
  }

  function startDrag(){
    if(!press || press.dragging) return;
    if(press.timer){ clearTimeout(press.timer); press.timer = null; }
    press.dragging = true;
    enterDragScale();
    press.el.classList.add('drag');
    showHud(hudText(press.mode === 'bot' ? press.endOrigin : press.origin));
    if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
  }

  // 按在哪一段：上下邊帶是拉時間，其他地方是整塊移動
  function modeOf(target){
    const g = target && target.closest ? target.closest('.tt-grip') : null;
    return g ? g.dataset.grip : 'move';
  }

  function pressDown(el, it, e, mouse){
    const pt = pointOf(e);
    const lane = document.getElementById('ttLane');
    const laneTop = lane ? lane.getBoundingClientRect().top : 0;
    const mode = modeOf(e.target);
    const rect = el.getBoundingClientRect();
    const start = itemStart(it);
    press = {
      el, it, x: pt.x, y: pt.y,
      laneTop, mouse: !!mouse, mode,
      band: gripPx(rect.height) || 44,
      // 手指抓在參考邊的哪個位置，拖的時候要維持這個相對位置。
      // 拉下緣時參考邊是底部，其他時候是頂部。
      grabDy: pt.y - (mode === 'bot' ? rect.bottom : rect.top),
      origin: start, endOrigin: start + stayOf(it),
      cur: null, dragging: false, timer: null
    };
    // 滑鼠等它移動就好，只有手指需要把長按跟捲頁面區分開
    if(!mouse){
      holdTouchHost(el);
      press.timer = setTimeout(startDrag, 300);
    }
  }

  function pressMove(e){
    if(!press) return;
    const pt = pointOf(e);

    if(!press.dragging){
      const slop = press.mouse ? MOUSE_SLOP : TOUCH_SLOP;
      if(Math.abs(pt.y - press.y) <= slop && Math.abs(pt.x - press.x) <= slop) return;
      // 手指還沒長按就先動了，當成使用者要捲動，放掉這次
      if(!press.mouse){ clearTimeout(press.timer); press = null; dropTouchHost(); return; }
      startDrag();
    }

    if(e.cancelable) e.preventDefault();
    // 拖曳中比例是攤平的，但還是用絕對位置換算，才跟畫面上的格線對得起來
    let v = ttMinAt((pt.y - press.laneTop) - press.grabDy);
    v = Math.round(v / SNAP_MIN) * SNAP_MIN;
    if(press.mode === 'bot'){
      // 結束時間：最短留 SNAP_MIN，開始時間不動
      v = Math.max(press.origin + SNAP_MIN, Math.min(ttHi, v));
    }else if(press.mode === 'top'){
      // 開始時間：結束時間不動，所以不能越過它
      v = Math.max(ttLo, Math.min(press.endOrigin - SNAP_MIN, v));
    }else{
      v = Math.max(ttLo, Math.min(ttHi - SNAP_MIN, v));
    }
    press.cur = v;

    const top = press.mode === 'bot' ? ttY(press.origin) : ttY(v);
    press.el.style.top = Math.round(top) + 'px';
    if(press.mode !== 'move'){
      const bottom = press.mode === 'bot' ? ttY(v) : ttY(press.endOrigin);
      const hgt = Math.max(MIN_DRAW_PX, bottom - top);
      press.el.style.height = Math.round(hgt) + 'px';
      // 拉短到塞不下第二行時就把它收起來，不然會被裁一半
      const subEl = press.el.querySelector('.tt-b-sub');
      if(subEl) subEl.style.display = hgt >= SUB_MIN_PX ? '' : 'none';
    }

    // 方塊裡只放時間（窄的時候會被裁），停留幾分交給上緣那個提示
    const lbl = press.el.querySelector('.tt-b-time');
    if(lbl) lbl.textContent = spanText(v);
    showHud(hudText(v));
  }

  function spanText(v){
    if(press.mode === 'bot') return toClock(press.origin) + '–' + toClock(v);
    if(press.mode === 'top') return toClock(v) + '–' + toClock(press.endOrigin);
    return toClock(v) + '–' + toClock(v + stayOf(press.it));
  }
  // 拉長短的時候一起報停留幾分，不然要自己心算
  function hudText(v){
    if(press.mode === 'bot') return spanText(v) + '　' + (v - press.origin) + ' 分';
    if(press.mode === 'top') return spanText(v) + '　' + (press.endOrigin - v) + ' 分';
    return spanText(v);
  }

  async function pressUp(){
    if(!press) return;
    const p = press;
    press = null;
    dropTouchHost();
    if(p.timer) clearTimeout(p.timer);

    if(p.dragging){
      p.el.classList.remove('drag');
      hideHud();
      exitDragScale();
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; }, 350);
      const was = p.mode === 'bot' ? p.endOrigin : p.origin;
      if(p.cur == null || p.cur === was){ render(); return; }
      if(p.mode === 'bot'){
        p.it.stayMin = p.cur - p.origin;
      }else if(p.mode === 'top'){
        p.it.startTime = toClock(p.cur);
        p.it.stayMin = p.endOrigin - p.cur;
      }else{
        p.it.startTime = toClock(p.cur);
      }
      await putItem(curTripId, p.it.date, p.it);
      render();
      return;
    }
    // 沒長按也沒移動＝點一下，開這個行程的面板
    refocusBlockId = null;
    sheet = { type: 'item', id: p.it.id };
    render();
  }

  // document 上的監聽只掛一次，否則每次 render 都會疊一層。
  function wireDragOnce(){
    if(dragWired) return;
    dragWired = true;
    // iOS Safari 只有在元素或 document 有 touch 監聽時才會套用 :active，
    // 沒有這個空監聽，上面那些「按下變色」在 iPhone 上完全不會出現。
    document.addEventListener('touchstart', function(){}, { passive: true });
    // 鍵盤和 Android 返回鍵的使用者要有路可以退出面板
    document.addEventListener('keydown', (e)=>{
      if(e.key !== 'Escape') return;
      if(helpOpen){ helpOpen = false; render(); return; }
      if(sheet){ sheet = null; render(); }
    });
    document.addEventListener('mousemove', pressMove);
    document.addEventListener('mouseup', pressUp);
    // 觸控的 touchmove／touchend 不掛在這裡，見 holdTouchHost() 的說明
  }

  function wireTimeline(t, dates){
    app.querySelectorAll('[data-day]').forEach(b=>{
      b.onclick = ()=>{ curDate = b.dataset.day; sheet = null; ttExtLo = 0; ttExtHi = 0; render(); };
    });

    const findItem = (id)=> items.find(i=>i.id===id);

    wireDragOnce();
    if(!offline){
      app.querySelectorAll('[data-block]').forEach(el=>{
        const it = findItem(el.dataset.block);
        if(!it) return;
        el.addEventListener('mousedown', (e)=>{ if(e.button === 0) pressDown(el, it, e, true); });
        el.addEventListener('touchstart', (e)=>{ pressDown(el, it, e); }, { passive: true });
        // 拖曳是滑鼠和手指的事，鍵盤走面板——那裡面開始、結束、停留、移除都有。
        el.addEventListener('keydown', (e)=>{
          if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
          e.preventDefault();            // 空白鍵預設會捲動頁面
          refocusBlockId = it.id;        // 關掉面板之後把焦點送回這個行程
          sheet = { type: 'item', id: it.id };
          render();
        });
      });
    }

    // 面板關掉之後焦點會掉到 body，用鍵盤的人就迷路了。送回原本那個行程。
    if(!sheet && refocusBlockId){
      const back = app.querySelector('[data-block="' + refocusBlockId + '"]');
      refocusBlockId = null;
      if(back) back.focus();
    }

    app.querySelectorAll('[data-start]').forEach(inp=>{
      inp.onchange = async ()=>{
        const it = findItem(inp.dataset.start);
        if(!it) return;
        const v = inp.value.trim();
        if(toMin(v) == null){ render(); return; }   // 被清空就當沒改
        it.startTime = v;
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-stay]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        it.stayMin = Math.max(0, (Number(it.stayMin)||0) + Number(b.dataset.stay));
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-setstay]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        it.stayMin = Number(b.dataset.setstay);
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    // 結束時間：開始不動，改的其實是停留。這是下緣拉動的按鈕版。
    app.querySelectorAll('[data-end]').forEach(inp=>{
      inp.onchange = async ()=>{
        const it = findItem(inp.dataset.end);
        if(!it) return;
        const end = toMin(inp.value.trim());
        const start = toMin(it.startTime);
        if(end == null || start == null){ render(); return; }   // 被清空就當沒改
        it.stayMin = Math.max(0, end - start);                  // 結束早於開始就當 0 分
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-endshift]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        it.stayMin = Math.max(0, (Number(it.stayMin)||0) + Number(b.dataset.endshift));
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    // 開始時間的 ±15，跟停留同一套手勢。不讓它跨過午夜，否則會掉到前一天去。
    app.querySelectorAll('[data-shift]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        const cur = toMin(it.startTime);
        if(cur == null) return;
        it.startTime = toClock(Math.max(0, Math.min(23 * 60 + 45, cur + Number(b.dataset.shift))));
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-goedit]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.goedit);
        if(p) openPlaceEdit(p);
      };
    });

    app.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.del);
        if(!it) return;
        const p = placeById(it.placeId);
        if(!window.confirm('把「' + (p?p.name:'這個項目') + '」從 ' + dayLabel(curDate) + ' 移除？景點會留著。')) return;
        await delItem(curTripId, it.date, it.id);
        items = items.filter(x=>x.id!==it.id);
        sheet = null;
        render();
      };
    });

    app.querySelectorAll('[data-copy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.copy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」'}
                 : {type:'err', text:'複製失敗，請長按選取：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-map]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.map);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
    app.querySelectorAll('[data-route]').forEach(b=>{
      b.onclick = async ()=>{
        const to = placeById(b.dataset.route);
        const from = placeById(b.dataset.from);
        if(t.mapProvider === 'naver'){
          await copyText(mapQuery(to));
          msg = {type:'ok', text:'已複製「' + mapQuery(to) + '」，在 NAVER 貼上當終點'};
          window.open(webRouteUrl(t, from, to), '_blank', 'noopener');
          render();
          return;
        }
        openMap(null, webRouteUrl(t, from, to));
      };
    });

    // 課表上點空白處＝在那個時間加景點。這是主要入口，下面那顆鈕只是備援，
    // 免得第一次用的人不知道空白處可以點。
    const extUp = document.getElementById('extUp');
    if(extUp) extUp.onclick = ()=>{ ttExtLo += 1; render(); };
    const extDown = document.getElementById('extDown');
    if(extDown) extDown.onclick = ()=>{ ttExtHi += 1; render(); };
    const sqBtn = document.getElementById('sqToggle');
    if(sqBtn) sqBtn.onclick = ()=>{ setSqueeze(!squeeze); render(); };

    const lane = document.getElementById('ttLane');
    if(lane){
      lane.addEventListener('click', (e)=>{
        if(e.target.closest('.tt-block')) return;   // 點在格子上，交給格子自己處理
        if(suppressClick) return;                   // 剛拖曳完補上來的那個 click
        const box = lane.getBoundingClientRect();
        let m = ttMinAt(e.clientY - box.top);
        m = Math.round(m / SNAP_MIN) * SNAP_MIN;
        m = Math.max(ttLo, Math.min(ttHi - SNAP_MIN, m));
        sheet = { type:'add', at: m };
        pickerQuery = '';
        render();
      });
    }

    const openBtn = document.getElementById('openPicker');
    if(openBtn) openBtn.onclick = ()=>{
      const list = dayItems(curDate);
      let at = toMin(t.dayStart);
      if(at == null) at = 9 * 60;
      if(list.length){
        const last = list[list.length - 1];
        at = itemStart(last) + blockLen(last);
      }
      sheet = { type:'add', at: Math.min(at, 23 * 60 + 45) };
      pickerQuery = '';
      render();
    };

    const sheetClose = document.getElementById('sheetClose');
    if(sheetClose) sheetClose.onclick = ()=>{ sheet = null; render(); };
    // 面板一開就把焦點帶進來，讀螢幕軟體才會開始唸面板內容而不是停在背景。
    // 加景點那種下面會自己 focus 搜尋框，就不搶它的焦點。
    const sheetBox = document.getElementById('sheetBox');
    if(sheetBox && sheetJustOpened && sheet && sheet.type !== 'add') sheetBox.focus();
    const sheetMask = document.getElementById('sheetMask');
    if(sheetMask) sheetMask.onclick = ()=>{ sheet = null; render(); };

    const pq = document.getElementById('pq');
    if(pq){
      pq.focus();
      pq.value = pickerQuery;
      pq.oninput = ()=>{
        pickerQuery = pq.value;
        // 只重繪清單，不整頁重繪，免得洗掉正在打的字
        const q = pickerQuery.trim().toLowerCase();
        const list = app.querySelector('.picker-list');
        const hit = places.filter(p=> placeMatches(p, q));
        list.innerHTML = hit.length
          ? hit.map(pickerRowHtml).join('')
          : '<div class="none">沒有符合的景點</div>';
        list.querySelectorAll('[data-add]').forEach(bindAdd);
        const qn = document.getElementById('quickNew');
        const nm = document.getElementById('qnName');
        if(nm) nm.textContent = pickerQuery.trim();
        if(qn) qn.style.display = pickerQuery.trim() ? 'block' : 'none';
      };
    }

    function bindAdd(b){
      b.onclick = async ()=>{ await addToDay(b.dataset.add); };
    }
    app.querySelectorAll('[data-add]').forEach(bindAdd);

    const qn = document.getElementById('quickNew');
    if(qn){
      qn.onclick = async ()=>{
        const name = pickerQuery.trim();
        if(!name) return;
        const p = {
          id: uid('pl'), code: nextPlaceCode(places), name,
          localName:'', mapUrl:'', transitNote:'', category:'景點', stayMin:60,
          createdBy: me, savedAt:new Date().toISOString()
        };
        const ok = await putPlace(curTripId, p);
        if(!ok){ render(); return; }
        places.push(p);
        sortPlaces();
        await addToDay(p.id);
      };
    }

    // 放在面板記下的那個時間——也就是你點課表的位置。
    async function addToDay(placeId){
      const p = placeById(placeId);
      const list = dayItems(curDate);
      let start = (sheet && sheet.type === 'add') ? sheet.at : null;
      if(start == null){
        start = toMin(t.dayStart);
        if(start == null) start = 9 * 60;
        if(list.length){
          const last = list[list.length - 1];
          start = itemStart(last) + blockLen(last);
        }
      }
      if(start > 23 * 60 + 45) start = 23 * 60 + 45;
      const it = {
        id: uid('ti'), date: curDate, placeId,
        startTime: toClock(start),
        order: (list.length + 1) * 10,
        stayMin: p ? (p.stayMin||60) : 60,
        note:'',
        createdBy: me, savedAt:new Date().toISOString()
      };
      const ok = await putItem(curTripId, curDate, it);
      if(!ok){ render(); return; }
      items.push(it);
      sheet = null;
      pickerQuery = '';
      render();
    }
  }

  function tabsHtml(){
    return '<div class="tabs">' +
      '<button data-tab="timeline" data-nav class="' + (tab==='timeline'?'on':'') + '">時間軸</button>' +
      '<button data-tab="places" data-nav class="' + (tab==='places'?'on':'') + '">景點 ' + places.length + '</button>' +
      '<button data-tab="pre" data-nav class="' + (tab==='pre'?'on':'') + '">行前</button>' +
      '</div>';
  }

  // ---------- 行前 ----------
  // 「一起的」是整趟一份，每個項目下面有每位成員的勾；
  // 「我自己的」一個人一包，畫面上只顯示自己的。
  // 兩邊的項目都可以是「勾選型」或「提醒型」（純文字、沒有勾格）。

  const PRE_PRESETS = [
    { text:'護照效期要滿六個月', kind:'note' },
    { text:'簽證／KETA', kind:'check' },
    { text:'旅平險', kind:'check' },
    { text:'網卡／漫遊', kind:'check' },
    { text:'換錢', kind:'check' },
    { text:'行動電源', kind:'check' },
    { text:'轉接頭', kind:'check' }
  ];

  // 正在編輯／新增的東西。一次只會有一個，所以用一個物件就夠。
  // {what:'preNew'|'preEdit'|'topicNew'|'topicEdit'|'memoNew'|'memoEdit', id, topicId}
  let preForm = null;
  let preDraft = '';
  let preKind = 'check';

  function memoData(){
    return memo && Array.isArray(memo.topics) ? memo : { topics: [] };
  }

  function preHtml(t){
    const ids = (t.memberIds || []).filter(id => people.some(p => p.id === id));
    let h = '';

    // ---- 一起的 ----
    h += '<h2 class="pre-h">一起的</h2>';

    if(!pres.length && preForm !== 'preNew'){
      h += '<div class="empty">還沒有項目</div>' +
           '<button class="btn wide ghost" id="preSeed" style="margin-top:10px">' +
           ic('plus') + '帶入常用項目</button>';
    }

    // 打勾的排成表格：成員名字只出現一次在表頭，一個項目一列。
    // 原本一項要一張卡片加一整排 44px 的勾，七項就吃掉七百多像素。
    // 用真的 <table>，讀螢幕軟體才唸得出「旅平險 × 雅婷」這個交叉關係。
    const checks = pres.filter(r => r.kind !== 'note');
    const notes  = pres.filter(r => r.kind === 'note');
    const editing = preForm && preForm.what === 'preEdit' ? preForm.id : null;

    if(checks.length){
      h += '<div class="pre-table-wrap"><table class="pre-table">' +
        '<thead><tr><th class="c-name"></th><th class="c-all"><span class="sr-only">全部</span></th>';
      ids.forEach(id=>{ h += '<th>' + esc(personName(id)) + '</th>'; });
      h += '</tr></thead><tbody>';

      checks.forEach(r=>{
        if(r.id === editing) return;   // 正在編輯的那一列拉到表格外面顯示
        const done = r.done || {};
        const n = ids.filter(id => done[id]).length;
        const allDone = ids.length > 0 && n === ids.length;
        h += '<tr><th class="c-name">' +
          '<button data-preedit="' + esc(r.id) + '" title="改文字或刪除">' + esc(r.text) + '</button></th>' +
          '<td class="c-all"><button class="all-pill' + (allDone ? ' on' : '') + '" data-preall="' + esc(r.id) +
            '" title="' + (allDone ? '全部取消' : '全部打勾') + '" aria-label="' +
            (allDone ? '全部取消' : '全部打勾') + '">' + n + '/' + ids.length + '</button></td>';
        ids.forEach(id=>{
          const on = !!done[id];
          h += '<td><button class="cell-tick' + (on ? ' on' : '') + '" data-pretick="' + esc(r.id) +
               '" data-who="' + esc(id) + '" aria-pressed="' + (on ? 'true' : 'false') +
               '" aria-label="' + esc(r.text) + ' ' + esc(personName(id)) + '">' +
               '<span class="box">' + (on ? ic('check') : '') + '</span></button></td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }

    if(editing && pres.some(r => r.id === editing)){
      h += preEditRow('pre', editing);
    }

    if(notes.length){
      if(checks.length) h += '<div class="pre-sep">提醒</div>';
      notes.forEach(r=>{
        if(r.id === editing) return;
        h += '<div class="pre-row"><div class="pre-top">' +
          '<span class="pre-text note">' + ic('note') + ' ' + esc(r.text) + '</span>' +
          '<button class="mini icon-only" data-preedit="' + esc(r.id) + '" title="改文字" aria-label="改文字">' + ic('edit') + '</button>' +
          '<button class="mini warn icon-only" data-predel="' + esc(r.id) + '" title="刪除" aria-label="刪除">' + ic('trash') + '</button>' +
          '</div></div>';
      });
    }

    h += (preForm && preForm.what === 'preNew')
      ? preEditRow('pre', null)
      : '<button class="btn wide ghost" id="preAdd" style="margin-top:10px">' + ic('plus') + '新增項目</button>';

    // ---- 我自己的 ----
    const m = memoData();
    h += '<h2 class="pre-h" style="margin-top:30px">我自己的</h2>' +
         '<p class="hint" style="margin-top:-4px">只有你看得到。不要寫真正的秘密——這是畫面上的過濾，不是上鎖。</p>';

    if(!m.topics.length && !(preForm && preForm.what === 'topicNew')){
      h += '<div class="empty">還沒有主題</div>';
    }

    m.topics.forEach(tp=>{
      h += '<div class="memo-card">';
      if(preForm && preForm.what === 'topicEdit' && preForm.id === tp.id){
        h += preEditRow('topic', tp.id);
      }else{
        h += '<div class="memo-head"><h3>' + esc(tp.title) + '</h3>' +
          '<button class="mini icon-only" data-tpedit="' + esc(tp.id) + '" title="改名" aria-label="改名">' + ic('edit') + '</button>' +
          '<button class="mini warn icon-only" data-tpdel="' + esc(tp.id) + '" title="刪除主題" aria-label="刪除主題">' + ic('trash') + '</button>' +
          '</div>';
      }

      const list = (tp.items || []);
      const mChecks = list.filter(x => x.kind !== 'note');
      const mNotes  = list.filter(x => x.kind === 'note');
      mChecks.concat(mNotes).forEach(it=>{
        if(preForm && preForm.what === 'memoEdit' && preForm.id === it.id){
          h += preEditRow('memo', it.id, tp.id);
          return;
        }
        h += '<div class="memo-item">';
        if(it.kind === 'note'){
          h += '<span class="mi-note">' + ic('note') + ' ' + esc(it.text) + '</span>';
        }else{
          h += '<button class="mi-tick' + (it.done ? ' on' : '') + '" data-memotick="' + esc(it.id) +
               '" data-tp="' + esc(tp.id) + '" aria-pressed="' + (it.done ? 'true' : 'false') + '">' +
               (it.done ? ic('check') : '') + '</button>' +
               '<span class="mi-text">' + esc(it.text) + '</span>';
        }
        h += '<span class="spacer"></span>' +
          '<button class="mini icon-only" data-miedit="' + esc(it.id) + '" data-tp="' + esc(tp.id) + '" title="改文字" aria-label="改文字">' + ic('edit') + '</button>' +
          '<button class="mini warn icon-only" data-midel="' + esc(it.id) + '" data-tp="' + esc(tp.id) + '" title="刪除" aria-label="刪除">' + ic('trash') + '</button>' +
          '</div>';
      });

      h += (preForm && preForm.what === 'memoNew' && preForm.topicId === tp.id)
        ? preEditRow('memo', null, tp.id)
        : '<button class="mini" data-miadd="' + esc(tp.id) + '" style="margin-top:8px">' + ic('plus') + '加一項</button>';
      h += '</div>';
    });

    h += (preForm && preForm.what === 'topicNew')
      ? preEditRow('topic', null)
      : '<button class="btn wide ghost" id="tpAdd" style="margin-top:10px">' + ic('plus') + '新增主題</button>';

    return h;
  }

  // 新增與改文字共用同一個表單。scope: 'pre' | 'topic' | 'memo'
  function preEditRow(scope, id, topicId){
    const isTopic = scope === 'topic';
    let h = '<div class="pre-form">' +
      '<input id="preInput" value="' + esc(preDraft) + '" placeholder="' +
      (isTopic ? '主題名稱，例如 伴手禮' : '要做什麼') + '" autocomplete="off">';

    if(!isTopic){
      h += '<div class="tabs" style="margin:10px 0 0">' +
        '<button data-prekind="check" class="' + (preKind === 'check' ? 'on' : '') + '">可以打勾</button>' +
        '<button data-prekind="note" class="' + (preKind === 'note' ? 'on' : '') + '">只是提醒</button>' +
        '</div>';
    }

    h += '<div style="display:flex;gap:8px;margin-top:10px">' +
      '<button class="btn" id="preSave" style="flex:1">' + (id ? '儲存' : '加入') + '</button>' +
      '<button class="btn ghost" id="preCancel">取消</button></div>';
    // 表格的列裡沒有刪除鈕，刪除放在這裡
    if(id && scope === 'pre'){
      h += '<button class="btn wide danger" data-predel="' + esc(id) + '" style="margin-top:10px">' +
           ic('trash') + '刪除這一項</button>';
    }
    h += '</div>';
    return h;
  }

  function wirePre(t){
    const ids = (t.memberIds || []).filter(id => people.some(p => p.id === id));
    const openForm = (what, id, topicId, draft, kind)=>{
      preForm = { what, id: id || null, topicId: topicId || null };
      preDraft = draft || '';
      preKind = kind || 'check';
      render();
    };
    const closeForm = ()=>{ preForm = null; preDraft = ''; preKind = 'check'; render(); };

    const seed = document.getElementById('preSeed');
    if(seed) seed.onclick = async ()=>{
      for(let i = 0; i < PRE_PRESETS.length; i++){
        const r = {
          id: uid('pr'), text: PRE_PRESETS[i].text, kind: PRE_PRESETS[i].kind,
          done: {}, order: (i + 1) * 10, createdBy: me, savedAt: new Date().toISOString()
        };
        const ok = await putPre(curTripId, r);
        if(!ok){ render(); return; }
        pres.push(r);
      }
      render();
    };

    const add = document.getElementById('preAdd');
    if(add) add.onclick = ()=> openForm('preNew');
    const tpAdd = document.getElementById('tpAdd');
    if(tpAdd) tpAdd.onclick = ()=> openForm('topicNew');

    app.querySelectorAll('[data-preedit]').forEach(b=>{
      b.onclick = ()=>{
        const r = pres.find(x => x.id === b.dataset.preedit);
        if(r) openForm('preEdit', r.id, null, r.text, r.kind);
      };
    });
    app.querySelectorAll('[data-tpedit]').forEach(b=>{
      b.onclick = ()=>{
        const tp = memoData().topics.find(x => x.id === b.dataset.tpedit);
        if(tp) openForm('topicEdit', tp.id, null, tp.title);
      };
    });
    app.querySelectorAll('[data-miadd]').forEach(b=>{
      b.onclick = ()=> openForm('memoNew', null, b.dataset.miadd);
    });
    app.querySelectorAll('[data-miedit]').forEach(b=>{
      b.onclick = ()=>{
        const tp = memoData().topics.find(x => x.id === b.dataset.tp);
        const it = tp && (tp.items || []).find(x => x.id === b.dataset.miedit);
        if(it) openForm('memoEdit', it.id, tp.id, it.text, it.kind);
      };
    });

    const input = document.getElementById('preInput');
    if(input){
      input.focus();
      input.value = preDraft;
      // 打字時只更新草稿，不重繪，否則每敲一個字焦點就被炸掉
      input.oninput = ()=>{ preDraft = input.value; };
      input.onkeydown = (e)=>{ if(e.key === 'Enter') savePre(); };
    }
    app.querySelectorAll('[data-prekind]').forEach(b=>{
      b.onclick = ()=>{
        preDraft = input ? input.value : preDraft;   // 先接住打到一半的字
        preKind = b.dataset.prekind;
        render();
      };
    });
    const cancel = document.getElementById('preCancel');
    if(cancel) cancel.onclick = closeForm;
    const save = document.getElementById('preSave');
    if(save) save.onclick = savePre;

    async function savePre(){
      const el = document.getElementById('preInput');
      const text = (el ? el.value : preDraft).trim();
      if(!text){ msg = {type:'err', text:'請先填文字。'}; render(); return; }
      const f = preForm;
      if(!f) return;

      if(f.what === 'preNew' || f.what === 'preEdit'){
        let r = f.id ? pres.find(x => x.id === f.id) : null;
        if(r){
          r.text = text;
          r.kind = preKind;
          if(preKind === 'note') r.done = {};   // 改成提醒型就不留勾選狀態
        }else{
          r = {
            id: uid('pr'), text, kind: preKind, done: {},
            order: (pres.length + 1) * 10, createdBy: me, savedAt: new Date().toISOString()
          };
          pres.push(r);
        }
        r.savedAt = new Date().toISOString();
        const ok = await putPre(curTripId, r);
        if(!ok){ render(); return; }
        closeForm();
        return;
      }

      const m = memoData();
      if(f.what === 'topicNew'){
        m.topics.push({ id: uid('tp'), title: text, items: [] });
      }else if(f.what === 'topicEdit'){
        const tp = m.topics.find(x => x.id === f.id);
        if(tp) tp.title = text;
      }else if(f.what === 'memoNew'){
        const tp = m.topics.find(x => x.id === f.topicId);
        if(tp){
          tp.items = tp.items || [];
          tp.items.push({ id: uid('mi'), text, kind: preKind, done: false });
        }
      }else if(f.what === 'memoEdit'){
        const tp = m.topics.find(x => x.id === f.topicId);
        const it = tp && (tp.items || []).find(x => x.id === f.id);
        if(it){
          it.text = text;
          it.kind = preKind;
          if(preKind === 'note') it.done = false;
        }
      }
      await saveMemo(m);
      closeForm();
    }

    async function saveMemo(m){
      m.savedAt = new Date().toISOString();
      memo = m;
      return putMemo(curTripId, m);
    }

    app.querySelectorAll('[data-pretick]').forEach(b=>{
      b.onclick = async ()=>{
        const r = pres.find(x => x.id === b.dataset.pretick);
        if(!r) return;
        r.done = r.done || {};
        const who = b.dataset.who;
        if(r.done[who]) delete r.done[who]; else r.done[who] = true;
        r.savedAt = new Date().toISOString();
        await putPre(curTripId, r);
        render();
      };
    });

    app.querySelectorAll('[data-preall]').forEach(b=>{
      b.onclick = async ()=>{
        const r = pres.find(x => x.id === b.dataset.preall);
        if(!r) return;
        r.done = r.done || {};
        const allDone = ids.length > 0 && ids.every(id => r.done[id]);
        r.done = {};
        if(!allDone) ids.forEach(id=>{ r.done[id] = true; });
        r.savedAt = new Date().toISOString();
        await putPre(curTripId, r);
        render();
      };
    });

    app.querySelectorAll('[data-predel]').forEach(b=>{
      b.onclick = async ()=>{
        const r = pres.find(x => x.id === b.dataset.predel);
        if(!r) return;
        if(!window.confirm('刪掉「' + r.text + '」？')) return;
        await delPre(curTripId, r.id);
        pres = pres.filter(x => x.id !== r.id);
        render();
      };
    });

    app.querySelectorAll('[data-memotick]').forEach(b=>{
      b.onclick = async ()=>{
        const m = memoData();
        const tp = m.topics.find(x => x.id === b.dataset.tp);
        const it = tp && (tp.items || []).find(x => x.id === b.dataset.memotick);
        if(!it) return;
        it.done = !it.done;
        await saveMemo(m);
        render();
      };
    });

    app.querySelectorAll('[data-midel]').forEach(b=>{
      b.onclick = async ()=>{
        const m = memoData();
        const tp = m.topics.find(x => x.id === b.dataset.tp);
        if(!tp) return;
        tp.items = (tp.items || []).filter(x => x.id !== b.dataset.midel);
        await saveMemo(m);
        render();
      };
    });

    app.querySelectorAll('[data-tpdel]').forEach(b=>{
      b.onclick = async ()=>{
        const m = memoData();
        const tp = m.topics.find(x => x.id === b.dataset.tpdel);
        if(!tp) return;
        if(!window.confirm('刪掉主題「' + tp.title + '」和裡面的項目？')) return;
        m.topics = m.topics.filter(x => x.id !== tp.id);
        await saveMemo(m);
        render();
      };
    });
  }

  // ---------- 景點 ----------
  let editingPlace = null;

  function placesHtml(t){
    const used = new Set(items.map(i=>i.placeId));
    let h = '';

    if(editingPlace !== null){
      const p = editingPlace;
      const isNew = !p.id;
      h += '<div class="card"><h2>' + (isNew ? '新增景點' : codeTag(p) + '編輯景點') + '</h2>' +
        '<label class="fld"><span>名稱</span><input id="qName" value="' + esc(p.name||'') + '"></label>';

      if(t.needsLocalName){
        const lbl = t.mapProvider === 'naver' ? '韓文名' : '當地語名稱';
        h += '<label class="fld"><span>' + lbl + '</span><input id="qLocal" value="' + esc(p.localName||'') + '" placeholder="교촌치킨 홍대점"></label>';
      }

      h += '<div class="row2">' +
        '<label class="fld"><span>分類</span><select id="qCat">' +
          CATS.map(c=>
            '<option' + (catOf(p)===c?' selected':'') + '>' + c + '</option>').join('') +
        '</select></label>' +
        '<label class="fld"><span>停留（分）</span><input id="qStay" type="number" min="0" step="15" value="' + (p.stayMin||60) + '"></label>' +
      '</div>';

      h += '<label class="fld"><span>地圖連結（選填）</span><input id="qUrl" value="' + esc(p.mapUrl||'') + '" placeholder="https://naver.me/…"></label>';

      h += '<label class="fld"><span>備註</span><textarea id="qNote" rows="3" placeholder="弘大入口站 9 號出口走 5 分／要先訂位">' + esc(p.transitNote||'') + '</textarea></label>';
      h += '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button class="btn" id="qSave" style="flex:1">儲存</button>' +
        '<button class="btn ghost" id="qCancel">取消</button></div></div>';
    }else{
      h += '<button class="btn wide" id="newPlace" style="margin-bottom:12px">' + ic('plus') + '新增景點</button>';
    }

    if(!places.length){
      h += '<div class="empty">還沒有景點</div>';
    }

    h += '<div class="place-list">';
    places.forEach(p=>{
      const inUse = used.has(p.id);
      h += '<div class="place-card">' +
        '<div class="pc-name">' + codeTag(p) +
          '<span class="pc-nm" title="' + esc(p.name) + '">' + esc(p.name) + '</span>' +
          '<span class="tag">' + esc(catOf(p)) + '</span>' +
          (inUse ? '' : '<span class="tag soft">還沒排</span>') + '</div>';
      let sub = '停留 ' + (p.stayMin||60) + ' 分';
      if(p.localName) sub += '　' + esc(p.localName);
      // 備註獨立一行（桌機會被截成一行並鎖高，所以即使沒備註也要留著這個元素）
      h += '<div class="pc-sub"><div class="pc-line">' + sub + '</div>' +
        '<div class="pc-line pc-note"' + (p.transitNote ? ' title="' + esc(p.transitNote) + '"' : '') + '>' +
        (p.transitNote ? ic('note') + ' ' + esc(p.transitNote) : '') + '</div></div>';
      h += '<div class="pc-btns">' +
        '<button class="mini icon-only" data-nav data-pcopy="' + esc(p.id) + '" title="複製名稱" aria-label="複製名稱">' + ic('copy') + '</button>' +
        '<button class="mini icon-only" data-nav data-pmap="' + esc(p.id) + '" title="開地圖" aria-label="開地圖">' + ic('pin') + '</button>' +
        '<button class="mini icon-only" data-pedit="' + esc(p.id) + '" title="編輯" aria-label="編輯">' + ic('edit') + '</button>' +
        '<button class="mini warn icon-only" data-pdel="' + esc(p.id) + '" title="刪除景點" aria-label="刪除景點">' + ic('trash') + '</button>' +
        '</div></div>';
    });
    h += '</div>';
    return h;
  }

  function wirePlaces(t){
    const nb = document.getElementById('newPlace');
    if(nb) nb.onclick = ()=>{
      editingPlace = {id:'', name:'', localName:'', mapUrl:'', transitNote:'', category:'景點', stayMin:60};
      render();
    };

    const cancel = document.getElementById('qCancel');
    if(cancel) cancel.onclick = ()=>{ editingPlace = null; render(); };

    const save = document.getElementById('qSave');
    if(save) save.onclick = async ()=>{
      const name = document.getElementById('qName').value.trim();
      if(!name){ msg={type:'err',text:'請填名稱。'}; render(); return; }
      const local = document.getElementById('qLocal');
      const rec = {
        id: editingPlace.id || uid('pl'),
        code: editingPlace.code || nextPlaceCode(places),
        name,
        localName: local ? local.value.trim() : (editingPlace.localName||''),
        category: document.getElementById('qCat').value,
        stayMin: Math.max(0, Number(document.getElementById('qStay').value)||60),
        mapUrl: document.getElementById('qUrl').value.trim(),
        transitNote: document.getElementById('qNote').value.trim(),
        createdBy: editingPlace.createdBy || me,
        savedAt: new Date().toISOString()
      };
      const ok = await putPlace(curTripId, rec);
      if(!ok){ render(); return; }
      const i = places.findIndex(x=>x.id===rec.id);
      if(i>=0) places[i] = rec; else places.push(rec);
      sortPlaces();
      editingPlace = null;
      msg = {type:'ok', text:'已儲存。'};
      render();
    };

    app.querySelectorAll('[data-pedit]').forEach(b=>{
      b.onclick = ()=>{ editingPlace = Object.assign({}, placeById(b.dataset.pedit)); render(); };
    });
    app.querySelectorAll('[data-pdel]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pdel);
        const uses = items.filter(i=>i.placeId===p.id);
        const extra = uses.length ? '\n\n它已經被排進 ' + uses.length + ' 個行程項目，那些項目也會一起刪掉。' : '';
        if(!window.confirm('刪除景點「' + p.name + '」？' + extra)) return;
        for(const it of uses){
          await delItem(curTripId, it.date, it.id);
        }
        items = items.filter(i=>i.placeId!==p.id);
        await delPlace(curTripId, p.id);
        places = places.filter(x=>x.id!==p.id);
        msg = {type:'ok', text:'已刪除。'};
        render();
      };
    });
    app.querySelectorAll('[data-pcopy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pcopy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」。'} : {type:'err', text:'複製失敗：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-pmap]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.pmap);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
  }

  // ================= 啟動 =================
  function waitForFirebase(){
    return new Promise((resolve)=>{
      if(window.firebaseReady){ resolve(); return; }
      document.addEventListener('firebase-ready', ()=>resolve(), {once:true});
      setTimeout(()=>resolve(), 3000);
    });
  }

  async function init(){
    await waitForFirebase();
    await refresh();

    const saved = recallMe();
    if(saved && tripPeople().some(p=>p.id===saved)){
      me = saved;
      view = 'list';
    }else{
      view = 'pick';
      if(offline) msg = {type:'warn', text:'離線中而且這台裝置還沒登入過。請先連上網路登入一次，之後沒網路也進得來。'};
    }
    render();
  }

  init();
})();
</script>
