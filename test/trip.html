<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程行程</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCM3vjVCn1jN_koNyZr2xL0z6ikledqG_0",
    authDomain: "weekly-sport-test.firebaseapp.com",
    databaseURL: "https://weekly-sport-test-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "weekly-sport-test",
    storageBucket: "weekly-sport-test.firebasestorage.app",
    messagingSenderId: "377712374301",
    appId: "1:377712374301:web:1168a4a1cb16616c9f4cf4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  window.db = getDatabase(app);
  window.dbRef = ref;
  window.dbGet = get;
  window.dbSet = set;

  signInAnonymously(auth)
    .catch((e)=>console.error('anonymous sign-in failed', e))
    .finally(()=>{
      window.firebaseReady = true;
      document.dispatchEvent(new Event('firebase-ready'));
    });
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #796B58;
    --line: #E4D9C4;
    --line-soft: #DFD7C9;
    --line-hour: #C4B79E;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    --radius: 16px;
    --radius-sm: 10px;
    /* 疊層順序集中在這裡，不要在各處自己填數字 */
    --z-stick: 20;
    --z-corner: 30;   /* 說明鈕要浮在釘住的日期列之上 */
    --z-help: 50;
    --z-mask: 40;
    --z-sheet: 41;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 18px; }

  header.top{ padding:26px 18px 16px; text-align:center; position:relative; }
  header.top .brand{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px;
    letter-spacing:.05em;
  }
  header.top .seed{ color:var(--accent); }
  header.top .who{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  /* 右上角的說明鈕，跟運動排程站的角落鈕同一個做法 */
  .corner-btn{
    position:fixed; z-index:var(--z-corner);
    /* 橫向使用時瀏海會吃掉右上角，所以要把安全區算進去 */
    top:calc(10px + env(safe-area-inset-top));
    right:calc(10px + env(safe-area-inset-right));
    width:44px; height:44px; padding:0; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:50%; box-shadow:0 1px 3px rgba(58,46,34,.12);
  }
  .corner-btn .ic{ width:19px; height:19px; vertical-align:0; margin:0; }
  .corner-btn:active{ background:var(--accent-soft); color:var(--accent-deep); }

  /* 說明書：整頁蓋掉，內容長，要能好好捲 */
  .help{
    position:fixed; inset:0; z-index:var(--z-help);
    background:var(--bg); overflow-y:auto;
    padding:0 18px calc(28px + env(safe-area-inset-bottom));
  }
  .help-in{ max-width:620px; margin:0 auto; }
  .help-top{
    position:sticky; top:0; background:var(--bg);
    display:flex; align-items:center; gap:10px;
    padding:14px 0 10px; margin-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .help-top h1{ flex:1; min-width:0; margin:0; font-size:18px; }
  .help h2{
    font-family:'Noto Serif TC',serif; font-size:13px; letter-spacing:.12em;
    color:var(--accent); margin:26px 0 10px; font-weight:700;
  }
  .help dl{ margin:0; }
  .help dt{
    font-size:14.5px; font-weight:700; color:var(--ink); margin-top:14px;
  }
  .help dt:first-child{ margin-top:0; }
  .help dd{
    margin:3px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.75;
  }
  .help .step{
    display:flex; gap:10px; align-items:baseline;
    padding:9px 0; border-top:1px solid var(--line-soft); font-size:14px;
  }
  .help .step:first-of-type{ border-top:0; }
  .help .step b{ flex:none; color:var(--accent-deep); }
  .help ul{ margin:0; padding-left:1.15em; font-size:13.5px; line-height:1.8; color:var(--ink-soft); }
  .help ul li::marker{ color:var(--accent); }

  .list-title{ margin:2px 0 12px; }
  .card{
    background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-bottom:14px;
  }
  h1{ font-family:'Noto Serif TC',serif; font-size:19px; margin:0 0 8px; }
  h2{ font-size:16px; margin:0 0 10px; }
  p.desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:inline-block; border:1px solid var(--accent); background:var(--accent);
    color:#fff; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:500;
  }
  .btn.ghost{ background:transparent; color:var(--accent-deep); }
  .btn.wide{ display:block; width:100%; text-align:center; }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  .btn.danger{ background:var(--red); border-color:var(--red); }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* min-height 44px：手指點得到的最小尺寸。原本算出來只有約 38px。 */
  input, select, textarea{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 11px; width:100%;
    min-height:44px;
  }
  /* 核取方塊不適用上面的最小高度，會被撐成一個 44px 的大方塊。
     觸控範圍改由包住它的整列 .chk-row 提供。 */
  input[type="checkbox"], input[type="radio"]{ width:auto; min-height:0; }
  .chk-row{
    display:flex; gap:10px; align-items:center; min-height:44px;
    padding:2px; font-size:14.5px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent-soft); outline-offset:1px; }

  /* 鍵盤操作要看得到焦點在哪。用 :focus-visible，滑鼠點按不會跳出外框。 */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-deep); outline-offset:2px; border-radius:var(--radius-sm);
  }
  /* 去掉行動瀏覽器點擊後那 300ms 的等待（等雙擊縮放） */
  button, a, label, summary{ touch-action:manipulation; }

  /* 按下去要馬上看得到反應。一律用顏色變化，不動版面，免得畫面跳動。 */
  .mini:active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep); }
  .btn:active{ filter:brightness(.92); }
  .picker-list button:active,
  .trip-card:active,
  .daybar button:active{ background:var(--accent-soft); }
  .sheet-place:active{ background:var(--accent); color:#fff; }
  .sheet-place:active .pcode{ background:rgba(255,255,255,.3); color:#fff; }
  .tt-block:active .tt-b-in{ border-color:var(--accent-deep); box-shadow:0 0 0 2px var(--accent-soft); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .person-btn:active{ transform:none; }
  }
  label.fld{ display:block; margin-bottom:10px; }
  label.fld > span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .msg{ font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; }
  .msg.err{ background:var(--red-soft); color:var(--red); }
  .msg.ok{ background:var(--green-soft); color:var(--green); }
  .msg.warn{ background:var(--amber-soft); color:#8a6220; }

  /* ---------- 旅程卡 ---------- */
  .trip-card{
    background:var(--bg-card); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    color:inherit; font-size:inherit;
  }
  .trip-card.done{ border-left-color:var(--ink-soft); opacity:.72; }
  .trip-card .tc-main{ flex:1; min-width:0; }
  .trip-card .tc-name{ font-weight:700; font-size:16px; }
  .trip-card .tc-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .trip-card .tc-go{ color:var(--accent); font-size:20px; }

  /* ---- 選人畫面：跟運動排程站一樣的小方塊 ---- */
  .people-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .person-btn{
    height:64px; display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:8px; text-align:center;
    font-size:14px; font-weight:500; color:var(--accent-deep); cursor:pointer;
  }
  .person-btn:active{ transform:scale(0.97); }

  .tag{
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
    border:1px solid var(--line); color:var(--ink-soft); background:#fff; margin-left:6px;
  }
  .tag.hot{ border-color:var(--red); color:var(--red); background:var(--red-soft); }
  .tag.soft{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }

  /* ---------- 分頁 ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button{
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:7px 14px; font-size:13.5px;
  }
  .tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500; }

  /* ---------- 日期列 ---------- */
  .daybar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .daybar button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--bg-card);
    border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; color:var(--ink-soft);
    text-align:center; line-height:1.35;
  }
  .daybar button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .daybar button .d2{ display:block; font-size:11px; opacity:.8; }
  .daybar button.half{ border-style:dashed; }

  /* ---------- 課表 ---------- */
  /* 分頁列＋日期列釘在畫面上緣，往下捲課表時還能直接換天，不用捲回去 */
  .tt-stick{
    position:sticky; top:0; z-index:var(--z-stick);
    background:var(--bg); padding-top:6px; margin:0 -18px; padding-left:18px; padding-right:18px;
    box-shadow:0 6px 10px -8px rgba(58,46,34,.35);
  }
  .tt-bar{ display:flex; align-items:center; gap:8px; margin:10px 0; }

  .tt{ position:relative; display:grid; grid-template-columns:44px 1fr; margin-bottom:14px; }
  .tt-gutter{ position:relative; }
  .tt-tick{
    position:absolute; right:8px; transform:translateY(-50%);
    font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .tt-lane{
    position:relative; overflow:hidden;
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-sm);
  }
  /* 被壓縮的區段：它代表「這裡什麼都沒有」，所以要是整頁最安靜的地方。
     原本畫滿斜紋反而變成最吵的東西，改成一塊比課表底色略沉的色塊，
     裡面的格線改成虛線就夠了。 */
  .tt-sq{
    position:absolute; left:0; right:0; pointer-events:none;
    background:var(--bg);
  }
  .tt-line{
    position:absolute; left:0; right:0; height:0;
    border-top:1px solid var(--line-soft);
  }
  .tt-line.hr{ border-top-color:var(--line-hour); }
  .tt-line.sq{ border-top-style:dashed; }
  .tt-line.hr.sq{ border-top-color:var(--line); }
  .tt-block{
    position:absolute; padding:0 2px; cursor:grab;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .tt-b-in{
    height:100%; overflow:hidden; padding:4px 8px;
    background:var(--accent-soft); border:1px solid var(--accent);
    border-left:3px solid var(--accent-deep); border-radius:var(--radius-sm);
  }
  .tt-b-name{ font-size:13px; font-weight:700; color:var(--accent-deep); line-height:1.4; }
  .tt-b-time{ font-size:11px; color:var(--accent-deep); font-variant-numeric:tabular-nums; }
  .tt-b-in.short{ display:flex; align-items:center; gap:8px; padding-top:0; padding-bottom:0; }
  .tt-b-in.short .tt-b-name{
    flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tt-b-in.short .tt-b-time{ flex:none; }
  .tt-block.drag{ z-index:5; cursor:grabbing; }
  .tt-block.drag .tt-b-in{ box-shadow:0 8px 20px rgba(58,46,34,.25); border-color:var(--accent-deep); }

  /* ---------- 貼底面板 ---------- */
  body.sheet-open{ overflow:hidden; }
  .sheet-mask{ position:fixed; inset:0; background:rgba(58,46,34,.45); z-index:var(--z-mask); }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:var(--z-sheet);
    background:var(--bg-card); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:8px 18px 18px;
    /* dvh 才是手機上真正可見的高度，vh 會被瀏覽器工具列灌水 */
    max-height:82vh; max-height:82dvh; overflow-y:auto;
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(58,46,34,.18);
  }
  /* 只有「剛打開」才滑入。按 ±15 分會整頁重繪，不加這個判斷的話
     每按一次面板就重新滑一次，很煩。 */
  .sheet.in{ animation:sheet-up .22s cubic-bezier(.2,.8,.25,1); }
  .sheet-mask.in{ animation:sheet-fade .22s ease-out; }
  @keyframes sheet-up{ from{ transform:translateY(100%); } }
  @keyframes sheet-fade{ from{ opacity:0; } }
  .sheet-grip{
    width:40px; height:4px; border-radius:99px; background:var(--line);
    margin:0 auto 14px;
  }
  .sheet h3{ font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 12px; }
  /* 面板最上面那列就是進景點編輯的入口 */
  .sheet-place{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;
    color:var(--accent-deep); font-size:15px; font-weight:700; min-height:44px;
  }
  .sheet-place .sp-name{ flex:1; min-width:0; }
  .sheet-place .sp-go{ flex:none; display:flex; }
  .sheet-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0; border-top:1px solid var(--line-soft);
  }
  .sheet-row .lab{ font-size:12.5px; color:var(--ink-soft); }
  .sheet-row .val{ font-size:14px; font-weight:700; min-width:52px; text-align:center; }
  .sheet-note{
    font-size:12.5px; color:var(--ink-soft); line-height:1.6;
    padding:10px 0 2px; border-top:1px solid var(--line-soft);
  }

  /* width:auto 讓瀏覽器照自己的語系決定寬度。中文 Chrome 會顯示成「上午 09:00」，
     寫死寬度會把分鐘切掉。 */
  input.start-time{
    width:auto; min-width:0; flex:none; padding:4px 7px;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--accent-deep); background:var(--accent-soft); border-color:var(--accent);
  }


  /* 看起來還是小顆，但用 ::after 把可點範圍撐到 44px。
     直接把按鈕做成 44px 高會讓整排控制鈕變得很笨重。
     inset 的 4px 剛好等於 gap 的一半，相鄰按鈕的感應範圍不會疊在一起。 */
  .mini{
    position:relative;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px; line-height:1.3;
    min-height:36px; display:inline-flex; align-items:center; gap:5px;
    touch-action:manipulation;
  }
  .mini::after{ content:''; position:absolute; inset:-4px; }
  .mini.on{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }
  .mini.warn{ border-color:var(--red); color:var(--red); }
  .mini.grab{ cursor:grab; }
  .spacer{ flex:1; }

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius);
    padding:22px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px;
  }

  /* ---------- 搜尋下拉 ---------- */
  .picker{ position:relative; }
  .picker-list{
    border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff;
    max-height:240px; overflow-y:auto; margin-top:6px;
  }
  .picker-list button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 12px; font-size:14px; color:inherit; border-bottom:1px solid var(--line);
  }
  .picker-list button:last-child{ border-bottom:0; }
  .picker-list button:hover{ background:var(--accent-soft); }
  .picker-list .pl-sub{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .picker-list .none{ padding:12px; font-size:13px; color:var(--ink-soft); }

  /* ---------- 景點 ---------- */
  .place-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px;
  }
  .place-card .pc-name{ font-weight:600; font-size:15px; }
  /* 景點編號 A、B、C…，建立時就固定，用來在搜尋框裡快速叫出某個景點 */
  .pcode{
    display:inline-block; min-width:21px; text-align:center;
    font-size:11.5px; font-weight:700; letter-spacing:.04em;
    color:var(--accent-deep); background:var(--accent-soft);
    border-radius:6px; padding:1px 5px; margin-right:7px;
  }
  .place-card .pc-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6; }
  .place-card .pc-btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }

  .hint{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin-top:8px; }
  .foot{ text-align:center; margin-top:26px; }
  .foot button{ background:none; border:0; color:var(--ink-soft); font-size:13px; text-decoration:underline; }

  /* 視窗夠寬時把景點清單搬到右邊當參考，手機完全不受影響 */
  .side{ display:none; }
  @media (min-width:1000px){
    /* 只有課表需要放右欄才變寬；列表和表單維持 760px，一行才不會長到難讀 */
    .wrap.wide{ max-width:1140px; }
    .tl-cols{ display:grid; grid-template-columns:1fr 300px; gap:22px; align-items:start; }
    .side{ display:block; position:sticky; top:12px; }
    .side h3{ font-family:'Noto Serif TC',serif; font-size:14px; margin:0 0 8px; }
    .side-list{
      border:1px solid var(--line); border-radius:var(--radius-sm);
      background:var(--bg-card); max-height:70vh; overflow-y:auto;
    }
    .side-list button{
      display:block; width:100%; text-align:left; border:0; background:transparent;
      padding:10px 12px; font-size:13.5px; color:inherit; border-bottom:1px solid var(--line-soft);
      min-height:44px;
    }
    .side-list button:last-child{ border-bottom:0; }

  }

  .switchbar{ display:flex; gap:8px; margin-bottom:14px; }
  .switchbar a{
    flex:1; text-align:center; text-decoration:none; font-size:13.5px;
    border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft);
    border-radius:99px; padding:8px 10px;
  }
  .switchbar a.on{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; font-weight:500; }


  /* Feather Icons 內嵌用 */
  .ic{ width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto; }
  .mini .ic, .btn .ic{ margin-right:.3em; }
  .mini .ic{ margin-right:0; }
  .mini.icon-only .ic, .btn .ic.only{ margin-right:0; }

  /* 離線唯讀：所有會改資料的控制項一律停用 */
  .offbar{
    display:flex; align-items:center; gap:9px;
    background:var(--amber-soft); border:1px solid var(--amber); color:#7d5716;
    border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:14px;

  button:disabled, input:disabled, select:disabled{ opacity:.4; cursor:not-allowed; }

<body>

<div class="wrap" id="app">
  <div class="card"><p class="desc">載入中…</p></div>
</div>

<script>
(function(){
  'use strict';

  const app = document.getElementById('app');
  const whoLine = document.getElementById('whoLine');
  const helpBtn = document.getElementById('helpBtn');

  // 圖示：Feather Icons 4.29.2（MIT License, https://feathericons.com）
  // tack 來自 Lucide（Feather 的後繼，同樣 MIT），Feather 本身沒有圖釘。
  // 直接內嵌 SVG path，不連 CDN，離線一樣顯示得出來。
  const ICONS = {
    map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>',
    wallet:'<rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>',
    route:'<polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>',
    note:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
    trash:'<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
    edit:'<path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>',
    gear:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
    back:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
    offline:'<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path><line x1="1" y1="1" x2="23" y2="23"></line>',
    chevR:'<polyline points="9 18 15 12 9 6"></polyline>',
    help:'<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>',
    close:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    up:'<polyline points="18 15 12 9 6 15"></polyline>',
    down:'<polyline points="6 9 12 15 18 9"></polyline>'
  };
  function ic(name){
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }

  // ================= Storage（與 index.html 同一層 data/ 節點） =================
  function safeKey(key){ return key.replace(/[.#$\[\]]/g, '_'); }

  async function sGet(key){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data/' + safeKey(key)));
      if(!snap.exists()) return null;
      return JSON.parse(snap.val());
    }catch(e){ console.error('sGet error', key, e); return null; }
  }
  async function sSet(key, val){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), JSON.stringify(val));
      return true;
    }catch(e){ console.error('sSet error', key, e); return false; }
  }
  async function sDelete(key){
    try{
      await window.dbSet(window.dbRef(window.db, 'data/' + safeKey(key)), null);
      return true;
    }catch(e){ console.error('sDelete error', key, e); return false; }
  }
  // 一次把整包 data 撈下來再自己篩前綴。資料量小（一個站全部），比逐 key 查快很多。
  async function sAll(){
    try{
      const snap = await window.dbGet(window.dbRef(window.db, 'data'));
      if(!snap.exists()) return {};
      return snap.val() || {};
    }catch(e){ console.error('sAll error', e); return null; }
  }
  function parseVal(raw){
    if(raw === undefined || raw === null) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }

  // ================= 離線快取 =================
  // 讀得到 Firebase 就順手存一份；讀不到就用快取撐著（唯讀）。
  const CACHE_KEY = 'trip-cache-v1';
  let offline = false;

  // 整包 data 裡的 people-list 帶著所有人的明碼密碼。主站只放在記憶體裡，
  // 寫進 localStorage 等於把它落地到硬碟、跨分頁跨關機都還在，共用電腦上會外流。
  // 登入只需要 id 與名字，所以存進快取前先把 password 拔掉。
  function stripSecrets(all){
    const out = {};
    Object.keys(all).forEach(k=>{ out[k] = all[k]; });
    try{
      const raw = out['people-list'];
      if(raw){
        const list = JSON.parse(raw);
        if(Array.isArray(list)){
          out['people-list'] = JSON.stringify(list.map(p=>{
            const c = Object.assign({}, p);
            delete c.password;
            return c;
          }));
        }
      }
    }catch(e){ delete out['people-list']; }   // 剖析不了就整個不要快取，寧可不能離線登入
    return out;
  }
  function writeCache(all){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), all:stripSecrets(all)})); }catch(e){}
  }
  function readCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  // ================= 狀態 =================
  let people = [];
  let allData = {};          // 整包 data 的原始（字串）副本
  let me = null;             // 目前登入者 id
  let view = 'pick';
  let msg = null;            // {type, text}

  let trips = [];            // [{...}]
  let curTripId = null;
  let places = [];           // 目前旅程的景點
  let items = [];            // 目前旅程的所有行程項目
  let curDate = null;
  let tab = 'timeline';      // timeline | places
  // 貼底面板：null＝沒開，{type:'add', at:分鐘} 或 {type:'item', id:項目 id}
  let sheet = null;
  let sheetJustOpened = false;
  let pickerQuery = '';

  // 只記「上次是誰」，不是憑證。快取已經沒有密碼，離線重開瀏覽器時
  // 靠這個才進得去唯讀模式；否則會變成沒網路就完全打不開。
  const SESSION_KEY = 'trip-me';
  function rememberMe(id){
    try{ id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  function recallMe(){
    try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; }
  }

  // ================= 小工具 =================
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function personName(id){
    const p = people.find(x=>x.id===id);
    return p ? p.name : '(已離開的成員)';
  }

  const WD = ['日','一','二','三','四','五','六'];
  function toKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fromKey(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  // 日期運算一律走這裡，讓 JS 自己處理月底與閏年，不要自己加減字串。
  function shiftDate(k, n){
    const d = fromKey(k);
    return toKey(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n));
  }
  function dateRange(start, end){
    const out = [];
    let cur = start;
    let guard = 0;
    while(guard++ < 400){
      out.push(cur);
      if(cur === end) break;
      cur = shiftDate(cur, 1);
    }
    return out;
  }
  function dayLabel(k){
    const d = fromKey(k);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function dayWd(k){ return '週' + WD[fromKey(k).getDay()]; }

  // 分鐘 <-> "HH:MM"
  function toMin(hhmm){
    if(!hhmm) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm.trim());
    if(!m) return null;
    return Number(m[1])*60 + Number(m[2]);
  }
  // 給 <input type="time"> 用：一定是合法的 00:00–23:59。
  // toHHMM() 會產生「25:30 (+1)」這種跨日寫法，直接塞進 time 欄會被瀏覽器當成空值。
  function toClock(min){
    if(min == null) return '12:00';
    const m = ((Math.round(min) % 1440) + 1440) % 1440;
    return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  }
  function toHHMM(min){
    if(min == null) return '--:--';
    let m = Math.round(min);
    const sign = m < 0 ? '-' : '';
    m = Math.abs(m);
    const dayOver = Math.floor(m / 1440);
    const rest = m % 1440;
    const s = sign + String(Math.floor(rest/60)).padStart(2,'0') + ':' + String(rest%60).padStart(2,'0');
    return dayOver > 0 ? s + ' (+' + dayOver + ')' : s;
  }

  // ================= 地圖服務 =================
  const APPNAME = '14sail.github.io';

  function mapQuery(place){
    return (place.localName && place.localName.trim()) ? place.localName.trim() : place.name;
  }
  function webMapUrl(trip, place){
    if(place.mapUrl && place.mapUrl.trim()) return place.mapUrl.trim();
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'https://map.naver.com/p/search/' + q
      : 'https://www.google.com/maps/search/?api=1&query=' + q;
  }
  function appMapUrl(trip, place){
    const q = encodeURIComponent(mapQuery(place));
    return trip.mapProvider === 'naver'
      ? 'nmap://search?query=' + q + '&appname=' + APPNAME
      : 'comgooglemaps://?q=' + q;
  }
  // NAVER 的 App 路線要起訖座標才算得出來，景點不再存座標之後就不做 App 跳轉，
  // 一律開網頁版，NAVER 那邊改成複製終點名稱讓使用者自己貼。
  function webRouteUrl(trip, from, to){
    if(trip.mapProvider === 'naver'){
      return 'https://map.naver.com/p/directions/-/-/-/transit';
    }
    const d = encodeURIComponent(mapQuery(to));
    const s = from ? encodeURIComponent(mapQuery(from)) : '';
    return 'https://www.google.com/maps/dir/?api=1&destination=' + d + (s ? '&origin=' + s : '') + '&travelmode=transit';
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // 手機才試 App scheme；1.2 秒內沒跳走就退回網頁版，沒裝 App 也不會卡死。
  function openMap(scheme, web){
    if(!isMobile || !scheme){ window.open(web, '_blank', 'noopener'); return; }
    let done = false;
    const bail = ()=>{ done = true; };
    window.addEventListener('pagehide', bail, {once:true});
    document.addEventListener('visibilitychange', bail, {once:true});
    setTimeout(()=>{
      window.removeEventListener('pagehide', bail);
      if(!done && !document.hidden) window.location.href = web;
    }, 1200);
    window.location.href = scheme;
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      // clipboard API 在非 https 或舊瀏覽器會失敗，退回舊做法
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(e2){ return false; }
    }
  }

  // ================= 時間軸推算 =================
  // 舊版的推算方式：只存順序＋停留＋移動，抵達時間即時算出來。
  // 改成課表之後每個項目自己存 startTime，這個函式只剩下 ensureItemTimes()
  // 轉換舊資料時會用到——把當初畫面上顯示的時間原封不動寫回去。
  function legacyComputeDay(dayItems, defaultStart){
    const rows = [];
    let cur = null;
    let conflicted = false;

    dayItems.forEach((it, idx)=>{
      const pin = toMin(it.pinTime);
      let arrive, lateBy = 0, slack = null;

      if(pin != null){
        if(cur == null || cur <= pin){
          slack = cur == null ? null : pin - cur;
          arrive = pin;
        }else{
          // 前面拖太久，撞上釘選項目
          arrive = cur;
          lateBy = cur - pin;
          conflicted = true;
        }
      }else{
        arrive = (cur == null) ? (toMin(defaultStart) ?? 9*60) : cur;
      }

      const stay = Number(it.stayMin) || 0;
      const move = Number(it.moveMin) || 0;
      const depart = arrive + stay;
      cur = depart + move;

      rows.push({
        item: it, idx,
        arrive, depart, stay, move,
        pinned: pin != null,
        lateBy, slack,
        afterConflict: conflicted && lateBy === 0
      });
    });

    return rows;
  }

  // ================= 資料載入 =================
  function hydrate(all){
    allData = all;
    people = parseVal(all['people-list']) || [];

    trips = [];
    Object.keys(all).forEach(k=>{
      if(k.startsWith('trip:')){
        const t = parseVal(all[k]);
        if(t && t.id) trips.push(t);
      }
    });
    trips.sort((a,b)=> String(b.startDate||'').localeCompare(String(a.startDate||'')));
  }

  function loadTripChildren(tripId){
    places = [];
    items = [];
    const pPrefix = safeKey('trip-place:' + tripId + ':');
    const iPrefix = safeKey('trip-item:' + tripId + ':');
    Object.keys(allData).forEach(k=>{
      if(k.startsWith(pPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) places.push(v);
      }else if(k.startsWith(iPrefix)){
        const v = parseVal(allData[k]);
        if(v && v.id) items.push(v);
      }
    });
    sortPlaces();
    items.sort((a,b)=> (a.order||0) - (b.order||0));
  }

  async function refresh(){
    const all = await sAll();
    if(all === null){
      const cache = readCache();
      if(cache && cache.all){
        offline = true;
        hydrate(cache.all);
        msg = {type:'warn', text:'目前連不上資料庫，顯示的是離線快取（' + new Date(cache.at).toLocaleString('zh-TW') + '），這個狀態下的修改不會被儲存。'};
        return;
      }
      offline = true;
      msg = {type:'err', text:'連不上資料庫，而且本機沒有快取。請檢查網路後重新整理。'};
      hydrate({});
      return;
    }
    offline = false;
    hydrate(all);
    writeCache(all);
  }

  // 單筆寫入：每個項目自己一個 key，兩個人同時改不同項目不會互相蓋掉。
  async function putTrip(t){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip:' + t.id, t);
    if(ok) allData[safeKey('trip:' + t.id)] = JSON.stringify(t);
    return ok;
  }
  async function putPlace(tripId, p){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-place:' + tripId + ':' + p.id, p);
    if(ok) allData[safeKey('trip-place:' + tripId + ':' + p.id)] = JSON.stringify(p);
    return ok;
  }
  async function delPlace(tripId, placeId){
    if(offline) return false;
    const ok = await sDelete('trip-place:' + tripId + ':' + placeId);
    if(ok) delete allData[safeKey('trip-place:' + tripId + ':' + placeId)];
    return ok;
  }
  async function putItem(tripId, date, it){
    if(offline){ msg = {type:'err', text:'離線狀態無法儲存。'}; return false; }
    const ok = await sSet('trip-item:' + tripId + ':' + date + ':' + it.id, it);
    if(ok) allData[safeKey('trip-item:' + tripId + ':' + date + ':' + it.id)] = JSON.stringify(it);
    return ok;
  }
  async function delItem(tripId, date, itemId){
    if(offline) return false;
    const ok = await sDelete('trip-item:' + tripId + ':' + date + ':' + itemId);
    if(ok) delete allData[safeKey('trip-item:' + tripId + ':' + date + ':' + itemId)];
    return ok;
  }

  // ================= 畫面 =================
  function flash(){
    if(!msg) return '';
    const h = '<div class="msg ' + msg.type + '">' + esc(msg.text) + '</div>';
    msg = null;
    return h;
  }

  // 離線時：除了標了 data-nav 的瀏覽類控制項，其餘一律停用，連拖拉也拿掉。
  function applyReadOnly(){
    if(!offline) return;
    app.querySelectorAll('button, input, select, textarea').forEach(el=>{
      if(el.hasAttribute('data-nav')) return;
      el.disabled = true;
    });
    app.querySelectorAll('.tl-item').forEach(el=>{ el.removeAttribute('draggable'); });
  }
  function offBar(){
    if(!offline) return '';
    return '<div class="offbar">' + ic('offline') +
      '<span>離線中，唯讀模式</span></div>';
  }

  function switchBar(active){
    return '<div class="switchbar">' +
      '<a class="' + (active==='trip'?'on':'') + '" href="trip.html">' + ic('map') + ' 行程</a>' +

  // ---------- 旅程內頁 ----------
  function curTrip(){ return trips.find(t=>t.id===curTripId); }

  // 課表時代：順序由開始時間決定，order 只在同時間時當個穩定的排序依據。
  function itemStart(it){
    const m = toMin(it && it.startTime);
    return m == null ? 9 * 60 : m;
  }
  function dayItems(date){
    return items.filter(i=>i.date===date)
                .sort((a,b)=> (itemStart(a) - itemStart(b)) || ((a.order||0) - (b.order||0)));
  }
  function placeById(id){ return places.find(p=>p.id===id); }

  // ---------- 景點編號 ----------
  // A、B…Z、AA、AB…。編號在建立景點時就寫進資料裡，之後不會因為改名、
  // 排序或新增別的景點而跳號——寫在紙上的「先去 B 再去 D」才不會隔天變成別的地方。
  function codeOfIndex(n){
    let s = '';
    while(n >= 0){
      s = String.fromCharCode(65 + (n % 26)) + s;
      n = Math.floor(n / 26) - 1;
    }
    return s;
  }
  function nextPlaceCode(list){
    const used = {};
    list.forEach(p=>{ if(p.code) used[p.code] = true; });
    for(let i = 0; i < 5000; i++){
      const c = codeOfIndex(i);
      if(!used[c]) return c;
    }
    return '';
  }
  function placeCode(p){ return p && p.code ? p.code : '—'; }
  function codeTag(p){ return '<span class="pcode">' + esc(placeCode(p)) + '</span>'; }

  // 搜尋框打 A 就叫得出 A 那個景點；打名字或當地語名也一樣找得到。
  function placeMatches(p, q){
    if(!q) return true;
    return (p.code||'').toLowerCase().startsWith(q)
        || (p.name||'').toLowerCase().includes(q)
        || (p.localName||'').toLowerCase().includes(q);
  }
  function pickerRowHtml(p){
    return '<button data-add="' + esc(p.id) + '">' + codeTag(p) + esc(p.name) +
           '<span class="pl-sub">' + esc(p.category||'') +
           (p.localName?'　'+esc(p.localName):'') + '　' + (p.stayMin||60) + ' 分</span></button>';
  }

  // 短的編號排前面（Z 在 AA 前面），沒編號的沿用名字排序墊底。
  function sortPlaces(){
    places.sort((a,b)=>{
      const ca = a.code || '', cb = b.code || '';
      if(ca && cb){
        if(ca.length !== cb.length) return ca.length - cb.length;
        return ca < cb ? -1 : (ca > cb ? 1 : 0);
      }
      if(ca) return -1;
      if(cb) return 1;
      return String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant');
    });
  }

  // 這個功能上線前建立的景點沒有編號，第一次打開旅程時補上。
  // 照原本看到的名字順序補，編出來的 A、B、C 才跟她們印象中的清單一致。
  async function ensurePlaceCodes(tripId){
    if(offline) return;
    const missing = places.filter(p=>!p.code);
    if(!missing.length) return;
    missing.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant'));
    for(let i = 0; i < missing.length; i++){
      missing[i].code = nextPlaceCode(places);
      await putPlace(tripId, missing[i]);
    }
    sortPlaces();
  }

  // 課表化之前的行程只有順序＋停留＋移動，沒有自己的開始時間。
  // 用舊的推算方式算一次，把當時畫面上顯示的時間直接寫成 startTime，
  // 姊妹們原本排好的行程才不會因為改版整個跑掉。
  async function ensureItemTimes(tripId, trip){
    if(offline) return;
    const missing = items.filter(it=>!it.startTime);
    if(!missing.length) return;
    const dates = [];
    missing.forEach(it=>{ if(dates.indexOf(it.date) < 0) dates.push(it.date); });
    for(let d = 0; d < dates.length; d++){
      const list = items.filter(i=>i.date===dates[d]).sort((a,b)=>(a.order||0)-(b.order||0));
      const rows = legacyComputeDay(list, trip.dayStart);
      for(let r = 0; r < rows.length; r++){
        if(rows[r].item.startTime) continue;
        // 舊的推算允許跨午夜（會算出 25:00 這種），但 toClock() 會把它繞回 01:00，
        // 那筆就會跳到當天最前面。轉換時一律壓在 23:45，寧可擠在晚上也不要亂序。
        rows[r].item.startTime = toClock(Math.min(rows[r].arrive, 23 * 60 + 45));
        await putItem(tripId, rows[r].item.date, rows[r].item);
      }
    }
  }

  function renderTrip(){
    const t = curTrip();
    if(!t){ view='list'; render(); return; }

  // ---------- 課表 ----------
  // 每個項目自己記住 startTime（'HH:MM'），拖到哪就是幾點。
  // 舊資料只有順序＋停留＋移動，第一次打開時用 legacyComputeDay() 推算一次寫回去。
  const SNAP_MIN = 15;      // 拖拉吸附到 15 分
  const GRID_MIN = 30;      // 格線每 30 分一條
  // 1 分鐘 1.5px，所以最常見的 30 分鐘停留是 45px，本身就超過 44px 的觸控下限，
  // 不需要靠「最小高度」去撐。之前用 1px/分再硬撐最小高度，等於讓觸控尺寸
  // 污染了重疊判定：三段連續的 30 分行程明明沒撞在一起，卻會被判成同一組而全部畫成半寬。
  const PX_PER_MIN = 1.5;
  // 最矮 44px＝手指點得到的尺寸。這只影響畫出來的高度，不參與重疊判定，
  // 所以短行程撐高不會再害後面的行程被誤判成撞期。
  const MIN_DRAW_PX = 44;
  const SHORT_PX = 48;      // 低於這個高度就把名稱和時間排成一行，否則時間會被裁掉

  // 課表預設就畫 08:00-21:00 這一段，不管那天有沒有排東西，
  // 每天長度一致比較好對照。超出這個範圍的行程當然照畫，也可以手動往前後延伸。
  const WIN_LO = 8 * 60;
  const WIN_HI = 21 * 60;

  // 壓縮：一段連續的區間（不管是行程還是空檔），前 60 分照原比例畫，
  // 超過的部分只用 1/5 的比例。三小時的午餐和一整個下午的空檔都會縮短，
  // 代價是時間軸不再等比，所以做成可以關掉的開關。
  const SQ_FULL = 60;
  const SQ_RATE = 0.2;
  const SQ_KEY = 'trip-squeeze';

  let squeeze = true;
  try{ squeeze = localStorage.getItem(SQ_KEY) !== '0'; }catch(e){}
  function setSqueeze(on){
    squeeze = !!on;
    try{ localStorage.setItem(SQ_KEY, squeeze ? '1' : '0'); }catch(e){}
  }

  let ttLo = WIN_LO, ttHi = WIN_HI;   // 目前畫出來的時間範圍
  let ttExtLo = 0, ttExtHi = 0;       // 使用者按「往前／往後」多要的小時數
  let ttMap = { segs: [], total: 0 }; // 分鐘↔像素的對應表（壓縮後不是等比）

  function stayOf(it){ return Math.max(0, Number(it && it.stayMin) || 0); }
  function blockLen(it){ return Math.max(stayOf(it), SNAP_MIN); } // 接在後面時用

  function dayRange(t, rows){
    let lo = WIN_LO - ttExtLo * 60;
    let hi = WIN_HI + ttExtHi * 60;
    // 排在視窗外的行程一定要畫出來，否則會整筆看不見
    rows.forEach(r=>{
      if(r.start < lo) lo = r.start;
      if(r.drawEnd > hi) hi = r.drawEnd;
    });
    lo = Math.max(0, Math.floor(lo / 60) * 60);
    hi = Math.min(24 * 60, Math.ceil(hi / 60) * 60);
    if(hi - lo < 3 * 60) hi = Math.min(24 * 60, lo + 3 * 60);
    return { lo, hi };
  }

  // 時間重疊的並排顯示。一群互相重疊的算一組，組內每個找第一個放得下的欄位。
  function layoutDay(list){
    const rows = list.map(it=>{
      const start = itemStart(it);
      const end = start + stayOf(it);
      return {
        item: it, start, end, stay: stayOf(it),
        // 判重疊用真實時間。停留 0 分的也給一點寬度，否則永遠不算佔位。
        edge: Math.max(end, start + SNAP_MIN),
        // 畫出來的底部：太短的行程撐到看得見名字為止，但這只影響高度，不影響判重疊。
        drawEnd: Math.max(end, start + MIN_DRAW_PX / PX_PER_MIN),
        col: 0, cols: 1
      };
    });
    let i = 0;
    while(i < rows.length){
      let j = i, groupEnd = rows[i].edge;
      while(j + 1 < rows.length && rows[j + 1].start < groupEnd){
        j++;
        if(rows[j].edge > groupEnd) groupEnd = rows[j].edge;
      }
      const group = rows.slice(i, j + 1);
      const colEnds = [];
      group.forEach(r=>{
        let c = 0;
        while(c < colEnds.length && colEnds[c] > r.start) c++;
        r.col = c;
        colEnds[c] = r.edge;
      });
      group.forEach(r=>{ r.cols = colEnds.length; });
      i = j + 1;
    }
    return rows;
  }

  // ---------- 分鐘 ↔ 像素 ----------
  // 把一天沿著「行程開始／結束」切成一段一段，每段各自算高度。
  // 壓縮開著時，每段前 SQ_FULL 分鐘照原比例，超過的部分用 SQ_RATE。
  function buildMap(rows, lo, hi){
    const marks = [lo, hi];
    rows.forEach(r=>{
      if(r.start > lo && r.start < hi) marks.push(r.start);
      if(r.drawEnd > lo && r.drawEnd < hi) marks.push(r.drawEnd);
    });
    marks.sort((a,b)=> a - b);

    const segs = [];
    let y = 0;
    for(let i = 0; i < marks.length - 1; i++){
      const m0 = marks[i], m1 = marks[i+1];
      if(m1 <= m0) continue;
      const len = m1 - m0;
      const full = squeeze ? Math.min(len, SQ_FULL) : len;
      const rest = len - full;
      const px = full * PX_PER_MIN + rest * PX_PER_MIN * SQ_RATE;
      segs.push({ m0, m1, len, full, rest, y0: y, y1: y + px });
      y += px;
    }
    return { segs, total: y };
  }

  function ttY(m){
    const segs = ttMap.segs;
    if(!segs.length) return 0;
    if(m <= segs[0].m0) return 0;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(m <= s.m1){
        const d = m - s.m0;
        return d <= s.full
          ? s.y0 + d * PX_PER_MIN
          : s.y0 + s.full * PX_PER_MIN + (d - s.full) * PX_PER_MIN * SQ_RATE;
      }
    }
    return ttMap.total;
  }

  // 這條格線是不是落在被壓縮的區段裡？是的話畫成虛線。
  function inSqueezed(m){
    const segs = ttMap.segs;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(m > s.m0 && m <= s.m1) return s.rest > 0 && (m - s.m0) > s.full;
    }
    return false;
  }

  function ttMinAt(y){
    const segs = ttMap.segs;
    if(!segs.length) return ttLo;
    if(y <= 0) return segs[0].m0;
    for(let i = 0; i < segs.length; i++){
      const s = segs[i];
      if(y <= s.y1){
        const d = y - s.y0;
        const fullPx = s.full * PX_PER_MIN;
        return d <= fullPx
          ? s.m0 + d / PX_PER_MIN
          : s.m0 + s.full + (d - fullPx) / (PX_PER_MIN * SQ_RATE);
      }
    }
    return segs[segs.length - 1].m1;
  }

  function timelineHtml(t, dates){
    let h = '<div class="tt-stick"><div class="tabs">' +
      '<button data-tab="timeline" data-nav class="' + (tab==='timeline'?'on':'') + '">時間軸</button>' +
      '<button data-tab="places" data-nav class="' + (tab==='places'?'on':'') + '">景點 ' + places.length + '</button>' +
      '</div><div class="daybar">';
    dates.forEach((d,i)=>{
      const n = dayItems(d).length;
      const half = (i===0 || i===dates.length-1);
      h += '<button data-day="' + d + '" data-nav class="' + (d===curDate?'on':'') + (half?' half':'') + '">' +
           dayLabel(d) + '<span class="d2">' + dayWd(d) + (n?'・'+n:'') + '</span></button>';
    });
    h += '</div></div>';

    const rows = layoutDay(dayItems(curDate));
    const range = dayRange(t, rows);
    ttLo = range.lo;
    ttHi = range.hi;
    ttMap = buildMap(rows, ttLo, ttHi);

    // 提示只在空的日子出現，其他時候不佔位置
    if(!rows.length){
      h += '<p class="hint">點空白處就可以加景點</p>';
    }

    h += '<div class="tl-cols"><div>';

    h += '<div class="tt-bar">' +
      '<button class="mini" id="extUp"' + (ttLo <= 0 ? ' disabled' : '') + '>' + ic('up') + '往前 1 小時</button>' +
      '<span class="spacer"></span>' +
      '<button class="mini' + (squeeze ? ' on' : '') + '" id="sqToggle" aria-pressed="' + (squeeze?'true':'false') + '">' +
        (squeeze ? '已壓縮空白' : '完整比例') + '</button></div>';

    h += timetableHtml(rows);

    h += '<div class="tt-bar">' +
      '<button class="mini" id="extDown"' + (ttHi >= 24*60 ? ' disabled' : '') + '>' + ic('down') + '往後 1 小時</button></div>';

    h += '<button class="btn wide ghost" id="openPicker">' + ic('plus') + '加入景點</button>';
    h += '</div>' + sideHtml() + '</div>';
    h += sheetHtml(t, rows);
    return h;
  }

  // 桌機右欄：把景點清單放在旁邊當參考，排行程時不用切分頁。
  // 手機上 .side 是 display:none，完全不佔位置。
  function sideHtml(){
    let h = '<div class="side"><h3>景點 ' + places.length + '</h3>';
    if(!places.length){
      h += '<div class="empty">還沒有景點</div></div>';
      return h;
    }
    const used = new Set(items.map(i=>i.placeId));
    h += '<div class="side-list">';
    places.forEach(p=>{
      h += '<button data-goedit="' + esc(p.id) + '">' + codeTag(p) + esc(p.name) +
           '<span class="sl-sub">' + esc(p.category||'') + '　' + (p.stayMin||60) + ' 分' +
           (used.has(p.id) ? '' : '　還沒排') + '</span></button>';
    });
    h += '</div></div>';
    return h;
  }

  function timetableHtml(rows){
    let h = '<div class="tt" style="height:' + Math.round(ttMap.total) + 'px">';

    // 壓縮區裡整點會擠在一起疊字，太近的就不畫，看得懂比畫得齊重要
    h += '<div class="tt-gutter">';
    let lastTick = -99;
    for(let m = ttLo; m <= ttHi; m += 60){
      const y = ttY(m);
      if(m !== ttLo && m !== ttHi && y - lastTick < 20) continue;
      h += '<div class="tt-tick" style="top:' + Math.round(y) + 'px">' + toClock(m) + '</div>';
      lastTick = y;
    }
    h += '</div>';

    h += '<div class="tt-lane" id="ttLane">';

    // 被壓縮的區段畫上斜線，讓人知道這一段的比例被縮過，不是真的那麼短
    ttMap.segs.forEach(s=>{
      if(!s.rest) return;
      const y0 = ttY(s.m0 + s.full), y1 = s.y1;
      if(y1 - y0 < 2) return;
      h += '<div class="tt-sq" style="top:' + Math.round(y0) + 'px;height:' +
           Math.round(y1 - y0) + 'px"></div>';
    });

    let lastLine = -99;
    for(let m = ttLo + GRID_MIN; m < ttHi; m += GRID_MIN){
      const y = ttY(m);
      if(y - lastLine < 8) continue;   // 壓縮區的格線也會糊成一片
      const sq = inSqueezed(m);
      // 壓縮區代表「這段沒事」，不需要半小時的精度，只留整點就好
      if(sq && m % 60 !== 0) continue;
      h += '<div class="tt-line' + ((m % 60 === 0) ? ' hr' : '') +
           (sq ? ' sq' : '') + '" style="top:' + Math.round(y) + 'px"></div>';
      lastLine = y;
    }

    rows.forEach(r=>{
      const p = placeById(r.item.placeId);
      const top = ttY(r.start);
      const hgt = Math.max(MIN_DRAW_PX, ttY(r.drawEnd) - top);
      const w = 100 / r.cols;
      // 太矮的格子塞不下兩行，名稱和時間改排同一行，不然時間會被裁掉。
      const short = hgt < SHORT_PX;
      h += '<div class="tt-block" data-block="' + esc(r.item.id) + '"' +
             (p ? ' data-place="' + esc(p.id) + '"' : '') +
             ' style="top:' + Math.round(top) + 'px;height:' + Math.round(hgt) +
             'px;left:' + (r.col * w) + '%;width:' + w + '%">' +
           '<div class="tt-b-in' + (short ? ' short' : '') + '">' +
             '<div class="tt-b-name">' + (p ? codeTag(p) + esc(p.name) : '(景點已刪除)') + '</div>' +
             '<div class="tt-b-time">' + toClock(r.start) + '–' + toClock(r.end) + '</div>' +
           '</div></div>';
    });

    h += '</div></div>';
    return h;
  }

  // ---------- 說明書 ----------
  // 右上角問號打開。寫法刻意用「名詞＋一句話」，讓人用掃的就找得到，
  // 不要寫成一段一段的說明文。

      '<li><b>已結束</b>：旅程結束後在設定裡勾起來，會收到列表下面，資料不會刪掉。</li>' +

  // 這顆鈕在 #app 外面，不會被重繪洗掉，所以只接一次。
  if(helpBtn){
    helpBtn.innerHTML = ic('help');
    helpBtn.onclick = ()=>{ helpOpen = true; render(); };
  }

  function wireHelp(){
    const close = ()=>{ helpOpen = false; render(); };
    const a = document.getElementById('helpClose');
    if(a) a.onclick = close;
    const b = document.getElementById('helpClose2');
    if(b) b.onclick = close;

  // ---------- 貼底面板 ----------
  // 加景點、改景點都在這裡完成，不用捲到畫面下面去。
  function sheetHtml(t, rows){
    if(!sheet) return '';
    let inner = '';

    if(sheet.type === 'add'){
      inner += '<h3>加到 ' + toClock(sheet.at) + '</h3>' +
        '<label class="fld"><span>搜尋景點，或直接輸入新名稱</span>' +
        '<input id="pq" placeholder="編號或名稱，例如 A" value="' + esc(pickerQuery) + '" autocomplete="off"></label>';
      const q = pickerQuery.trim().toLowerCase();
      const hit = places.filter(p=> placeMatches(p, q));
      inner += '<div class="picker-list">' +
        (hit.length ? hit.map(pickerRowHtml).join('') : '<div class="none">沒有符合的景點</div>') +
        '</div>';
      // 這顆鈕一定要先存在，之後打字才有東西可以顯示／更新。
      inner += '<button class="btn wide" id="quickNew" style="margin-top:10px;display:' +
        (pickerQuery.trim() ? 'block' : 'none') + '">' + ic('plus') +
        '新增「<span id="qnName">' + esc(pickerQuery.trim()) + '</span>」</button>';

        ? '<button class="sheet-place" data-goedit="' + esc(p.id) + '">' +

            '<span class="sp-go">' + ic('chevR') + '</span></button>'

      inner += '<div class="sheet-row"><span class="lab">開始</span>' +
        '<input type="time" class="start-time" data-start="' + esc(r.item.id) + '" aria-label="開始時間" value="' +
        esc(toClock(r.start)) + '"></div>';

      inner += '<div class="sheet-row"><span class="lab">停留</span>' +
        '<button class="mini" data-stay="-15" data-id="' + esc(r.item.id) + '" aria-label="減少 15 分">−15</button>' +
        '<span class="val">' + r.stay + ' 分</span>' +

  }

  function openPlaceEdit(p){
    sheet = null;
    editingPlace = Object.assign({}, p);
    tab = 'places';
    render();
    window.scrollTo(0, 0);
  }

  // ---------- 課表拖拉 ----------
  // 手機優先：長按 300ms 才進入拖曳，之前照常捲動頁面。
  // 不用 HTML5 drag（iOS Safari 不支援），也不寫 touch-action:none（會整個擋掉捲動）；
  // 改成進入拖曳後才在非 passive 的 touchmove 裡 preventDefault。
  let press = null;
  let dragWired = false;
  // 拖曳結束時瀏覽器還會補一個 click，不擋掉就會被當成「點了空白處」而跳出加景點面板
  let suppressClick = false;

  function pointOf(e){
    const p = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: p.clientX, y: p.clientY };
  }

  function pressDown(el, it, e){
    const pt = pointOf(e);
    const lane = document.getElementById('ttLane');
    const laneTop = lane ? lane.getBoundingClientRect().top : 0;
    press = {
      el, it, x: pt.x, y: pt.y,
      laneTop,
      // 手指抓在格子的哪個位置，拖的時候要維持這個相對位置
      grabDy: pt.y - el.getBoundingClientRect().top,
      origin: itemStart(it), cur: null, dragging: false, timer: null
    };
    press.timer = setTimeout(()=>{
      if(!press) return;
      press.timer = null;
      press.dragging = true;
      press.el.classList.add('drag');
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
    }, 300);
  }

  function pressMove(e){
    if(!press) return;
    const pt = pointOf(e);
    if(press.dragging){
      if(e.cancelable) e.preventDefault();
      // 壓縮開著時像素和分鐘不是等比，所以要用絕對位置換算，不能用位移量乘係數
      let v = ttMinAt((pt.y - press.laneTop) - press.grabDy);
      v = Math.round(v / SNAP_MIN) * SNAP_MIN;
      v = Math.max(ttLo, Math.min(ttHi - SNAP_MIN, v));
      press.cur = v;
      press.el.style.top = Math.round(ttY(v)) + 'px';
      const lbl = press.el.querySelector('.tt-b-time');
      if(lbl) lbl.textContent = toClock(v) + '–' + toClock(v + stayOf(press.it));
      return;
    }
    // 還沒長按就先動了，當成使用者要捲動，放掉這次
    if(Math.abs(pt.y - press.y) > 8 || Math.abs(pt.x - press.x) > 8){
      clearTimeout(press.timer);
      press = null;
    }
  }

  async function pressUp(){
    if(!press) return;
    const p = press;
    press = null;
    if(p.timer) clearTimeout(p.timer);

    if(p.dragging){
      p.el.classList.remove('drag');
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; }, 350);
      if(p.cur == null || p.cur === p.origin){ render(); return; }
      p.it.startTime = toClock(p.cur);
      await putItem(curTripId, p.it.date, p.it);
      render();
      return;
    }
    // 沒長按也沒移動＝點一下，開這個行程的面板
    sheet = { type: 'item', id: p.it.id };
    render();
  }

  // document 上的監聽只掛一次，否則每次 render 都會疊一層。
  function wireDragOnce(){
    if(dragWired) return;
    dragWired = true;
    // iOS Safari 只有在元素或 document 有 touch 監聽時才會套用 :active，
    // 沒有這個空監聽，上面那些「按下變色」在 iPhone 上完全不會出現。
    document.addEventListener('touchstart', function(){}, { passive: true });
    // 鍵盤和 Android 返回鍵的使用者要有路可以退出面板
    document.addEventListener('keydown', (e)=>{
      if(e.key !== 'Escape') return;
      if(helpOpen){ helpOpen = false; render(); return; }
      if(sheet){ sheet = null; render(); }
    });
    document.addEventListener('mousemove', pressMove);
    document.addEventListener('mouseup', pressUp);
    document.addEventListener('touchmove', pressMove, { passive: false });
    document.addEventListener('touchend', pressUp);
    document.addEventListener('touchcancel', pressUp);
  }

  function wireTimeline(t, dates){
    app.querySelectorAll('[data-day]').forEach(b=>{
      b.onclick = ()=>{ curDate = b.dataset.day; sheet = null; ttExtLo = 0; ttExtHi = 0; render(); };
    });

    const findItem = (id)=> items.find(i=>i.id===id);

    wireDragOnce();
    if(!offline){
      app.querySelectorAll('[data-block]').forEach(el=>{
        const it = findItem(el.dataset.block);
        if(!it) return;
        el.addEventListener('mousedown', (e)=>{ if(e.button === 0) pressDown(el, it, e); });
        el.addEventListener('touchstart', (e)=>{ pressDown(el, it, e); }, { passive: true });
      });
    }

    app.querySelectorAll('[data-start]').forEach(inp=>{
      inp.onchange = async ()=>{
        const it = findItem(inp.dataset.start);
        if(!it) return;
        const v = inp.value.trim();
        if(toMin(v) == null){ render(); return; }   // 被清空就當沒改
        it.startTime = v;
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-stay]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.id);
        if(!it) return;
        it.stayMin = Math.max(0, (Number(it.stayMin)||0) + Number(b.dataset.stay));
        await putItem(curTripId, it.date, it);
        render();
      };
    });

    app.querySelectorAll('[data-goedit]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.goedit);
        if(p) openPlaceEdit(p);
      };
    });

    app.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        const it = findItem(b.dataset.del);
        if(!it) return;
        const p = placeById(it.placeId);
        if(!window.confirm('把「' + (p?p.name:'這個項目') + '」從 ' + dayLabel(curDate) + ' 移除？景點會留著。')) return;
        await delItem(curTripId, it.date, it.id);
        items = items.filter(x=>x.id!==it.id);
        sheet = null;
        render();
      };
    });

    app.querySelectorAll('[data-copy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.copy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」'}
                 : {type:'err', text:'複製失敗，請長按選取：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-map]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.map);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
    app.querySelectorAll('[data-route]').forEach(b=>{
      b.onclick = async ()=>{
        const to = placeById(b.dataset.route);
        const from = placeById(b.dataset.from);
        if(t.mapProvider === 'naver'){
          await copyText(mapQuery(to));
          msg = {type:'ok', text:'已複製「' + mapQuery(to) + '」，在 NAVER 貼上當終點'};
          window.open(webRouteUrl(t, from, to), '_blank', 'noopener');
          render();
          return;
        }
        openMap(null, webRouteUrl(t, from, to));
      };
    });

    // 課表上點空白處＝在那個時間加景點。這是主要入口，下面那顆鈕只是備援，
    // 免得第一次用的人不知道空白處可以點。
    const extUp = document.getElementById('extUp');
    if(extUp) extUp.onclick = ()=>{ ttExtLo += 1; render(); };
    const extDown = document.getElementById('extDown');
    if(extDown) extDown.onclick = ()=>{ ttExtHi += 1; render(); };
    const sqBtn = document.getElementById('sqToggle');
    if(sqBtn) sqBtn.onclick = ()=>{ setSqueeze(!squeeze); render(); };

    const lane = document.getElementById('ttLane');
    if(lane){
      lane.addEventListener('click', (e)=>{
        if(e.target.closest('.tt-block')) return;   // 點在格子上，交給格子自己處理
        if(suppressClick) return;                   // 剛拖曳完補上來的那個 click
        const box = lane.getBoundingClientRect();
        let m = ttMinAt(e.clientY - box.top);
        m = Math.round(m / SNAP_MIN) * SNAP_MIN;
        m = Math.max(ttLo, Math.min(ttHi - SNAP_MIN, m));
        sheet = { type:'add', at: m };
        pickerQuery = '';
        render();
      });
    }

    const openBtn = document.getElementById('openPicker');
    if(openBtn) openBtn.onclick = ()=>{
      const list = dayItems(curDate);
      let at = toMin(t.dayStart);
      if(at == null) at = 9 * 60;
      if(list.length){
        const last = list[list.length - 1];
        at = itemStart(last) + blockLen(last);
      }
      sheet = { type:'add', at: Math.min(at, 23 * 60 + 45) };
      pickerQuery = '';
      render();
    };

    const sheetClose = document.getElementById('sheetClose');
    if(sheetClose) sheetClose.onclick = ()=>{ sheet = null; render(); };
    // 面板一開就把焦點帶進來，讀螢幕軟體才會開始唸面板內容而不是停在背景。
    // 加景點那種下面會自己 focus 搜尋框，就不搶它的焦點。
    const sheetBox = document.getElementById('sheetBox');
    if(sheetBox && sheetJustOpened && sheet && sheet.type !== 'add') sheetBox.focus();
    const sheetMask = document.getElementById('sheetMask');
    if(sheetMask) sheetMask.onclick = ()=>{ sheet = null; render(); };

    const pq = document.getElementById('pq');
    if(pq){
      pq.focus();
      pq.value = pickerQuery;
      pq.oninput = ()=>{
        pickerQuery = pq.value;
        // 只重繪清單，不整頁重繪，免得洗掉正在打的字
        const q = pickerQuery.trim().toLowerCase();
        const list = app.querySelector('.picker-list');
        const hit = places.filter(p=> placeMatches(p, q));
        list.innerHTML = hit.length
          ? hit.map(pickerRowHtml).join('')
          : '<div class="none">沒有符合的景點</div>';
        list.querySelectorAll('[data-add]').forEach(bindAdd);
        const qn = document.getElementById('quickNew');
        const nm = document.getElementById('qnName');
        if(nm) nm.textContent = pickerQuery.trim();
        if(qn) qn.style.display = pickerQuery.trim() ? 'block' : 'none';
      };
    }

    function bindAdd(b){
      b.onclick = async ()=>{ await addToDay(b.dataset.add); };
    }
    app.querySelectorAll('[data-add]').forEach(bindAdd);

    const qn = document.getElementById('quickNew');
    if(qn){
      qn.onclick = async ()=>{
        const name = pickerQuery.trim();
        if(!name) return;
        const p = {
          id: uid('pl'), code: nextPlaceCode(places), name,
          localName:'', mapUrl:'', transitNote:'', category:'景點', stayMin:60,
          createdBy: me, savedAt:new Date().toISOString()
        };
        const ok = await putPlace(curTripId, p);
        if(!ok){ render(); return; }
        places.push(p);
        sortPlaces();
        await addToDay(p.id);
      };
    }

    // 放在面板記下的那個時間——也就是你點課表的位置。
    async function addToDay(placeId){
      const p = placeById(placeId);
      const list = dayItems(curDate);
      let start = (sheet && sheet.type === 'add') ? sheet.at : null;
      if(start == null){
        start = toMin(t.dayStart);
        if(start == null) start = 9 * 60;
        if(list.length){
          const last = list[list.length - 1];
          start = itemStart(last) + blockLen(last);
        }
      }
      if(start > 23 * 60 + 45) start = 23 * 60 + 45;
      const it = {
        id: uid('ti'), date: curDate, placeId,
        startTime: toClock(start),
        order: (list.length + 1) * 10,
        stayMin: p ? (p.stayMin||60) : 60,
        note:'',
        createdBy: me, savedAt:new Date().toISOString()
      };
      const ok = await putItem(curTripId, curDate, it);
      if(!ok){ render(); return; }
      items.push(it);
      sheet = null;
      pickerQuery = '';
      render();
    }
  }

  // ---------- 景點 ----------
  let editingPlace = null;

  function placesHtml(t){
    const used = new Set(items.map(i=>i.placeId));
    let h = '';

    if(editingPlace !== null){
      const p = editingPlace;
      const isNew = !p.id;
      h += '<div class="card"><h2>' + (isNew ? '新增景點' : codeTag(p) + '編輯景點') + '</h2>' +
        '<label class="fld"><span>名稱</span><input id="qName" value="' + esc(p.name||'') + '"></label>';

      if(t.needsLocalName){
        const lbl = t.mapProvider === 'naver' ? '韓文名' : '當地語名稱';
        h += '<label class="fld"><span>' + lbl + '</span><input id="qLocal" value="' + esc(p.localName||'') + '" placeholder="교촌치킨 홍대점"></label>';
      }

      h += '<div class="row2">' +
        '<label class="fld"><span>分類</span><select id="qCat">' +
          ['飯店','場館','餐廳','景點','購物','交通'].map(c=>
            '<option' + ((p.category||'景點')===c?' selected':'') + '>' + c + '</option>').join('') +
        '</select></label>' +
        '<label class="fld"><span>停留（分）</span><input id="qStay" type="number" min="0" step="15" value="' + (p.stayMin||60) + '"></label>' +
      '</div>';

      h += '<label class="fld"><span>地圖連結（選填）</span><input id="qUrl" value="' + esc(p.mapUrl||'') + '" placeholder="https://naver.me/…"></label>';

      h += '<label class="fld"><span>備註</span><textarea id="qNote" rows="3" placeholder="弘大入口站 9 號出口走 5 分／要先訂位">' + esc(p.transitNote||'') + '</textarea></label>';
      h += '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button class="btn" id="qSave" style="flex:1">儲存</button>' +
        '<button class="btn ghost" id="qCancel">取消</button></div></div>';
    }else{
      h += '<button class="btn wide" id="newPlace" style="margin-bottom:12px">' + ic('plus') + '新增景點</button>';
    }

    if(!places.length){
      h += '<div class="empty">還沒有景點</div>';
    }

    places.forEach(p=>{
      const inUse = used.has(p.id);
      h += '<div class="place-card">' +
        '<div class="pc-name">' + codeTag(p) + esc(p.name) +
          '<span class="tag">' + esc(p.category||'景點') + '</span>' +
          (inUse ? '' : '<span class="tag soft">還沒排</span>') + '</div>';
      let sub = '停留 ' + (p.stayMin||60) + ' 分';
      if(p.localName) sub += '　' + esc(p.localName);
      if(p.transitNote) sub += '<br>' + ic('note') + ' ' + esc(p.transitNote);
      h += '<div class="pc-sub">' + sub + '</div>';
      h += '<div class="pc-btns">' +
        '<button class="mini icon-only" data-nav data-pcopy="' + esc(p.id) + '" title="複製名稱" aria-label="複製名稱">' + ic('copy') + '</button>' +
        '<button class="mini icon-only" data-nav data-pmap="' + esc(p.id) + '" title="開地圖" aria-label="開地圖">' + ic('pin') + '</button>' +
        '<button class="mini icon-only" data-pedit="' + esc(p.id) + '" title="編輯" aria-label="編輯">' + ic('edit') + '</button>' +
        '<button class="mini warn icon-only" data-pdel="' + esc(p.id) + '" title="刪除景點" aria-label="刪除景點">' + ic('trash') + '</button>' +
        '</div></div>';
    });
    return h;
  }

  function wirePlaces(t){
    const nb = document.getElementById('newPlace');
    if(nb) nb.onclick = ()=>{
      editingPlace = {id:'', name:'', localName:'', mapUrl:'', transitNote:'', category:'景點', stayMin:60};
      render();
    };

    const cancel = document.getElementById('qCancel');
    if(cancel) cancel.onclick = ()=>{ editingPlace = null; render(); };

    const save = document.getElementById('qSave');
    if(save) save.onclick = async ()=>{
      const name = document.getElementById('qName').value.trim();
      if(!name){ msg={type:'err',text:'請填名稱。'}; render(); return; }
      const local = document.getElementById('qLocal');
      const rec = {
        id: editingPlace.id || uid('pl'),
        code: editingPlace.code || nextPlaceCode(places),
        name,
        localName: local ? local.value.trim() : (editingPlace.localName||''),
        category: document.getElementById('qCat').value,
        stayMin: Math.max(0, Number(document.getElementById('qStay').value)||60),
        mapUrl: document.getElementById('qUrl').value.trim(),
        transitNote: document.getElementById('qNote').value.trim(),
        createdBy: editingPlace.createdBy || me,
        savedAt: new Date().toISOString()
      };
      const ok = await putPlace(curTripId, rec);
      if(!ok){ render(); return; }
      const i = places.findIndex(x=>x.id===rec.id);
      if(i>=0) places[i] = rec; else places.push(rec);
      sortPlaces();
      editingPlace = null;
      msg = {type:'ok', text:'已儲存。'};
      render();
    };

    app.querySelectorAll('[data-pedit]').forEach(b=>{
      b.onclick = ()=>{ editingPlace = Object.assign({}, placeById(b.dataset.pedit)); render(); };
    });
    app.querySelectorAll('[data-pdel]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pdel);
        const uses = items.filter(i=>i.placeId===p.id);
        const extra = uses.length ? '\n\n它已經被排進 ' + uses.length + ' 個行程項目，那些項目也會一起刪掉。' : '';
        if(!window.confirm('刪除景點「' + p.name + '」？' + extra)) return;
        for(const it of uses){
          await delItem(curTripId, it.date, it.id);
        }
        items = items.filter(i=>i.placeId!==p.id);
        await delPlace(curTripId, p.id);
        places = places.filter(x=>x.id!==p.id);
        msg = {type:'ok', text:'已刪除。'};
        render();
      };
    });
    app.querySelectorAll('[data-pcopy]').forEach(b=>{
      b.onclick = async ()=>{
        const p = placeById(b.dataset.pcopy);
        const txt = mapQuery(p);
        const ok = await copyText(txt);
        msg = ok ? {type:'ok', text:'已複製「' + txt + '」。'} : {type:'err', text:'複製失敗：' + txt};
        render();
      };
    });
    app.querySelectorAll('[data-pmap]').forEach(b=>{
      b.onclick = ()=>{
        const p = placeById(b.dataset.pmap);
        openMap(appMapUrl(t, p), webMapUrl(t, p));
      };
    });
  }

  // ================= 啟動 =================
  function waitForFirebase(){
    return new Promise((resolve)=>{
      if(window.firebaseReady){ resolve(); return; }
      document.addEventListener('firebase-ready', ()=>resolve(), {once:true});
      setTimeout(()=>resolve(), 3000);
    });
  }

  async function init(){
    await waitForFirebase();
    await refresh();

    const saved = recallMe();
    if(saved && people.some(p=>p.id===saved)){
      me = saved;
      view = 'list';
    }else{
      view = 'pick';
      if(offline) msg = {type:'warn', text:'離線中而且這台裝置還沒登入過。請先連上網路登入一次，之後沒網路也進得來。'};
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
