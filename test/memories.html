<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>健機小隊半年了</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C5236' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #796B58;
    --line: #E4D9C4;
    --line-soft: #DFD7C9;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    --red-ink: #A04E3D;
    --green-ink: #5E6B46;
    --amber-ink: #8A6220;
    --radius: 16px;
    --radius-sm: 10px;
    --z-stick: 20;
    --z-corner: 30;
    --z-mask: 40;
    --z-sheet: 41;
    --z-help: 50;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  body.lb-open{ overflow:hidden; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 16px; }
  button{ font-family:inherit; cursor:pointer; }
  button, a, label{ touch-action:manipulation; }
  button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent-deep); outline-offset:2px;
  }
  .ic{ width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto; }

  /* ---------------- 登入（跟另外三站同一套） ---------------- */
  header.top{ padding:26px 18px 16px; text-align:center; }
  header.top .brand{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px; letter-spacing:.05em; }
  .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  p.desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }
  label.fld{ display:block; margin-bottom:10px; }
  label.fld > span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  input{
    font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; width:100%;
    min-height:44px;
  }
  input:focus{ outline:2px solid var(--accent-deep); outline-offset:1px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4em;
        border:1px solid var(--accent-deep); background:var(--accent-deep); color:#fff;
        border-radius:var(--radius-sm); padding:10px 18px; font-size:14px; font-weight:500;
        min-height:44px; text-decoration:none; }
  .btn.wide{ display:flex; width:100%; }
  .btn:active{ filter:brightness(.92); }
  .foot{ text-align:center; margin-top:26px; }
  .foot .back{ display:inline-flex; align-items:center; min-height:44px; padding:0 8px; color:var(--ink-soft); font-size:13px; }
  .msg{ font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; line-height:1.6; }
  .msg.err{ background:var(--red-soft); color:var(--red-ink); }

  /* ---------------- 開頭 ---------------- */
  .hero{ text-align:center; padding:calc(44px + env(safe-area-inset-top)) 16px 4px; }
  .hero .team{
    margin:0 0 4px; font-family:'Noto Serif TC',serif; font-weight:700;
    font-size:18px; letter-spacing:.35em; color:var(--accent-deep);
    padding-left:.35em; /* letter-spacing 會在最後一個字後面多一格，補回來才置中 */
  }
  .hero h1{
    font-family:'Noto Serif TC', serif; font-weight:700; margin:0;
    font-size:clamp(44px, 14vw, 72px); letter-spacing:.06em; line-height:1.1;
  }
  .hero h1 .hl{ color:var(--accent); }
  .hero .sum{ margin:10px 0 0; font-size:13.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .hero .ch{
    display:inline-block; opacity:0; filter:blur(8px); transform:translateY(12px);
    animation:rise .8s var(--ease) forwards;
  }
  @keyframes rise{ to{ opacity:1; filter:blur(0); transform:none; } }

  /* ---------------- 照片牆 ----------------
     一格放 memories/thumb/ 的 360px 縮圖（一張約 20KB），點了才載原圖。
     整面 38 張只要不到 1MB，原本疊牌版要一路載完 10MB 的原圖。 */
  .wall{ padding-top:22px; padding-bottom:8px; }
  .sess{ margin-bottom:22px; }
  .sess-head{
    display:flex; align-items:baseline; gap:8px; margin:0 2px 8px;
    font-size:inherit; font-weight:inherit;
  }
  .sess-head b{ font-family:'Noto Serif TC',serif; font-size:17px; font-weight:700; color:var(--accent-deep); }
  .sess-head span{ font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  @media (min-width:600px){ .grid{ grid-template-columns:repeat(4, 1fr); gap:8px; } }
  .tile{
    position:relative; display:block; width:100%; aspect-ratio:1; padding:0; border:0;
    border-radius:var(--radius-sm); overflow:hidden; background:var(--accent-soft);
  }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tile::after{ content:''; position:absolute; inset:0; background:transparent; transition:background .15s; }
  .tile:active::after{ background:rgba(58,46,34,.28); }
  /* ---------------- 結尾 ---------------- */
  .finale{
    min-height:80svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 16px calc(60px + env(safe-area-inset-bottom)); text-align:center;
  }
  .fin{
    width:min(62vw, 300px); aspect-ratio:3/4; border-radius:18px; overflow:hidden; margin-bottom:32px;
    box-shadow:0 24px 50px -18px rgba(58,46,34,.55), 0 0 0 1px rgba(58,46,34,.08);
    opacity:0; transform:translateY(60px) rotate(-8deg) scale(.9);
    transition:opacity .8s var(--ease), transform 1.1s var(--ease);
  }
  .fin.in{ opacity:1; transform:rotate(-3deg); }
  .fin img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bye{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:clamp(34px, 11vw, 56px);
    margin:0 0 28px; letter-spacing:.08em;
  }
  .bye .ch{ display:inline-block; opacity:0; filter:blur(8px); transform:translateY(16px); }
  .bye.in .ch{ animation:rise .9s var(--ease) forwards; }

  /* 小隊長的話：像一張信紙，內框一圈細線 */
  .letter{
    position:relative; width:100%; max-width:520px; margin:0 0 36px; text-align:left;
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:30px 24px 26px;
    box-shadow:0 18px 40px -20px rgba(58,46,34,.35);
  }
  .letter::before{
    content:''; position:absolute; inset:8px; border:1px solid var(--accent-soft);
    border-radius:10px; pointer-events:none;
  }
  .letter p{ margin:0 0 16px; font-size:15.5px; line-height:1.95; color:var(--ink); }
  .letter .hi{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px;
    color:var(--accent-deep); margin-bottom:18px;
  }
  /* 署名＋貼紙：貼紙的腳超出信紙下緣一點，像真的貼上去 */
  .letter{ margin-bottom:64px; }
  .sign{
    display:flex; align-items:flex-end; justify-content:flex-end; gap:6px;
    margin:6px -6px -62px 0; position:relative; z-index:1;
  }
  .sign .from{
    font-family:'Noto Serif TC',serif; font-weight:700; color:var(--accent-deep);
    margin-bottom:74px;
  }
  .sign .from::before{ content:'— '; }
  .captain{
    height:150px; width:auto; display:block;
    filter:drop-shadow(0 6px 10px rgba(58,46,34,.28));
    transform-origin:50% 100%;
    opacity:0; transform:scale(.3) rotate(-25deg);
  }
  /* 彈出來，之後一直小小地扭（過動） */
  .sign.in .captain{
    animation:pop .7s cubic-bezier(.34,1.56,.64,1) .35s forwards, wiggle 1.6s ease-in-out 1.2s infinite;
  }
  @keyframes pop{ to{ opacity:1; transform:scale(1) rotate(4deg); } }
  @keyframes wiggle{
    0%,100%{ opacity:1; transform:rotate(4deg); }
    50%{ opacity:1; transform:rotate(-4deg) translateY(-3px); }
  }
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
  .reveal.in{ opacity:1; transform:none; }

  /* ---------------- 看大圖 ---------------- */
  .lb{
    position:fixed; inset:0; z-index:var(--z-help); background:#140e09;
    display:flex; flex-direction:column; color:#fff;
    opacity:0; transition:opacity .25s;
  }
  .lb.on{ opacity:1; }
  .lb-top{
    display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 8px 8px 16px;
  }
  .lb-top .n{ flex:1; font-size:13px; font-variant-numeric:tabular-nums; color:#d9cdbd; }
  .lb-btn{
    width:44px; height:44px; border-radius:50%; border:0; display:grid; place-items:center;
    background:rgba(255,255,255,.12); color:#fff; flex:none;
  }
  .lb-btn:active{ background:rgba(255,255,255,.24); }
  .lb-btn .ic{ width:22px; height:22px; }
  .lb-stage{ flex:1; min-height:0; position:relative; overflow:hidden; touch-action:pan-y; }
  .lb-stage img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    user-select:none; -webkit-user-drag:none;
  }
  .lb-foot{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom));
  }
  .lb-foot .t{ flex:1; min-width:0; text-align:center; }
  .lb-foot .t b{ display:block; font-family:'Noto Serif TC',serif; font-size:18px; }
  .lb-foot .t span{ font-size:13px; color:#d9cdbd; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-delay:0s !important;
      animation-iteration-count:1 !important; transition-duration:.01ms !important;
      transition-delay:0s !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');

  // ================= 照片 =================
  // 要改標題就改這裡的 t。s 是第幾次運動，同一次的照片會排在一起、前面插一張分隔卡。
  // f 是根目錄 memories/ 底下的檔名（第幾次-第幾張），d 是日期。照時間排。
  // f 留空會顯示色塊佔位。
  const PHOTOS = [
    {s:1, f:'01-1.jpg', t:'逢甲跑跑步', d:'2026-04-22'},
    {s:2, f:'02-1.jpg', t:'第一次網球', d:'2026-05-07'},
    {s:2, f:'02-2.jpg', t:'網球王子', d:'2026-05-07'},
    {s:3, f:'03-1.jpg', t:'蜘蛛人抱石', d:'2026-05-11'},
    {s:3, f:'03-2.jpg', t:'蜘蛛人抱石', d:'2026-05-11'},
    {s:3, f:'03-3.jpg', t:'蜘蛛人抱石', d:'2026-05-11'},
    {s:4, f:'04-1.jpg', t:'公園跑跑', d:'2026-05-19'},
    {s:4, f:'04-2.jpg', t:'我沒有要輸', d:'2026-05-19'},
    {s:4, f:'04-3.jpg', t:'首席豬腳', d:'2026-05-19'},
    {s:4, f:'04-4.jpg', t:'公園跑跑耶', d:'2026-05-19'},
    {s:4, f:'04-5.jpg', t:'匹克球能者', d:'2026-05-19'},
    {s:4, f:'04-6.jpg', t:'咻~~', d:'2026-05-19'},
    {s:5, f:'05-1.jpg', t:'第一次匹克幫', d:'2026-05-27'},
    {s:5, f:'05-2.jpg', t:'匹克球可愛', d:'2026-05-27'},
    {s:5, f:'05-3.jpg', t:'大胃王王者', d:'2026-05-27'},
    {s:6, f:'06-1.jpg', t:'第一次羽球', d:'2026-06-04'},
    {s:6, f:'06-2.jpg', t:'羽球可愛', d:'2026-06-04'},
    {s:6, f:'06-3.jpg', t:'健機羽球隊', d:'2026-06-04'},
    {s:7, f:'07-1.jpg', t:'保齡球忘記拍照', d:'2026-06-15'},
    {s:8, f:'08-1.jpg', t:'撞球喔', d:'2026-06-24'},
    {s:9, f:'09-1.jpg', t:'芒果籃球', d:'2026-07-01'},
    {s:9, f:'09-2.jpg', t:'籃球隊不對', d:'2026-07-01'},
    {s:9, f:'09-3.jpg', t:'健機車隊', d:'2026-07-01'},
    {s:10, f:'10-1.jpg', t:'第二次匹克幫', d:'2026-07-29'},
    {s:10, f:'10-2.jpg', t:'Where is my key？', d:'2026-07-29'},
    {s:11, f:'11-1.jpg', t:'第二次網球後面在霸凌', d:'2026-08-03'},
    {s:12, f:'12-1.jpg', t:'第二次羽球', d:'2026-08-28'},
    {s:13, f:'13-1.jpg', t:'鼻要欺負我們女生！', d:'2026-09-07'},
    {s:13, f:'13-2.jpg', t:'抱石狂人', d:'2026-09-07'},
    {s:13, f:'13-3.jpg', t:'曖昧創客', d:'2026-09-07'},
    {s:13, f:'13-4.jpg', t:'選手預備備', d:'2026-09-07'},
    {s:14, f:'14-1.jpg', t:'第三次羽球', d:'2026-09-15'},
    {s:15, f:'15-1.jpg', t:'蜘蛛人第二次抱石', d:'2026-09-30'},
    {s:15, f:'15-2.jpg', t:'過動隊長先睡一下', d:'2026-09-30'},
    {s:15, f:'15-3.jpg', t:'石頭可愛', d:'2026-09-30'},
    {s:15, f:'15-4.jpg', t:'可愛偶膩line跟忙內', d:'2026-09-30'},
    {s:16, f:'16-1.jpg', t:'第三次網球有人變厲害', d:'2026-10-05'},
    {s:16, f:'16-2.jpg', t:'粉色網球', d:'2026-10-05'}
  ];
  // 結尾「最後...」上面那張
  const FINALE = 'finale.jpg';
  // 小隊長的話：第一行是開頭的招呼，中間一段一個字串，最後是署名
  const LETTER = {
    hi: '嗨一！我的小隊員們',
    body: [
      '從當初只是因為好玩而成立的健機小隊，到現在默默陪伴彼此走了半年。這一路上，真的很感謝每位小隊員的付出與支持，謝謝大家各司其職的一起讓這個小隊變得越來越好。',
      '對我來說，健機小隊成立的目的從來都不只是運動。如果能在大家平凡的日子裡，添上一點點溫暖與色彩，那會是小隊長我最欣慰、最開心的事。',
      '無論生活帶來多少低潮或脆弱，都要記得～健機小隊永遠是你們可以放心依靠的樹洞。一起運個動、聊聊天，沒有什麼過不去的，一切都會慢慢變好。',
      '最後，記得多來運動，保護好自己不要受傷了（我對自己說）！愛你們♡'
    ],
    from: '過動隊長',
    sticker: 'captain.png'   // 署名旁邊的去背貼紙照
  };
  // 測試站在 test/ 底下，照片共用根目錄那一份，兩邊才不用各放一套
  const PHOTO_DIR = /\/test\//.test(location.pathname) ? '../memories/' : 'memories/';
  const TEAM = '健機小隊';
  // 1–99 寫成國字：5 → 五、12 → 十二、20 → 二十
  function zh(n){
    const d = '零一二三四五六七八九';
    if(n < 10) return d[n];
    const t = Math.floor(n / 10), o = n % 10;
    return (t > 1 ? d[t] : '') + '十' + (o ? d[o] : '');
  }

  // 佔位圖：畫在 SVG 裡，離線也看得到
  function placeholder(i){
    const tones = [['#C79A74','#7C5236'],['#B9A27C','#6C7A52'],['#D2A86A','#A9744F'],['#C08A7A','#7C5236']];
    const [a,b] = tones[i % tones.length];
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'>" +
      "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='" + a + "'/>" +
      "<stop offset='1' stop-color='" + b + "'/></linearGradient></defs>" +
      "<rect width='400' height='500' fill='url(#g)'/>" +
      "<text x='200' y='250' font-family='serif' font-size='120' fill='rgba(255,255,255,.35)' text-anchor='middle' dominant-baseline='middle'>" +
      String(i+1).padStart(2,'0') + "</text></svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  function src(i){ return PHOTOS[i].f ? PHOTO_DIR + encodeURIComponent(PHOTOS[i].f) : placeholder(i); }
  // 照片牆用的正方形縮圖，由 tools/make-thumbs.py 產生在 memories/thumb/。新增照片後要再跑一次。
  function thumbSrc(i){ return PHOTOS[i].f ? PHOTO_DIR + 'thumb/' + encodeURIComponent(PHOTOS[i].f) : placeholder(i); }
  function fmtDate(d){ return d ? d.replace(/-/g, '.') : ''; }

  // ================= 圖示（Feather） =================
  const ICONS = {
    left:'<polyline points="15 18 9 12 15 6"></polyline>',
    right:'<polyline points="9 18 15 12 9 6"></polyline>',
    close:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    back:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>'
  };
  function ic(name){
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ================= 密碼 =================
  // 大家共用一組密碼。這裡只存 SHA-256，原始碼看不到明碼。
  // 換密碼：在 devtools console 執行下面這行，把結果貼到 PASS_HASH
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('新密碼')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
  // 注意：這只是擋住畫面，照片檔本身在 GitHub Pages 上是公開的。
  const PASS_HASH = 'f9809f2d2e60e9048a274a0dac5ee3f6ec7531ca847e5f953e76fa7e16d72b19';
  const SESSION_KEY = 'memories-ok';
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,'0')).join('');
  }
  function remember(ok){
    try{ ok ? localStorage.setItem(SESSION_KEY, PASS_HASH) : localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  // 存的是當下的雜湊；換了密碼，舊的記憶就自動失效
  function remembered(){
    try{ return localStorage.getItem(SESSION_KEY) === PASS_HASH; }catch(e){ return false; }
  }
  function renderGate(err){
    app.innerHTML = '<header class="top"><div class="brand">半年的小驚喜</div></header><div class="wrap">' +
      (err ? '<div class="msg err" role="alert">密碼不對。</div>' : '') +
      '<div class="card"><label class="fld"><span>密碼</span><input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      '<button class="btn wide" id="go">打開</button>' +
      '<div class="foot"><a class="back" href="index.html">回運動排程</a></div></div></div>';
    const pw = document.getElementById('pw');
    pw.focus();
    const submit = async ()=>{
      // 前後空白不算，手機輸入法常常多帶一格
      if(await sha256Hex(pw.value.trim()) === PASS_HASH){ remember(true); renderMemoir(); }
      else renderGate(true);
    };
    document.getElementById('go').onclick = submit;
    // 手機的密碼欄會鎖住中文輸入法，所以用一般文字欄。
    // 注音選字時按的 Enter 是在確認選字，不是送出
    pw.onkeydown = (e)=>{ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) submit(); };
  }

  // ================= 回憶錄 =================
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function chars(text, base, step){
    return Array.from(text).map((c, k) =>
      '<span class="ch" style="animation-delay:' + (base + k*step).toFixed(2) + 's">' + esc(c) + '</span>').join('');
  }

  function renderMemoir(){
    // 同一次運動的照片排成一組
    const sessions = [];
    PHOTOS.forEach((p, i)=>{
      let s = sessions[sessions.length - 1];
      if(!s || s.s !== p.s){ s = {s:p.s, d:p.d, idx:[]}; sessions.push(s); }
      s.idx.push(i);
    });

    let h = '<header class="hero">' +
      '<p class="team">' + chars(TEAM, .05, .08) + '</p>' +
      '<h1>' + chars('半年', .35, .12) + '<span class="hl">' + chars('了', .6, 0) + '</span></h1>' +
      '<p class="sum">' + sessions.length + ' 次運動・' + PHOTOS.length + ' 張照片</p>' +
    '</header>';

    h += '<main class="wrap wall">';
    sessions.forEach(s=>{
      h += '<section class="sess">' +
        '<h2 class="sess-head"><b>第' + zh(s.s) + '次</b><span>' + esc(fmtDate(s.d)) + '</span></h2>' +
        '<div class="grid">' +
        s.idx.map(i => '<button class="tile" data-open="' + i + '" aria-label="' + esc(PHOTOS[i].t) + '，看大圖">' +
          '<img src="' + thumbSrc(i) + '" alt="" width="360" height="360" loading="lazy" decoding="async"></button>').join('') +
        '</div></section>';
    });
    h += '</main>';

    h += '<section class="finale">' +
      '<div class="fin" id="fin"><img src="' + PHOTO_DIR + FINALE + '" alt="大家的手疊在一起" loading="lazy" decoding="async"></div>' +
      '<div class="bye" id="bye">' + chars('最後...', 0, .12) + '</div>' +
      '<article class="letter" id="letter">' +
        '<p class="hi reveal">' + esc(LETTER.hi) + '</p>' +
        LETTER.body.map(t => '<p class="reveal">' + esc(t) + '</p>').join('') +
        '<div class="sign reveal" id="sign">' +
          '<span class="from">' + esc(LETTER.from) + '</span>' +
          '<img class="captain" src="' + PHOTO_DIR + LETTER.sticker + '" alt="' + esc(LETTER.from) + '" loading="lazy" decoding="async">' +
        '</div>' +
      '</article>' +
      '<a class="btn reveal" href="index.html">' + ic('back') + '回運動排程</a>' +
    '</section>';

    app.innerHTML = h;
    window.scrollTo(0, 0);

    app.querySelectorAll('[data-open]').forEach(b=>{
      b.onclick = ()=> openLightbox(+b.dataset.open, b);
    });

    setupReveals();
  }

  // ---------- 結尾的照片與信，捲到才浮出來 ----------
  function setupReveals(){
    const io = new IntersectionObserver((ents)=>{
      ents.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold:.25});
    io.observe(document.getElementById('bye'));
    io.observe(document.getElementById('fin'));
    // 信一段一段浮出來，讀到哪亮到哪
    app.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }
  // ================= 看大圖 =================
  let lb = null, lbIdx = 0, lbFrom = null;
  function openLightbox(i, from){
    lbFrom = from; lbIdx = i;
    lb = document.createElement('div');
    lb.className = 'lb';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.innerHTML =
      '<div class="lb-top"><span class="n" id="lbN"></span>' +
        '<button class="lb-btn" id="lbX" aria-label="關閉">' + ic('close') + '</button></div>' +
      '<div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>' +
      '<div class="lb-foot">' +
        '<button class="lb-btn" id="lbP" aria-label="上一張">' + ic('left') + '</button>' +
        '<div class="t"><b id="lbT"></b><span id="lbD"></span></div>' +
        '<button class="lb-btn" id="lbNx" aria-label="下一張">' + ic('right') + '</button></div>';
    document.body.appendChild(lb);
    document.body.classList.add('lb-open');
    requestAnimationFrame(()=> lb.classList.add('on'));
    showLb();
    document.getElementById('lbX').onclick = closeLightbox;
    document.getElementById('lbP').onclick = ()=> stepLb(-1);
    document.getElementById('lbNx').onclick = ()=> stepLb(1);
    document.getElementById('lbX').focus();
    document.addEventListener('keydown', lbKey);

    // 左右滑換張：手指拖著圖走，放開時超過 60px 就換
    const stage = document.getElementById('lbStage'), img = document.getElementById('lbImg');
    let x0 = null, dx = 0;
    stage.onpointerdown = (e)=>{ x0 = e.clientX; dx = 0; img.style.transition = 'none'; stage.setPointerCapture(e.pointerId); };
    stage.onpointermove = (e)=>{
      if(x0 == null) return;
      dx = e.clientX - x0;
      img.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      img.style.opacity = 1 - Math.min(Math.abs(dx) / 400, .5);
    };
    const end = ()=>{
      if(x0 == null) return;
      x0 = null;
      img.style.transition = 'transform .3s var(--ease), opacity .3s';
      if(Math.abs(dx) > 60) stepLb(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1);
      else{ img.style.transform = ''; img.style.opacity = ''; }
    };
    stage.onpointerup = end;
    stage.onpointercancel = end;
  }
  function showLb(){
    const p = PHOTOS[lbIdx];
    document.getElementById('lbImg').src = src(lbIdx);
    document.getElementById('lbImg').alt = p.t;
    document.getElementById('lbN').textContent = String(lbIdx+1).padStart(2,'0') + ' / ' + String(PHOTOS.length).padStart(2,'0');
    document.getElementById('lbT').textContent = p.t;
    document.getElementById('lbD').textContent = fmtDate(p.d);
  }
  function stepLb(dir, fling){
    const img = document.getElementById('lbImg');
    const n = PHOTOS.length;
    const go = ()=>{
      lbIdx = (lbIdx + dir + n) % n;
      showLb();
      img.style.transition = 'none';
      img.style.transform = 'translateX(' + (dir * 40) + 'px)';
      img.style.opacity = 0;
      requestAnimationFrame(()=>{
        img.style.transition = 'transform .35s var(--ease), opacity .3s';
        img.style.transform = '';
        img.style.opacity = '';
      });
    };
    if(fling && !reduce){
      img.style.transform = 'translateX(' + (fling * 60) + '%) rotate(' + (fling * 8) + 'deg)';
      img.style.opacity = 0;
      setTimeout(go, 200);
    }else go();
  }
  function lbKey(e){
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') stepLb(-1);
    else if(e.key === 'ArrowRight') stepLb(1);
  }
  function closeLightbox(){
    if(!lb) return;
    document.removeEventListener('keydown', lbKey);
    document.body.classList.remove('lb-open');
    const el = lb; lb = null;
    el.classList.remove('on');
    setTimeout(()=> el.remove(), 250);
    if(lbFrom) lbFrom.focus({preventScroll:true});
  }

  // ================= 啟動 =================
  if(remembered()) renderMemoir();
  else renderGate(false);
})();
</script>
</body>
</html>
