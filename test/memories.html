<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>健機小隊半年了</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C5236' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg: #F6F1E7;
    --bg-card: #FFFDF8;
    --ink: #3A2E22;
    --ink-soft: #796B58;
    --line: #E4D9C4;
    --line-soft: #DFD7C9;
    --accent: #A9744F;
    --accent-deep: #7C5236;
    --accent-soft: #EFE0CB;
    --green: #6C7A52;
    --green-soft: #E7EBDD;
    --red: #B15C4A;
    --red-soft: #F3E2DC;
    --amber: #C08A34;
    --amber-soft: #F5EAD3;
    --red-ink: #A04E3D;
    --green-ink: #5E6B46;
    --amber-ink: #8A6220;
    --radius: 16px;
    --radius-sm: 10px;
    --z-stick: 20;
    --z-corner: 30;
    --z-mask: 40;
    --z-sheet: 41;
    --z-help: 50;
    /* 疊牌的尺寸由 JS 依視窗算好寫進來 */
    --cw: 340px;
    --ch: 440px;
    --top: 80px;
    --gap: 280px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  body.lb-open{ overflow:hidden; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 16px; }
  button{ font-family:inherit; cursor:pointer; }
  button, a, label{ touch-action:manipulation; }
  button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent-deep); outline-offset:2px;
  }
  .ic{ width:1em; height:1em; vertical-align:-0.14em; flex:0 0 auto; }

  /* ---------------- 登入（跟另外三站同一套） ---------------- */
  header.top{ padding:26px 18px 16px; text-align:center; }
  header.top .brand{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:22px; letter-spacing:.05em; }
  .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  p.desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; }
  label.fld{ display:block; margin-bottom:10px; }
  label.fld > span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; }
  input{
    font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; width:100%;
    min-height:44px;
  }
  input:focus{ outline:2px solid var(--accent-deep); outline-offset:1px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4em;
        border:1px solid var(--accent-deep); background:var(--accent-deep); color:#fff;
        border-radius:var(--radius-sm); padding:10px 18px; font-size:14px; font-weight:500;
        min-height:44px; text-decoration:none; }
  .btn.wide{ display:flex; width:100%; }
  .btn:active{ filter:brightness(.92); }
  .foot{ text-align:center; margin-top:26px; }
  .foot .back{ display:inline-flex; align-items:center; min-height:44px; padding:0 8px; color:var(--ink-soft); font-size:13px; }
  .msg{ font-size:13px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:12px; line-height:1.6; }
  .msg.err{ background:var(--red-soft); color:var(--red-ink); }

  /* ---------------- 上緣進度條、張數 ---------------- */
  .progress{
    position:fixed; z-index:var(--z-stick); top:0; left:0; right:0; height:3px;
    background:var(--accent); transform-origin:0 50%; transform:scaleX(0);
  }
  .counter{
    position:fixed; z-index:var(--z-corner);
    top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right));
    background:var(--bg-card); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; font-size:13px; font-weight:500;
    font-variant-numeric:tabular-nums; box-shadow:0 2px 8px rgba(58,46,34,.12);
    opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s var(--ease);
    pointer-events:none;
  }
  .counter.on{ opacity:1; transform:none; }
  .counter b{ color:var(--accent-deep); }
  /* 自動翻頁的播放／暫停鈕 */
  .auto-btn{
    position:fixed; z-index:var(--z-corner);
    right:calc(14px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom));
    width:44px; height:44px; padding:0; border-radius:50%; display:grid; place-items:center;
    background:var(--bg-card); color:var(--accent-deep); border:1px solid var(--line);
    box-shadow:0 2px 10px rgba(58,46,34,.18);
  }
  .auto-btn .ic{ width:18px; height:18px; }
  .auto-btn:active{ background:var(--accent-soft); }

  /* ---------------- 開場 ---------------- */
  .hero{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:56px 16px 40px; text-align:center; position:relative; overflow:hidden;
  }
  .hero-text{ will-change:transform, opacity; }
  .hero h1{
    font-family:'Noto Serif TC', serif; font-weight:700; margin:0;
    font-size:clamp(52px, 17vw, 96px); letter-spacing:.06em; line-height:1.05;
  }
  .hero h1 .ch{
    display:inline-block; opacity:0; filter:blur(10px); transform:translateY(18px);
    animation:rise .9s var(--ease) forwards;
  }
  .hero h1 .hl{ color:var(--accent); }
  .hero .team{
    margin:0 0 6px; font-family:'Noto Serif TC',serif; font-weight:700;
    font-size:clamp(20px, 6vw, 28px); letter-spacing:.35em; color:var(--accent-deep);
    padding-left:.35em; /* letter-spacing 會在最後一個字後面多一格，補回來才置中 */
  }
  .hero .team .ch{
    display:inline-block; opacity:0; filter:blur(8px); transform:translateY(12px);
    animation:rise .8s var(--ease) forwards;
  }
  @keyframes rise{ to{ opacity:1; filter:blur(0); transform:none; } }

  /* 三張扇形：外層吃捲動、內層吃進場動畫，兩個 transform 才不會互相蓋掉 */
  .fan{ display:flex; align-items:center; justify-content:center; width:min(100%, 480px); }
  .fan-slot{ will-change:transform; }
  .fan-slot.s0{ width:38%; margin-right:-8%; z-index:1; }
  .fan-slot.s1{ width:42%; z-index:2; }
  .fan-slot.s2{ width:38%; margin-left:-8%; z-index:1; }
  .fan-card{
    aspect-ratio:4/5; border-radius:14px; overflow:hidden; background:var(--accent-soft);
    box-shadow:0 18px 40px -12px rgba(58,46,34,.45), 0 0 0 1px rgba(58,46,34,.08);
    opacity:0; filter:blur(6px);
    transform:translate(var(--fx), var(--ty)) rotate(0deg);
    animation:deal .8s var(--ease) forwards;
  }
  .fan-slot.s0 .fan-card{ --fx:60%;  --ty:24px; --r:-7deg; animation-delay:.9s; }
  .fan-slot.s1 .fan-card{ --fx:0;    --ty:-8px; --r:0deg;  animation-delay:.8s; }
  .fan-slot.s2 .fan-card{ --fx:-60%; --ty:24px; --r:7deg;  animation-delay:1s; }
  @keyframes deal{
    to{ opacity:1; filter:blur(0); transform:translate(0, var(--ty)) rotate(var(--r)); }
  }
  .fan-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* 橫的照片放進直的牌會被切掉頭，所以照片完整放中間（往上偏一點，讓出下面寫標題），
     空出來的地方用同一張照片放大糊掉填滿 */
  .st-card img{ position:absolute; display:block; }
  .st-card img.bg{
    inset:0; width:100%; height:100%; object-fit:cover;
  }
  .st-card img.ph{
    left:0; top:0; width:100%; height:calc(100% - 70px);
    object-fit:contain; object-position:50% 50%;
  }


  /* ---------------- 疊牌 ----------------
     全部的牌放在同一個父層裡、同一個 top 黏住，後面的就會一張張蓋上來。
     分開包的話每張只黏在自己的格子裡，前一張會被捲走，疊不起來。 */
  .stack{ position:relative; padding:0 16px calc(var(--gap) * .6); }
  .st-card{
    position:sticky; top:var(--top);
    display:block; width:var(--cw); height:var(--ch); margin:0 auto var(--gap);
    border:0; padding:0; border-radius:20px; overflow:hidden; color:#fff; text-align:left;
    background:var(--accent-soft);
    box-shadow:0 24px 50px -18px rgba(58,46,34,.55), 0 0 0 1px rgba(58,46,34,.08);
    transform-origin:50% 0; will-change:transform;
  }
  .st-card:last-child{ margin-bottom:0; }
  .st-card .shade{
    position:absolute; inset:0; background:#1d1610; opacity:0; pointer-events:none;
  }
  .st-card .cap{
    position:absolute; left:0; right:0; bottom:0; padding:64px 20px 20px;
    background:linear-gradient(to top, rgba(20,14,9,.82), rgba(20,14,9,.5) 55%, rgba(20,14,9,0));
    will-change:transform, opacity;
  }
  .st-card .num{
    font-family:'Noto Serif TC',serif; font-size:13px; letter-spacing:.2em; opacity:.92;
  }
  .st-card .ttl{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:clamp(22px, 6.4vw, 30px);
    line-height:1.3; margin:4px 0 2px; text-wrap:balance;
  }
  .st-card .date{ font-size:13px; opacity:.92; font-variant-numeric:tabular-nums; }
  .st-card .zoom{
    position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center; background:rgba(20,14,9,.45); color:#fff;
  }
  .st-card .zoom .ic{ width:17px; height:17px; }

  /* 章節卡：每換一個月插一張 */
  .st-card.chap{
    background:var(--accent-deep); color:#fff; cursor:default;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .chap .big{
    font-family:'Noto Serif TC',serif; font-weight:700; line-height:1;
    font-size:min(44vw, 210px); letter-spacing:-.02em;
    color:transparent; -webkit-text-stroke:2px rgba(255,255,255,.9);
    will-change:transform;
  }
  .chap .mon{ font-family:'Noto Serif TC',serif; font-size:24px; font-weight:700; margin-top:10px; letter-spacing:.2em; }
  .chap .cnt{ font-size:13px; margin-top:6px; opacity:.9; letter-spacing:.1em; }

  /* ---------------- 結尾 ---------------- */
  .finale{
    min-height:80svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 16px calc(60px + env(safe-area-inset-bottom)); text-align:center;
  }
  .fin{
    width:min(62vw, 300px); aspect-ratio:3/4; border-radius:18px; overflow:hidden; margin-bottom:32px;
    box-shadow:0 24px 50px -18px rgba(58,46,34,.55), 0 0 0 1px rgba(58,46,34,.08);
    opacity:0; transform:translateY(60px) rotate(-8deg) scale(.9);
    transition:opacity .8s var(--ease), transform 1.1s var(--ease);
  }
  .fin.in{ opacity:1; transform:rotate(-3deg); }
  .fin img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bye{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:clamp(34px, 11vw, 56px);
    margin:0 0 28px; letter-spacing:.08em;
  }
  .bye .ch{ display:inline-block; opacity:0; filter:blur(8px); transform:translateY(16px); }
  .bye.in .ch{ animation:rise .9s var(--ease) forwards; }

  /* 小隊長的話：像一張信紙，內框一圈細線 */
  .letter{
    position:relative; width:100%; max-width:520px; margin:0 0 36px; text-align:left;
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:30px 24px 26px;
    box-shadow:0 18px 40px -20px rgba(58,46,34,.35);
  }
  .letter::before{
    content:''; position:absolute; inset:8px; border:1px solid var(--accent-soft);
    border-radius:10px; pointer-events:none;
  }
  .letter p{ margin:0 0 16px; font-size:15.5px; line-height:1.95; color:var(--ink); }
  .letter .hi{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px;
    color:var(--accent-deep); margin-bottom:18px;
  }
  /* 署名＋貼紙：貼紙的腳超出信紙下緣一點，像真的貼上去 */
  .letter{ margin-bottom:64px; }
  .sign{
    display:flex; align-items:flex-end; justify-content:flex-end; gap:6px;
    margin:6px -6px -62px 0; position:relative; z-index:1;
  }
  .sign .from{
    font-family:'Noto Serif TC',serif; font-weight:700; color:var(--accent-deep);
    margin-bottom:74px;
  }
  .sign .from::before{ content:'— '; }
  .captain{
    height:150px; width:auto; display:block;
    filter:drop-shadow(0 6px 10px rgba(58,46,34,.28));
    transform-origin:50% 100%;
    opacity:0; transform:scale(.3) rotate(-25deg);
  }
  /* 彈出來，之後一直小小地扭（過動） */
  .sign.in .captain{
    animation:pop .7s cubic-bezier(.34,1.56,.64,1) .35s forwards, wiggle 1.6s ease-in-out 1.2s infinite;
  }
  @keyframes pop{ to{ opacity:1; transform:scale(1) rotate(4deg); } }
  @keyframes wiggle{
    0%,100%{ opacity:1; transform:rotate(4deg); }
    50%{ opacity:1; transform:rotate(-4deg) translateY(-3px); }
  }
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .9s var(--ease), transform .9s var(--ease); }
  .reveal.in{ opacity:1; transform:none; }

  /* ---------------- 看大圖 ---------------- */
  .lb{
    position:fixed; inset:0; z-index:var(--z-help); background:#140e09;
    display:flex; flex-direction:column; color:#fff;
    opacity:0; transition:opacity .25s;
  }
  .lb.on{ opacity:1; }
  .lb-top{
    display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 8px 8px 16px;
  }
  .lb-top .n{ flex:1; font-size:13px; font-variant-numeric:tabular-nums; color:#d9cdbd; }
  .lb-btn{
    width:44px; height:44px; border-radius:50%; border:0; display:grid; place-items:center;
    background:rgba(255,255,255,.12); color:#fff; flex:none;
  }
  .lb-btn:active{ background:rgba(255,255,255,.24); }
  .lb-btn .ic{ width:22px; height:22px; }
  .lb-stage{ flex:1; min-height:0; position:relative; overflow:hidden; touch-action:pan-y; }
  .lb-stage img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    user-select:none; -webkit-user-drag:none;
  }
  .lb-foot{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom));
  }
  .lb-foot .t{ flex:1; min-width:0; text-align:center; }
  .lb-foot .t b{ display:block; font-family:'Noto Serif TC',serif; font-size:18px; }
  .lb-foot .t span{ font-size:13px; color:#d9cdbd; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important; animation-delay:0s !important;
      animation-iteration-count:1 !important; transition-duration:.01ms !important;
      transition-delay:0s !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');

  // ================= 照片 =================
  // 要改標題就改這裡的 t。s 是第幾次運動，同一次的照片會排在一起、前面插一張分隔卡。
  // f 是根目錄 memories/ 底下的檔名（第幾次-第幾張），d 是日期。照時間排。
  // f 留空會顯示色塊佔位。
  const PHOTOS = [
    {s:1, f:'01-1.jpg', t:'逢甲跑跑步', d:'2026-04-22'},

    {s:16, f:'16-2.jpg', t:'粉色網球', d:'2026-10-05'}
  ];
  // 結尾「最後...」上面那張
  const FINALE = 'finale.jpg';
  // 小隊長的話：第一行是開頭的招呼，中間一段一個字串，最後是署名
  const LETTER = {
    hi: '嗨一！我的小隊員們',
    body: [
      '從當初只是因為好玩而成立的健機小隊，到現在默默陪伴彼此走了半年。這一路上，真的很感謝每位小隊員的付出與支持，謝謝大家各司其職的一起讓這個小隊變得越來越好。',

      '最後，記得多來運動，保護好自己不要受傷了（我對自己說）！愛你們♡'
    ],
    from: '過動隊長',
    sticker: 'captain.png'   // 署名旁邊的去背貼紙照
  };
  // 測試站在 test/ 底下，照片共用根目錄那一份，兩邊才不用各放一套
  const PHOTO_DIR = /\/test\//.test(location.pathname) ? '../memories/' : 'memories/';
  const TEAM = '健機小隊';
  // 1–99 寫成國字：5 → 五、12 → 十二、20 → 二十
  function zh(n){
    const d = '零一二三四五六七八九';
    if(n < 10) return d[n];
    const t = Math.floor(n / 10), o = n % 10;
    return (t > 1 ? d[t] : '') + '十' + (o ? d[o] : '');
  }

  // 佔位圖：畫在 SVG 裡，離線也看得到
  function placeholder(i){
    const tones = [['#C79A74','#7C5236'],['#B9A27C','#6C7A52'],['#D2A86A','#A9744F'],['#C08A7A','#7C5236']];
    const [a,b] = tones[i % tones.length];
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'>" +
      "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='" + a + "'/>" +
      "<stop offset='1' stop-color='" + b + "'/></linearGradient></defs>" +
      "<rect width='400' height='500' fill='url(#g)'/>" +
      "<text x='200' y='250' font-family='serif' font-size='120' fill='rgba(255,255,255,.35)' text-anchor='middle' dominant-baseline='middle'>" +
      String(i+1).padStart(2,'0') + "</text></svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  function src(i){ return PHOTOS[i].f ? PHOTO_DIR + encodeURIComponent(PHOTOS[i].f) : placeholder(i); }
  // 牌底下那層糊掉的底圖：事先縮小糊好放在 memories/bg/，每張幾 KB。
  // 不要改回 CSS filter:blur——十幾張大圖疊在一起即時糊，手機捲起來會卡住。
  function bgSrc(i){ return PHOTOS[i].f ? PHOTO_DIR + 'bg/' + encodeURIComponent(PHOTOS[i].f) : placeholder(i); }
  function fmtDate(d){ return d ? d.replace(/-/g, '.') : ''; }

  // ================= 圖示（Feather） =================
  const ICONS = {
    left:'<polyline points="15 18 9 12 15 6"></polyline>',
    right:'<polyline points="9 18 15 12 9 6"></polyline>',
    close:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
    zoom:'<polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line>',
    back:'<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
    play:'<polygon points="6 3 20 12 6 21 6 3"></polygon>',
    pause:'<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>'
  };
  function ic(name){
    return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ================= 密碼 =================
  // 大家共用一組密碼。這裡只存 SHA-256，原始碼看不到明碼。
  // 換密碼：在 devtools console 執行下面這行，把結果貼到 PASS_HASH
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('新密碼')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
  // 注意：這只是擋住畫面，照片檔本身在 GitHub Pages 上是公開的。
  const PASS_HASH = 'f9809f2d2e60e9048a274a0dac5ee3f6ec7531ca847e5f953e76fa7e16d72b19';
  const SESSION_KEY = 'memories-ok';
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,'0')).join('');
  }
  function remember(ok){
    try{ ok ? localStorage.setItem(SESSION_KEY, PASS_HASH) : localStorage.removeItem(SESSION_KEY); }catch(e){}
  }
  // 存的是當下的雜湊；換了密碼，舊的記憶就自動失效
  function remembered(){
    try{ return localStorage.getItem(SESSION_KEY) === PASS_HASH; }catch(e){ return false; }
  }
  function renderGate(err){
    app.innerHTML = '<header class="top"><div class="brand">半年的小驚喜</div></header><div class="wrap">' +
      (err ? '<div class="msg err" role="alert">密碼不對。</div>' : '') +
      '<div class="card"><label class="fld"><span>密碼</span><input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
      '<button class="btn wide" id="go">打開</button>' +
      '<div class="foot"><a class="back" href="index.html">回運動排程</a></div></div></div>';
    const pw = document.getElementById('pw');
    pw.focus();
    const submit = async ()=>{
      // 前後空白不算，手機輸入法常常多帶一格
      if(await sha256Hex(pw.value.trim()) === PASS_HASH){ remember(true); renderMemoir(); }
      else renderGate(true);
    };
    document.getElementById('go').onclick = submit;
    // 手機的密碼欄會鎖住中文輸入法，所以用一般文字欄。
    // 注音選字時按的 Enter 是在確認選字，不是送出
    pw.onkeydown = (e)=>{ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) submit(); };
  }

  // ================= 回憶錄 =================
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let items = [];   // 疊牌的順序：分隔卡與照片混在一起 {type:'chap'|'photo', ...}

  // 每一次運動前面插一張分隔卡
  function buildItems(){
    items = [];
    let last = null;
    PHOTOS.forEach((p, i)=>{
      const all = PHOTOS.filter(x => x.s === p.s);
      if(p.s !== last){
        items.push({type:'chap', s:p.s, d:p.d, count:all.length});
        last = p.s;
      }
      items.push({type:'photo', i, nth:all.indexOf(p) + 1, of:all.length});
    });
  }

  function chars(text, base, step){
    return Array.from(text).map((c, k) =>
      '<span class="ch" style="animation-delay:' + (base + k*step).toFixed(2) + 's">' + esc(c) + '</span>').join('');
  }

  function renderMemoir(){
    buildItems();
    const cover = [Math.min(1, PHOTOS.length-1), 0, Math.min(2, PHOTOS.length-1)];

    let h = '<div class="progress" id="prog"></div>' +
      '<button class="auto-btn" id="autoBtn"></button>' +
      '<div class="counter" id="counter" aria-hidden="true"><b id="cNow">01</b> / ' + String(PHOTOS.length).padStart(2,'0') + '</div>';

    h += '<section class="hero" id="hero">' +
      '<div class="hero-text" id="heroText">' +
        '<p class="team">' + chars(TEAM, .05, .08) + '</p>' +
        '<h1>' + chars('半年', .4, .14) + '<span class="hl">' + chars('了', .68, 0) + '</span></h1>' +
      '</div>' +
      '<div class="fan" aria-hidden="true">' +
        cover.map((pi, k) => '<div class="fan-slot s' + k + '"><div class="fan-card"><img src="' + src(pi) + '" alt="" decoding="async"></div></div>').join('') +
      '</div>' +
    '</section>';

    h += '<section class="stack" id="stack">';
    let alt = 1;
    items.forEach((it, k)=>{
      if(it.type === 'chap'){
        h += '<div class="st-card chap" data-k="' + k + '">' +
          '<div class="big">' + String(it.s).padStart(2,'0') + '</div>' +
          '<div class="mon">第' + zh(it.s) + '次</div>' +
          '<div class="cnt">' + esc(fmtDate(it.d).slice(5)) + (it.count > 1 ? ' · ' + it.count + ' 張' : '') + '</div>' +
          '<div class="shade"></div></div>';
      }else{
        const p = PHOTOS[it.i];
        alt = -alt;
        h += '<button class="st-card" data-k="' + k + '" data-open="' + it.i + '" data-alt="' + alt + '" aria-label="' + esc(p.t) + '，看大圖">' +
          '<img class="bg" src="' + bgSrc(it.i) + '" alt="" loading="lazy" decoding="async">' +
          '<img class="ph" src="' + src(it.i) + '" alt="' + esc(p.t) + '" loading="lazy" decoding="async">' +
          '<span class="zoom" aria-hidden="true">' + ic('zoom') + '</span>' +
          '<span class="cap"><span class="num">第' + zh(p.s) + '次' + (it.of > 1 ? ' · ' + it.nth + '/' + it.of : '') + '</span>' +
          '<span class="ttl" style="display:block">' + esc(p.t) + '</span>' +
          '<span class="date">' + esc(fmtDate(p.d)) + '</span></span>' +
          '<span class="shade"></span></button>';
      }
    });
    h += '</section>';

    h += '<section class="finale">' +
      '<div class="fin" id="fin"><img src="' + PHOTO_DIR + FINALE + '" alt="大家的手疊在一起" loading="lazy" decoding="async"></div>' +
      '<div class="bye" id="bye">' + chars('最後...', 0, .12) + '</div>' +
      '<article class="letter" id="letter">' +
        '<p class="hi reveal">' + esc(LETTER.hi) + '</p>' +
        LETTER.body.map(t => '<p class="reveal">' + esc(t) + '</p>').join('') +
        '<div class="sign reveal" id="sign">' +
          '<span class="from">' + esc(LETTER.from) + '</span>' +
          '<img class="captain" src="' + PHOTO_DIR + LETTER.sticker + '" alt="' + esc(LETTER.from) + '" loading="lazy" decoding="async">' +
        '</div>' +
      '</article>' +
      '<a class="btn reveal" href="index.html">' + ic('back') + '回運動排程</a>' +
    '</section>';

    app.innerHTML = h;
    window.scrollTo(0, 0);

    app.querySelectorAll('[data-open]').forEach(b=>{
      b.onclick = ()=> openLightbox(+b.dataset.open, b);
    });

    setupScroll();
    setupReveals();
    setupAuto();
  }

  // ---------- 數字跳動、結尾照片牆 ----------
  function setupReveals(){
    const io = new IntersectionObserver((ents)=>{
      ents.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold:.25});
    io.observe(document.getElementById('bye'));
    io.observe(document.getElementById('fin'));
    // 信一段一段浮出來，讀到哪亮到哪
    app.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }

  // ---------- 跟著捲動走的效果 ----------
  let geo = null, cards = [], ticking = false, lastW = 0, lastH = 0;
  let heroText, fanSlots, prog, counter, cNow, stackEl;

  function measure(){
    const vw = window.innerWidth, vh = window.innerHeight;
    // 手機網址列伸縮會一直觸發 resize，高度只差一點點就不重算，免得牌跳來跳去
    if(geo && vw === lastW && Math.abs(vh - lastH) < 120) return;
    lastW = vw; lastH = vh;
    const cw = Math.min(vw - 32, 440);
    const ch = Math.min(Math.round(cw * 1.3), Math.round(vh * .72));
    const top = Math.max(56, Math.round((vh - ch) / 2));
    const gap = Math.round(vh * .38);
    const root = document.documentElement.style;
    root.setProperty('--cw', cw + 'px');
    root.setProperty('--ch', ch + 'px');
    root.setProperty('--top', top + 'px');
    root.setProperty('--gap', gap + 'px');
    // 牌的位置是固定間距排下來的，直接算，不去量黏住後的位置（黏住後量到的是假的）
    const stackTop = stackEl.getBoundingClientRect().top + window.scrollY;
    geo = {vh, top, step: ch + gap, stackTop};
  }

  function setupScroll(){
    heroText = document.getElementById('heroText');
    fanSlots = Array.from(app.querySelectorAll('.fan-slot'));
    prog = document.getElementById('prog');
    counter = document.getElementById('counter');
    cNow = document.getElementById('cNow');
    stackEl = document.getElementById('stack');
    cards = Array.from(stackEl.children).map(el => ({
      el, cap: el.querySelector('.cap'), big: el.querySelector('.big'),
      shade: el.querySelector('.shade'), alt: +(el.dataset.alt || 1),
      photo: el.dataset.open != null ? +el.dataset.open : -1, last: null
    }));
    geo = null;
    measure();
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onResize);
    update();
  }
  function onResize(){ measure(); onScroll(); }
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ ticking = false; update(); });
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function update(){
    const y = window.scrollY, vh = geo.vh;
    const docH = document.documentElement.scrollHeight - vh;
    prog.style.transform = 'scaleX(' + (docH > 0 ? clamp(y / docH, 0, 1) : 0) + ')';

    // 開場：往下捲時三張照片往兩邊飛開，標題縮小淡出
    const hp = clamp(y / (vh * .8), 0, 1);
    if(!reduce){
      heroText.style.transform = 'translateY(' + (-hp * 60) + 'px) scale(' + (1 - hp * .15) + ')';
      heroText.style.opacity = 1 - hp * 1.2;
      const e = hp * hp;
      fanSlots[0].style.transform = 'translate(' + (-e * 70) + 'vw,' + (e * 20) + 'vh) rotate(' + (-e * 28) + 'deg)';
      fanSlots[1].style.transform = 'translateY(' + (-e * 25) + 'vh) scale(' + (1 + e * .35) + ')';
      fanSlots[2].style.transform = 'translate(' + (e * 70) + 'vw,' + (e * 20) + 'vh) rotate(' + (e * 28) + 'deg)';
      fanSlots[1].style.opacity = 1 - e;
    }

    // 疊牌：d < 0 還在下面飛上來，d = 0 剛好黏住，d > 0 已經被後面的蓋住幾張
    let current = -1;
    cards.forEach((c, k)=>{
      const d = clamp((y - (geo.stackTop + k * geo.step - geo.top)) / geo.step, -1.5, 4);
      if(c.photo >= 0 && d > -.5) current = c.photo;
      if(reduce || c.last === d) return;
      c.last = d;
      if(d < 0){
        // 斜斜地飛進來，越接近黏住的位置越正
        const t = Math.min(1, -d);
        c.el.style.transform = 'translateX(' + (c.alt * t * 14) + '%) rotate(' + (c.alt * t * 9) + 'deg) scale(' + (1 - t * .06) + ')';
        c.el.style.opacity = 1;
        c.shade.style.opacity = 0;
        if(c.cap){
          c.cap.style.opacity = clamp(1 - t * 2.2, 0, 1);
          c.cap.style.transform = 'translateY(' + (t * 40) + 'px)';
        }
        if(c.big) c.big.style.transform = 'translateX(' + (t * 40) + '%)';
      }else{
        // 被蓋住的往後縮、往上露出一條邊、變暗；蓋到第四張就消失
        const dd = Math.min(d, 3);
        c.el.style.transform = 'translateY(' + (-dd * 14) + 'px) scale(' + (1 - dd * .06) + ')';
        c.el.style.opacity = clamp(4 - d, 0, 1);
        c.shade.style.opacity = Math.min(d, 1.5) * .3;
        if(c.cap){ c.cap.style.opacity = 1; c.cap.style.transform = 'none'; }
        if(c.big) c.big.style.transform = 'translateX(' + (-Math.min(d, 1) * 20) + '%)';
      }
    });

    // 疊牌整段捲完就把張數收起來
    const stackEnd = geo.stackTop + stackEl.offsetHeight - vh;
    const inStack = current >= 0 && y < stackEnd;
    counter.classList.toggle('on', inStack);
    if(inStack) cNow.textContent = String(current + 1).padStart(2, '0');
  }

  // ================= 自動翻頁 =================
  // 像幻燈片：一張捲到剛好黏住的位置，停一下，再翻下一張。
  // 手指一碰、滾輪、按鍵就停，不跟人搶；右下角的鈕可以再接著播。
  const HOLD_PHOTO = 1500, HOLD_CHAP = 800, MOVE = 800, OPENING = 2000;
  let auto = {on:false, timer:0, raf:0};
  function autoTargets(){
    const t = cards.map((c, k) => ({
      y: Math.round(geo.stackTop + k * geo.step - geo.top),
      hold: c.photo >= 0 ? HOLD_PHOTO : HOLD_CHAP
    }));
    const fin = document.querySelector('.finale');
    t.push({y: Math.min(fin.offsetTop, document.documentElement.scrollHeight - window.innerHeight), hold:0});
    return t;
  }
  function setAutoBtn(){
    const b = document.getElementById('autoBtn');
    if(!b) return;
    b.innerHTML = ic(auto.on ? 'pause' : 'play');
    b.setAttribute('aria-label', auto.on ? '暫停自動翻頁' : '自動翻頁');
  }
  function stopAuto(){
    clearTimeout(auto.timer);   // 開場還在等的那一次也要取消
    if(!auto.on) return;
    auto.on = false;
    cancelAnimationFrame(auto.raf);
    setAutoBtn();
  }
  function startAuto(){
    auto.on = true;
    setAutoBtn();
    autoNext();
  }
  function autoNext(){
    if(!auto.on) return;
    const y0 = window.scrollY;
    const next = autoTargets().find(t => t.y > y0 + 4);
    if(!next){ stopAuto(); return; }
    const t0 = performance.now(), dist = next.y - y0;
    const dur = MOVE;
    const step = (now)=>{
      if(!auto.on) return;
      const p = Math.min(1, (now - t0) / dur);
      const e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;   // 慢起慢停
      window.scrollTo(0, y0 + dist * e);
      if(p < 1) auto.raf = requestAnimationFrame(step);
      else auto.timer = setTimeout(autoNext, next.hold);
    };
    auto.raf = requestAnimationFrame(step);
  }
  function setupAuto(){
    document.getElementById('autoBtn').onclick = (e)=>{
      e.stopPropagation();
      auto.on ? stopAuto() : startAuto();
    };
    // 只看人的動作，不看 scroll 事件——自己捲的也會觸發 scroll
    ['wheel', 'touchstart', 'keydown'].forEach(ev =>
      window.addEventListener(ev, (e)=>{
        if(e.target && e.target.closest && e.target.closest('#autoBtn')) return;
        stopAuto();
      }, {passive:true}));
    setAutoBtn();
    // 開場動畫跑完再開始翻；設定了減少動態效果的就不自動開始
    if(!reduce) auto.timer = setTimeout(()=>{ if(window.scrollY < 10) startAuto(); }, OPENING);
  }

  // ================= 看大圖 =================
  let lb = null, lbIdx = 0, lbFrom = null;
  function openLightbox(i, from){
    stopAuto();
    lbFrom = from; lbIdx = i;
    lb = document.createElement('div');
    lb.className = 'lb';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.innerHTML =
      '<div class="lb-top"><span class="n" id="lbN"></span>' +
        '<button class="lb-btn" id="lbX" aria-label="關閉">' + ic('close') + '</button></div>' +
      '<div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>' +
      '<div class="lb-foot">' +
        '<button class="lb-btn" id="lbP" aria-label="上一張">' + ic('left') + '</button>' +
        '<div class="t"><b id="lbT"></b><span id="lbD"></span></div>' +
        '<button class="lb-btn" id="lbNx" aria-label="下一張">' + ic('right') + '</button></div>';
    document.body.appendChild(lb);
    document.body.classList.add('lb-open');
    requestAnimationFrame(()=> lb.classList.add('on'));
    showLb();
    document.getElementById('lbX').onclick = closeLightbox;
    document.getElementById('lbP').onclick = ()=> stepLb(-1);
    document.getElementById('lbNx').onclick = ()=> stepLb(1);
    document.getElementById('lbX').focus();
    document.addEventListener('keydown', lbKey);

    // 左右滑換張：手指拖著圖走，放開時超過 60px 就換
    const stage = document.getElementById('lbStage'), img = document.getElementById('lbImg');
    let x0 = null, dx = 0;
    stage.onpointerdown = (e)=>{ x0 = e.clientX; dx = 0; img.style.transition = 'none'; stage.setPointerCapture(e.pointerId); };
    stage.onpointermove = (e)=>{
      if(x0 == null) return;
      dx = e.clientX - x0;
      img.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 40) + 'deg)';
      img.style.opacity = 1 - Math.min(Math.abs(dx) / 400, .5);
    };
    const end = ()=>{
      if(x0 == null) return;
      x0 = null;
      img.style.transition = 'transform .3s var(--ease), opacity .3s';
      if(Math.abs(dx) > 60) stepLb(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1);
      else{ img.style.transform = ''; img.style.opacity = ''; }
    };
    stage.onpointerup = end;
    stage.onpointercancel = end;
  }
  function showLb(){
    const p = PHOTOS[lbIdx];
    document.getElementById('lbImg').src = src(lbIdx);
    document.getElementById('lbImg').alt = p.t;
    document.getElementById('lbN').textContent = String(lbIdx+1).padStart(2,'0') + ' / ' + String(PHOTOS.length).padStart(2,'0');
    document.getElementById('lbT').textContent = p.t;
    document.getElementById('lbD').textContent = fmtDate(p.d);
  }
  function stepLb(dir, fling){
    const img = document.getElementById('lbImg');
    const n = PHOTOS.length;
    const go = ()=>{
      lbIdx = (lbIdx + dir + n) % n;
      showLb();
      img.style.transition = 'none';
      img.style.transform = 'translateX(' + (dir * 40) + 'px)';
      img.style.opacity = 0;
      requestAnimationFrame(()=>{
        img.style.transition = 'transform .35s var(--ease), opacity .3s';
        img.style.transform = '';
        img.style.opacity = '';
      });
    };
    if(fling && !reduce){
      img.style.transform = 'translateX(' + (fling * 60) + '%) rotate(' + (fling * 8) + 'deg)';
      img.style.opacity = 0;
      setTimeout(go, 200);
    }else go();
  }
  function lbKey(e){
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') stepLb(-1);
    else if(e.key === 'ArrowRight') stepLb(1);
  }
  function closeLightbox(){
    if(!lb) return;
    document.removeEventListener('keydown', lbKey);
    document.body.classList.remove('lb-open');
    const el = lb; lb = null;
    el.classList.remove('on');
    setTimeout(()=> el.remove(), 250);
    if(lbFrom) lbFrom.focus({preventScroll:true});
  }

  // ================= 啟動 =================
  if(remembered()) renderMemoir();
  else renderGate(false);
})();
</script>
</body>
</html>
